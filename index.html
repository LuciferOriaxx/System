<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>The System</title>
<style>
:root{--bg:#0a0e14;--panel:#111823;--line:#1d2836;--txt:#c8d4e4;--dim:#6b7c93;
  --accent:#4da6ff;--gold:#ffc857;--danger:#ff5c5c;--ok:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:76px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:13px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
h2{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:24px 0 10px}
h3{font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.bar{height:6px;background:#0a0e14;border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
button{font:inherit;color:var(--txt);background:#16202e;border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;cursor:pointer;min-height:42px}
button:active{background:#1d2836}
button.primary{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.sm{padding:6px 10px;min-height:34px;font-size:13px}
input,select,textarea{font:inherit;color:var(--txt);background:#0a0e14;border:1px solid var(--line);
  border-radius:8px;padding:10px;width:100%;min-height:42px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{width:auto;min-height:auto}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.dim{color:var(--dim)}
.small{font-size:12px}
.tag{font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:4px;background:#1d2836;color:var(--dim)}
.tag.on{background:rgba(77,166,255,.15);color:var(--accent)}
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:none}
.chk{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;cursor:pointer}
.chk.done{background:var(--accent);border-color:var(--accent);color:#06121f}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d131c;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
nav button{flex:1;background:none;border:none;border-radius:0;padding:14px 2px;min-height:60px;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
nav button.active{color:var(--accent)}
.logrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.logrow:last-child{border-bottom:none}
.xp{color:var(--accent);font-family:ui-monospace,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.1em}
.field .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.4}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal h2{margin-top:0;margin-bottom:16px}
.skill-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.skill-row:last-child{border-bottom:none}
.exercise-row{display:grid;grid-template-columns:1fr 60px 70px 30px;gap:8px;
  align-items:center;margin-bottom:8px}
.exercise-row input{min-height:38px;padding:6px 8px;font-size:14px}
.notice{background:rgba(77,166,255,.08);border:1px solid rgba(77,166,255,.25);
  border-radius:8px;padding:12px;font-size:13px;margin-bottom:16px}
.notice.ok{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.25)}
.hide{display:none}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin-bottom:12px;overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';color:var(--dim);font-size:18px;font-weight:400}
details[open]>summary::after{content:'−'}
details>summary:active{background:#16202e}
.tier-list{padding:0 6px 8px;border-top:1px solid var(--line)}
.tier-row{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;
  border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.tier-row:last-child{border-bottom:none}
.tier-row:active{background:#1d2836}
.tier-row.current{background:rgba(77,166,255,.08)}
.tier-row.below{opacity:.55}
.tier-val{width:26px;text-align:right;font-family:ui-monospace,monospace;
  font-weight:600;font-size:14px;color:var(--dim);flex:0 0 auto;padding-top:1px}
.tier-row.current .tier-val{color:var(--accent);font-weight:700}
.tier-desc{flex:1;font-size:13px;line-height:1.4}
.prog-section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
</style>
</head>
<body>

<main id="app" class="wrap"></main>
<div id="modal"></div>

<nav id="nav" class="hide">
  <button data-tab="status" class="active">Status</button>
  <button data-tab="quests">Quests</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="bench">Stats</button>
  <button data-tab="log">Log</button>
  <button data-tab="more">More</button>
</nav>

<script>
/* ═════ RULES ═════ */
const xpForLevel = n => 50 * n * (n - 1);
function levelFromXP(xp){ let n = 1; while (xpForLevel(n+1) <= xp) n++; return n; }
const skillXpForLevel = L => 10 * L;
const RANK_TABLE = [[50,'S'],[40,'A'],[30,'B'],[20,'C'],[10,'D'],[1,'E']];
const rankOf = lvl => RANK_TABLE.find(([m]) => lvl >= m)[1];
function addSkillXP(skill, amount){
  skill.xp += amount;
  let leveled = 0;
  while (skill.level < 50 && skill.xp >= skillXpForLevel(skill.level)){
    skill.xp -= skillXpForLevel(skill.level); skill.level++; leveled++;
  }
  if (skill.level >= 50) skill.xp = 0;
  return leveled;
}

/* ═════ BENCHMARKS ═════ */
const BENCHMARKS = {
  STR: {
    label: 'Strength',
    note: 'Bodyweight. A chair, table or wall counts — nothing else is needed. Stop each test when form breaks. Tiers 60+ assume a pullup bar, but 8 pullups can be swapped for 30 inverted rows under a sturdy table.',

      [30,  '35 pushups · 50 squats · 90s plank · 15 chair dips · wall handstand 30s'],
      [40,  '45 pushups · 60 squats · 2 min plank · 20 floor dips · floor L-sit 10s'],
      [50,  '50 pushups · 3 min plank · 25 dips · L-sit 20s · free handstand 10s'],
      [60,  '60 pushups · 8 pullups (or 30 table rows) · handstand 30s'],

  },

  },

  },

    label: 'Intelligence',
    note: 'Books with notes, courses, applied learning. Scored on the last 12 months only.',
    tiers: [
      [5,  '1 book finished · keeping a journal'],
      [10, '6 books/year with notes'],
      [20, '12 books/year · apply 1 idea per book · 1 course done'],
      [30, '18 books/year · 2 courses · built something with the knowledge'],
      [40, '24 books/year · taught a concept publicly'],
      [50, '30+ books/year · original synthesis · language B1'],
      [60, 'Language B2 · publishing regularly'],
      [70, 'Recognised competence · language C1']
    ]
  },
  PER: {
    label: 'Perception',
    note: 'Focus and attention. Three valid routes — pick one and stick to it: meditation, written reflection, or undistracted reading.',
    tiers: [
      [1,  'Floor — no practice'],
      [5,  '5 min meditation OR 10 min written reflection OR 15 min undistracted reading'],
      [10, '10 min meditation OR 15 min reflection OR 25-min block, phone elsewhere'],
      [20, '20 min practice OR two 25-min blocks'],
      [30, '45 min uninterrupted deep work · 15 min practice'],
      [40, '90-min deep work block · 3 days no doom-scrolling'],
      [50, '2h deep work daily · 30 min practice · 3 recorded observations/day'],
      [60, '3h deep work · 45 min practice'],
      [70, '4h+ sustained focus']
    ]
  }
};

/* ═════ EQUIPMENT ═════ */
const EQUIPMENT_OPTIONS = [
  { id: 'pullup_bar', label: 'Pullup bar' },
  { id: 'dumbbells', label: 'Dumbbells' },
  { id: 'barbell', label: 'Barbell + plates' },
  { id: 'kettlebell', label: 'Kettlebell' },
  { id: 'bands', label: 'Resistance bands' },
  { id: 'dip_bars', label: 'Dip bars / parallel bars' },
  { id: 'rings', label: 'Gymnastic rings' },
  { id: 'bench', label: 'Weight bench' },
  { id: 'jump_rope', label: 'Jump rope' },
  { id: 'cardio_machine', label: 'Cardio machine (bike/treadmill)' },
  { id: 'mat', label: 'Exercise mat' },
  { id: 'chair', label: 'Sturdy chair' },
  { id: 'table', label: 'Sturdy table' }
];

/* ═════ SKILL SUGGESTIONS ═════ */
const SKILL_SUGGESTIONS = [
  { id: 'fitness', label: 'Fitness & strength', ask: 'What type?', options: ['Calisthenics', 'Weightlifting', 'Running', 'Yoga', 'Pilates', 'Mixed fitness'], subtype: 'fitness' },
  { id: 'language', label: 'Learn a language', ask: 'Which language?', options: ['Spanish', 'French', 'German', 'Italian', 'Japanese', 'Mandarin', 'Arabic', 'Portuguese', 'Dutch', 'Other'], subtype: 'language' },
  { id: 'coding', label: 'Learn to code', ask: 'Focus?', options: ['Web development', 'Mobile apps', 'Game development', 'Data science', 'Automation / scripting', 'Full-stack'], subtype: 'coding' },
  { id: 'business', label: 'Build a business', ask: 'What type?', options: ['Not decided yet', 'Freelancing', 'E-commerce', 'SaaS / software', 'Consulting', 'Local service', 'Content / creator', 'Other'], subtype: 'business' },
  { id: 'reading', label: 'Read more', ask: 'Preference?', options: ['Non-fiction', 'Fiction', 'Both', 'Business', 'Science', 'History', 'Philosophy'], subtype: 'reading' },
  { id: 'writing', label: 'Write a book', ask: 'What kind?', options: ['Non-fiction', 'Fiction', 'Essay collection', 'Memoir', 'Technical', 'Not sure yet'], subtype: 'writing' },
  { id: 'instrument', label: 'Learn an instrument', ask: 'Which one?', options: ['Guitar', 'Piano', 'Drums', 'Bass', 'Violin', 'Ukulele', 'Other'], subtype: 'instrument' },
  { id: 'art', label: 'Art & drawing', ask: 'What kind?', options: ['Drawing', 'Painting', 'Digital art', 'Sculpture', 'Photography'], subtype: 'art' },
  { id: 'mind', label: 'Mind & focus', ask: 'Practice?', options: ['Meditation', 'Journaling', 'Chess', 'Deep work'], subtype: 'mind' },
  { id: 'publicspeaking', label: 'Public speaking', ask: 'Context?', options: ['Work presentations', 'Debate', 'Teaching', 'Content creation'], subtype: 'publicspeaking' },
  { id: 'engineering', label: 'Engineering / technical', ask: 'Branch?', options: ['Civil', 'Mechanical', 'Electrical', 'Software', 'Other'], subtype: 'engineering' },
  { id: 'cooking', label: 'Cooking', ask: 'Focus?', options: ['Everyday cooking', 'Baking', 'Specific cuisine', 'Professional'], subtype: 'cooking' }
];

/* ═════ LADDERS ═════ */
const LADDER_PRESETS = {
  language: ['A1 — 500 words, present tense, introduce yourself', 'A2 — 1,500 words, past tenses, 15-min conversation', 'B1 — 3,000 words, all major tenses, 30-min conversation, read news', 'B2 — 5,000 words, subjunctive, 1-hour discussion, series without subtitles', 'C1 — Professional fluency', 'C2 — Native-adjacent'],
  coding: ['HTML + CSS — one static page live', 'Git + first GitHub repo', 'JS basics — variables, functions, loops', '3 small projects built and deployed', 'Python — one working script', 'One API + database, full CRUD', 'TypeScript + React', 'Auth working on a real project', 'Ship something a stranger uses', 'Open-source contribution or a full game'],
  business: ['Idea or niche written down in one sentence', '10 customer conversations done', 'One-page proposition written', 'Company registered, bank open, domain secured', 'MVP live — public, usable', 'First customer enquiry', 'First paying customer', '10 paying customers or £500 / 3 months', '£2k / 3 months recurring', '£10k / 3 months — systems, small team', '£50k / 3 months — market leader'],
  reading: ['1 book finished this month', '6 books/year with notes', '12 books/year with applied ideas', '18 books/year, one project built from them', '24 books/year', '30+ books/year — original synthesis'],
  writing: ['Premise + outline', 'First 1,000 words', 'First chapter', '10k words', '30k words — Act 1 complete', 'Full first draft', 'Beta readers engaged', 'Edited draft', 'Submission or self-pub ready', 'Published — reviews, sales'],
  fitness: ['Complete first full workout', '1 week of consistent workouts', '4 weeks consistent', 'First PR (new max in any lift/movement)', 'Noticeable strength gain', '8 weeks consistent — habit locked', 'Complete a full program', 'Hit intermediate benchmarks (see STR)', 'Hit advanced benchmarks', 'Maintain consistency for 1 year'],
  engineering: ['Branch chosen', 'Maths and mechanics refreshed', 'CAD refresher done', '3 portfolio drawings or models', 'Professional body membership (EngTech route)', 'Portfolio project complete', '5 applications submitted', 'First interview', 'First role or contract', 'Professional registration'],
  art: ['Foundational technique studied', 'First 30 drawings/sketches done', 'One coherent series (10 pieces)', 'Public sharing begun', 'First commission or sale', 'Recognisable style', 'Local exhibition or feature', 'Consistent body of work'],
  instrument: ['First chord or scale learned', '15 min practice daily for a week', 'Play a simple song end-to-end', 'Basic scales in 2 keys', 'Barre chords or equivalent technique', 'Play 5 songs by memory', 'Play with another musician', 'First performance (any setting)', 'Compose or improvise', 'Comfortable across keys and styles'],
  mind: ['Started daily practice', '1 week consistent', '4 weeks consistent', '30 min uninterrupted session', 'Noticeable focus change in daily life', '45 min session or equivalent', '3 months consistent', 'Practice becomes automatic'],
  publicspeaking: ['First 3-min speech recorded on phone', 'Studied one speaking framework', 'Presented to 1 person', 'Presented to 5 people', 'Presented to 20 people', 'Joined a local speaking club', 'First formal speech', 'First paid or invited talk'],
  cooking: ['First meal cooked from scratch', '10 recipes learned by heart', 'Cook a full meal for 4 people', 'Knife skills practiced', 'One consistent cuisine learned', 'Confident with any ingredient given', 'First dish you would serve a chef', 'Cookbook or blog started']
};
function defaultLadderFor(subtype){ return LADDER_PRESETS[subtype] ? [...LADDER_PRESETS[subtype]] : null; }

/* ═════ HELPERS ═════ */
const newId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2, '0');
function today(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function yesterday(){
  const d = new Date(); d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dayName(n){ return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n]; }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ═════ STATE ═════ */
const KEY = 'the-system-v2';
const DEFAULT_STATS = { STR: 5, AGI: 5, VIT: 5, INT: 5, PER: 1 };

function defaultState(){
  return {
    v: 4, onboarded: false, name: '', totalXP: 0,
    stats: { ...DEFAULT_STATS }, statDates: {},
    skills: [], streak: 0, lastComplete: null,
    quests: {}, log: [], benchmarks: [], titles: [],
    equipment: [],
    settings: { apiKey: '', apiBase: 'https://api.openai.com/v1', apiModel: 'gpt-4o-mini' }
  };
}

function migrateSkill(s){
  if (!s.subtype){
    const n = (s.name || '').toLowerCase();
    if (n.includes('calisthen') || n.includes('fitness') || n.includes('strength') || n.includes('weight')) s.subtype = 'fitness';
    else if (n.includes('spanish') || n.includes('french') || n.includes('german') || n.includes('langu')) s.subtype = 'language';
    else if (n.includes('code') || n.includes('cod')) s.subtype = 'coding';
    else if (n.includes('business')) s.subtype = 'business';
    else if (n.includes('read')) s.subtype = 'reading';
    else if (n.includes('writ')) s.subtype = 'writing';
    else if (n.includes('engineer')) s.subtype = 'engineering';
    else s.subtype = 'custom';
    s.detail = s.detail || s.name || '';
    s.status = s.status || '';
    s.ladder = defaultLadderFor(s.subtype);
    s.ladderDone = [];
  }
  if (!s.ladderDone) s.ladderDone = [];
  if (!s.ladderEarned) s.ladderEarned = [...s.ladderDone]; // migration: prior ticks paid XP
  return s;
}

let state = load();
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    const parsed = Object.assign(defaultState(), JSON.parse(raw));
    if (parsed.skills) parsed.skills = parsed.skills.map(migrateSkill);
    if (!parsed.equipment) parsed.equipment = [];
    return parsed;
  } catch(e){ return defaultState(); }
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}

function addXP(amount, note){
  state.totalXP += amount;
  state.log.unshift({ date: today(), xp: amount, note });
  state.log = state.log.slice(0, 500);
}

/* ═════ PROGRESSION QUESTIONS ═════ */
function progressionFor(skill){
  const sub = skill.subtype || 'custom';
  const detail = skill.detail || skill.name || '';

  if (sub === 'fitness') return [
    { id: 'level', label: 'Where are you now?', options: [
      { value: 'beginner',     label: 'Beginner — new or returning', planLevel: 'beginner', preTick: [] },
      { value: 'intermediate', label: 'Intermediate — training for months', planLevel: 'intermediate', preTick: [0,1,2,3] },
      { value: 'advanced',     label: 'Advanced — years of consistent training', planLevel: 'advanced', preTick: [0,1,2,3,4,5,6] }
    ]},
    { id: 'equipment', label: 'What equipment do you have?', type: 'equipment' }
  ];

  if (sub === 'language') return [
    { id: 'level', label: `Current level in ${detail}`, options: [
      { value: 'A0', label: 'Never studied', preTick: [] },
      { value: 'A1', label: 'A1 — 500 words, basic phrases', preTick: [0] },
      { value: 'A2', label: 'A2 — simple conversations', preTick: [0,1] },
      { value: 'B1', label: 'B1 — comfortable everyday conversation', preTick: [0,1,2] },
      { value: 'B2', label: 'B2 — fluent discussion', preTick: [0,1,2,3] },
      { value: 'C1', label: 'C1 — professional fluency', preTick: [0,1,2,3,4] }
    ]}
  ];

  if (sub === 'business') return [
    { id: 'stage', label: 'Where are you now?', options: [
      { value: 'not_decided', label: "I haven't decided what business to start", preTick: [] },
      { value: 'idea',        label: 'I have an idea or niche', preTick: [0] },
      { value: 'researching', label: 'Doing customer research', preTick: [0,1] },
      { value: 'registered',  label: 'Registered, bank open, domain secured', preTick: [0,1,2,3] },
      { value: 'mvp',         label: 'MVP or site is live', preTick: [0,1,2,3,4] },
      { value: 'first_customer', label: 'I have paying customers', preTick: [0,1,2,3,4,5,6] }
    ]},
    { id: 'type', label: 'What kind of business?', onlyIf: a => a.stage && a.stage !== 'not_decided', options: [
      { value: 'Freelancing',    label: 'Freelancing / consulting' },
      { value: 'E-commerce',     label: 'E-commerce / physical product' },
      { value: 'SaaS',           label: 'Software / app' },
      { value: 'Local service',  label: 'Local service' },
      { value: 'Content',        label: 'Content / creator' },
      { value: 'Other',          label: 'Something else' }
    ]}
  ];

  if (sub === 'coding') return [
    { id: 'level', label: 'Where are you now?', options: [

/* ═════ APPLY PROGRESSION TO SKILL ═════ */
function applyProgression(skill, answers){
  const questions = progressionFor(skill);
  let statusParts = [];
  let preTick = null;
  let planLevel = null;

  questions.forEach(q => {
    if (q.type === 'equipment') return;
    if (q.onlyIf && !q.onlyIf(answers)) return;
    const val = answers[q.id];
    if (!val) return;
    const opt = q.options.find(o => o.value === val);
    if (!opt) return;
    statusParts.push(opt.label);
    if (opt.preTick) preTick = opt.preTick;
    if (opt.planLevel) planLevel = opt.planLevel;
  });

  skill.status = statusParts.join(' — ') || skill.status || '';

  if (preTick){
    skill.ladderDone = [...preTick];
    skill.ladderEarned = [...preTick];
  }

  if (answers.type) skill.detail = answers.type;

  if (skill.type === 'workout' && planLevel) applyFitnessPlan(skill, planLevel);

  // regenerate default quests based on new status
  if (skill.type === 'standard'){
    skill.quests = defaultQuestsForSkill(skill);
  }
}

function applyFitnessPlan(skill, level){
  const hasBar = (state.equipment || []).includes('pullup_bar');
  const hasDipBars = (state.equipment || []).includes('dip_bars');
  const pullName = hasBar ? 'Pullups' : 'Table rows';
  const dipName = hasDipBars ? 'Dips' : 'Chair dips';

  const base = {
    beginner:     { pushups: 10, squats: 15, dips: 8,  crunches: 15, plank: 30, pulls: 6 },
    intermediate: { pushups: 20, squats: 25, dips: 12, crunches: 20, plank: 45, pulls: 8 },
    advanced:     { pushups: 30, squats: 35, dips: 15, crunches: 25, plank: 60, pulls: 10 }
  }[level] || { pushups: 15, squats: 20, dips: 10, crunches: 20, plank: 40, pulls: 8 };

  const exercises = [
    { name: 'Pushups',  sets: 4, reps: base.pushups,  unit: 'reps' },
    { name: 'Squats',   sets: 4, reps: base.squats,   unit: 'reps' },
    { name: dipName,    sets: 4, reps: base.dips,     unit: 'reps' },
    { name: 'Crunches', sets: 4, reps: base.crunches, unit: 'reps' },
    { name: 'Plank',    sets: 4, reps: base.plank,    unit: 'sec'  }
  ];
  if (hasBar || level !== 'beginner'){
    exercises.push({ name: pullName, sets: 4, reps: base.pulls, unit: 'reps' });
  }
  skill.plan = { exercises, workoutDays: [1, 3, 5], attemptDay: 0 };
}

/* ═════ DEFAULT QUESTS PER SKILL ═════ */
function defaultQuestsForSkill(skill){
  const sub = skill.subtype || 'custom';
  const status = (skill.status || '').toLowerCase();
  const name = skill.name || 'practice';

  if (sub === 'language'){
    if (/a2|b1|b2|c1/i.test(status)) return [
      { id: newId(), text: `${name} — 15 min speaking practice`, xp: 4 },
      { id: newId(), text: `Read 15 min in ${name}`, xp: 3 },
      { id: newId(), text: '10 new vocabulary words', xp: 2 }
    ];
    return [
      { id: newId(), text: `${name} — 15 min vocabulary practice`, xp: 3 },
      { id: newId(), text: `5 min listening in ${name}`, xp: 2 },
      { id: newId(), text: '5 new words learned', xp: 2 }
    ];
  }
  if (sub === 'business'){
    if (/not decided|idea/i.test(status)) return [
      { id: newId(), text: '15 min market research', xp: 3 },
      { id: newId(), text: '1 business task (writing, reading, contacting)', xp: 5 }
    ];
    return [
      { id: newId(), text: '1 customer or client conversation', xp: 5 },
      { id: newId(), text: '30 min on the live business', xp: 5 }
    ];
  }
  if (sub === 'coding'){
    if (/never|beginner|basics/i.test(status)) return [
      { id: newId(), text: '20 min coding practice', xp: 4 },
      { id: newId(), text: 'Read one tutorial or doc page', xp: 2 }
    ];
    return [
      { id: newId(), text: '30 min on your coding project', xp: 6 },
      { id: newId(), text: 'Review or refactor one thing', xp: 3 }
    ];
  }
  if (sub === 'reading'){
    return [
      { id: newId(), text: 'Read 30 min, phone away', xp: 5 },
      { id: newId(), text: '3 sentences of notes on what you read', xp: 2 }
    ];
  }
  if (sub === 'writing'){
    if (/idea|outline/i.test(status)) return [
      { id: newId(), text: 'Write 200 words of premise / outline', xp: 3 }
    ];
    if (/first_words|first_chapter|mid_draft/i.test(status)) return [
      { id: newId(), text: 'Write 500 words', xp: 5 }
    ];
    if (/draft_done|editing|published/i.test(status)) return [
      { id: newId(), text: '30 min editing or marketing', xp: 5 }
    ];
    return [{ id: newId(), text: 'Write 300 words', xp: 5 }];
  }
  if (sub === 'engineering'){
    return [
      { id: newId(), text: '30 min technical study or practice', xp: 5 },
      { id: newId(), text: '1 portfolio step', xp: 3 }
    ];
  }
  if (sub === 'fitness'){
    return [{ id: newId(), text: `${name} — 20 min session`, xp: 4 }];
  }
  return [{ id: newId(), text: `${name} — 20 min focused practice`, xp: 5 }];
}

/* ═════ QUESTS ═════ */
function questsForToday(){
  const day = new Date().getDay();
  const list = [];
  state.skills.filter(s => s.active).forEach(skill => {
    if (skill.type === 'workout' && skill.plan){
      const plan = skill.plan;
      if (day === plan.attemptDay){
        list.push({ id: `${skill.id}:attempt`, skillId: skill.id, kind: 'attempt',
          text: `${skill.name} — Attempt day: test your max reps`, xp: 50 });
      } else if (plan.workoutDays.includes(day)){
        const summary = plan.exercises.map(e => `${e.sets}×${e.reps} ${e.name}`).join(' · ');
        list.push({ id: `${skill.id}:workout`, skillId: skill.id, kind: 'workout',
          text: `${skill.name}: ${summary}`, xp: 15 });
      }
    } else if (skill.quests){
      skill.quests.forEach(q => list.push({
        id: `${skill.id}:${q.id}`, skillId: skill.id, kind: 'standard', text: q.text, xp: q.xp
      }));
    }
  });
  return list;
}
function isQuestDone(qid){
  return !!(state.quests[today()] && state.quests[today()][qid]);
}
function toggleQuest(quest){
  const t = today();
  state.quests[t] = state.quests[t] || {};
  if (state.quests[t][quest.id]){
    delete state.quests[t][quest.id];
  } else {
    state.quests[t][quest.id] = true;
    addXP(quest.xp, quest.text);
    const skill = state.skills.find(s => s.id === quest.skillId);
    if (skill){
      const leveled = addSkillXP(skill, quest.xp);
      if (leveled) addXP(0, `${skill.name} reached Lv ${skill.level}`);
    }
    updateStreak();
  }
  save();
}
function updateStreak(){
  const t = today();
  const q = state.quests[t] || {};
  if (Object.keys(q).length === 0) return;
  if (state.lastComplete === t) return;
  state.streak = (state.lastComplete === yesterday()) ? state.streak + 1 : 1;
  state.lastComplete = t;
  if (state.streak % 7 === 0) addXP(50, `7-day streak (day ${state.streak})`);
}

/* ═════ AI ═════ */
function buildQuestAIPrompt(skillName, level){
  return `Generate 6 concrete daily practice quests for someone learning "${skillName}" at level ${level}/50. Each quest must be specific, self-contained, 20–60 min, doable at home.

Return ONLY a valid JSON array of 6 strings. No markdown, no preamble.

Example: ["Quest 1","Quest 2","Quest 3","Quest 4","Quest 5","Quest 6"]`;
}
function buildLadderAIPrompt(skill){
  let context = '';
  if (skill.subtype === 'business' && skill.detail && /not decided/i.test(skill.detail)){
    context = `\n\nThe person hasn't chosen what business to start. First suggest 3 concrete business ideas that fit someone with 5–10 hrs/week and no capital. Then pick the one most likely to succeed and produce the 8–10 milestones for that business.`;
  }
  const status = skill.status ? `\nCurrent status: ${skill.status}` : '';
  return `Generate a progression ladder of 8–10 concrete milestones for someone learning "${skill.name}"${skill.detail && skill.detail !== skill.name ? ` (specifically: ${skill.detail})` : ''}.${status}${context}

Each milestone must be specific, testable, and build on the previous one. Return ONLY a JSON array of milestone strings.

Example: ["Milestone 1","Milestone 2","Milestone 3"]`;
}
async function callAI(prompt, apiKey, baseUrl, model){
  const res = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.8 })
  });
  if (!res.ok){ const b = await res.text().catch(() => ''); throw new Error(`API ${res.status}: ${b.slice(0, 120)}`); }
  const data = await res.json();
  const text = data.choices[0].message.content.trim();
  const cleaned = text.replace(/^```(?:json)?\s*/, '').replace(/\s*```$/, '');
  return JSON.parse(cleaned);
}

/* ═════ SKILL CREATION ═════ */
function makeSkillFromTemplate(sug, detail){
  const subtype = sug.subtype || 'custom';
  const name = detail || sug.label || 'New skill';
  const isWorkoutType = subtype === 'fitness' && ['Calisthenics','Weightlifting','Mixed fitness'].includes(detail);

  const skill = {
    id: newId(), name, subtype, detail: detail || '', status: '',
    active: true, level: 1, xp: 0,
    ladder: defaultLadderFor(subtype), ladderDone: [], ladderEarned: [],
    type: isWorkoutType ? 'workout' : 'standard'
  };
  if (isWorkoutType){
    skill.plan = {
      exercises: [
        { name: 'Pushups', sets: 4, reps: 15, unit: 'reps' },
        { name: 'Squats', sets: 4, reps: 20, unit: 'reps' },
        { name: 'Chair dips', sets: 4, reps: 10, unit: 'reps' },
        { name: 'Crunches', sets: 4, reps: 20, unit: 'reps' },
        { name: 'Plank', sets: 4, reps: 45, unit: 'sec' }
      ],
      workoutDays: [1, 3, 5], attemptDay: 0
    };
  } else {
    skill.quests = defaultQuestsForSkill(skill);
  }
  return skill;
}

function renderProgressionStep(){
  const app = document.getElementById('app');
  const skills = onboardDraft.skills;

  const body = skills.map((skill, idx) => {
    const questions = progressionFor(skill);
    const ans = onboardDraft.progression[skill.id] || {};
    const hasEquip = questions.some(q => q.type === 'equipment');

    return `
      <div class="prog-section">
        <h3 style="margin-bottom:12px">${esc(skill.name)}</h3>
        ${questions.map(q => {
          if (q.type === 'equipment'){
            return `
              <div class="field">
                <label>${esc(q.label)}</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
                  ${EQUIPMENT_OPTIONS.map(eq => `
                    <label style="display:flex;align-items:center;gap:6px;padding:6px 0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--txt)">
                      <input type="checkbox" data-obeq="${skill.id}|${eq.id}" ${((state.equipment)||[]).includes(eq.id) ? 'checked' : ''}>
                      <span>${esc(eq.label)}</span>
                    </label>
                  `).join('')}
                </div>
              </div>`;
          }
          const visible = !q.onlyIf || q.onlyIf(ans);
          if (!visible) return '';
          return `
            <div class="field">
              <label>${esc(q.label)}</label>
              <select data-obq="${skill.id}|${q.id}">
                <option value="">— Select —</option>
                ${q.options.map(o =>
                  `<option value="${esc(o.value)}" ${ans[q.id]===o.value?'selected':''}>${esc(o.label)}</option>`
                ).join('')}
              </select>
            </div>`;
        }).join('')}
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <h1 style="margin-top:24px">Progression check</h1>
    <p class="dim" style="margin-top:12px">A few questions per skill so we can build the right ladders and quests. Skip any you're unsure about — you can update this later.</p>

    ${body}

    <div class="row" style="gap:8px;margin-top:16px">
      <button class="ghost" id="ob-back" style="flex:1">Back</button>
      <button class="primary" id="ob-next" style="flex:2">Start the System</button>
    </div>
  `;

  document.querySelectorAll('[data-obq]').forEach(sel => {
    sel.onchange = () => {
      const [skillId, qid] = sel.dataset.obq.split('|');
      onboardDraft.progression[skillId] = onboardDraft.progression[skillId] || {};
      onboardDraft.progression[skillId][qid] = sel.value;
      render(); // re-render in case of conditional question
    };
  });
  document.querySelectorAll('[data-obeq]').forEach(el => {
    el.onchange = () => {
      const [skillId, eqId] = el.dataset.obeq.split('|');
      state.equipment = state.equipment || [];
      const idx = state.equipment.indexOf(eqId);
      if (el.checked && idx < 0) state.equipment.push(eqId);
      if (!el.checked && idx >= 0) state.equipment.splice(idx, 1);
    };
  });

  document.getElementById('ob-back').onclick = () => { onboardStep = 3; render(); };
  document.getElementById('ob-next').onclick = () => {
    // apply progression to each skill
    onboardDraft.skills.forEach(skill => {
      const ans = onboardDraft.progression[skill.id] || {};
      if (Object.keys(ans).length > 0) applyProgression(skill, ans);
    });
    state.name = onboardDraft.name;
    state.stats = { ...onboardDraft.stats };
    state.skills = onboardDraft.skills;
    state.onboarded = true;
    save(); tab = 'status';
  };
}

  if (!state.onboarded){ renderOnboarding(); return; }
  document.getElementById('nav').classList.remove('hide');
  const app = document.getElementById('app');
  document.querySelectorAll('#nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));

  if (tab === 'status')  app.innerHTML = viewStatus();
  if (tab === 'quests')  app.innerHTML = viewQuests();
  if (tab === 'skills')  app.innerHTML = viewSkills();
  if (tab === 'bench')   app.innerHTML = viewBench();
  if (tab === 'log')     app.innerHTML = viewLog();
  if (tab === 'more')    app.innerHTML = viewMore();

  bind();
}
function navTo(t){ tab = t; render(); window.scrollTo(0, 0); }

function xpBar(){
  const lvl = levelFromXP(state.totalXP);
  const lo = xpForLevel(lvl);
  const hi = xpForLevel(lvl + 1);
  const pct = Math.min(100, ((state.totalXP - lo) / (hi - lo)) * 100);
  return `
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row between small dim mono" style="margin-top:6px">
      <span>${state.totalXP} / ${hi} XP</span>
      <span>${hi - state.totalXP} to next</span>
    </div>`;
}

function renderBenchCard(k){
  const b = BENCHMARKS[k];
  const cur = state.stats[k];
  const curTier = b.tiers.reduce((a, t) => t[0] <= cur && t[0] > a ? t[0] : a, 0);
  const date = state.statDates[k] || 'untested';
  const rows = b.tiers.map(([v, desc]) => {
    const isCur = v === curTier;
    const isBelow = v < curTier;
    return `
      <div class="tier-row ${isCur?'current':''} ${isBelow?'below':''}" data-tier="${k}:${v}">
        <div class="tier-val">${v}</div>
        <div class="tier-desc">${esc(desc)}</div>
      </div>`;
  }).join('');
  return `
    <details>
      <summary>
        <span>${k} · ${b.label}</span>
        <span class="small mono dim" style="font-weight:400;white-space:nowrap">${cur} · ${date}</span>
      </summary>
      <div class="tier-list">
        <div class="small dim" style="padding:10px 8px">${b.note}</div>
        ${rows}
      </div>
    </details>`;
}

function openSkillDetail(skillId){
  const skill = state.skills.find(s => s.id === skillId);
  if (!skill) return;

  function renderDetail(){
    const ladder = skill.ladder || [];
    const done = skill.ladderDone || [];
    const nextIdx = ladder.findIndex((m, i) => !done.includes(i));

    const ladderHtml = ladder.length ? ladder.map((m, i) => {
      const isDone = done.includes(i);
      const isNext = i === nextIdx;
      return `
        <div class="tier-row ${isNext?'current':''} ${isDone?'below':''}" data-ladder="${i}">
          <div class="tier-val">${isDone ? '✓' : (isNext ? '›' : '·')}</div>
          <div class="tier-desc">${esc(m)}</div>
        </div>`;
    }).join('') : '<div class="dim small" style="padding:12px">No ladder set. Regenerate with AI or edit to add milestones.</div>';

    const status = skill.status ? esc(skill.status) : '<span class="dim">Not set</span>';
    const isBusinessUndecided = skill.subtype === 'business' && /not decided/i.test(skill.detail || '');

    openModal(`
      <div class="row between" style="margin-bottom:16px">
        <h2 style="margin:0">${esc(skill.name)}</h2>
        <button class="sm ghost" id="sd-close">×</button>
      </div>

      <div class="card">
        <div class="row between">
          <span class="dim small">STATUS</span>
          <button class="sm ghost" id="sd-progress">Update</button>
        </div>
        <div style="margin-top:6px">${status}</div>
      </div>

      ${isBusinessUndecided ? `
        <div class="notice"><b>You haven't decided on your business yet.</b> Tap <b>Regenerate with AI</b> below — it will suggest three ideas and build the ladder for the most promising one.</div>
      ` : ''}

      <div class="row between" style="margin:16px 0 8px">
        <span class="dim small">PROGRESSION LADDER</span>
        <button class="sm ghost" id="sd-regen-ai">✨ Regenerate</button>
      </div>
      <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px">
        ${ladderHtml}
      </div>

      ${nextIdx >= 0 ? `
        <div class="notice" style="margin-top:16px"><b>Next step:</b> ${esc(ladder[nextIdx])}</div>
      ` : (ladder.length ? `
        <div class="notice ok" style="margin-top:16px"><b>Ladder complete.</b></div>
      ` : '')}

      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="sd-pause" style="flex:1">${skill.active ? 'Pause' : 'Activate'}</button>
        <button class="ghost" id="sd-edit" style="flex:1">Edit</button>
        <button class="ghost danger" id="sd-del" style="flex:1">Delete</button>
      </div>
    `);

    document.getElementById('sd-close').onclick = closeModal;
    document.getElementById('sd-progress').onclick = () => openProgressionModal(skill, renderDetail);
    document.getElementById('sd-regen-ai').onclick = () => openLadderAI(skill, renderDetail);
    document.getElementById('sd-pause').onclick = () => {
      skill.active = !skill.active; save(); renderDetail();
    };
    document.getElementById('sd-edit').onclick = () => { closeModal(); openSkillEditor(skill.id); };
    document.getElementById('sd-del').onclick = () => {
      if (!confirm(`Delete "${skill.name}"? This cannot be undone.`)) return;
      state.skills = state.skills.filter(s => s.id !== skill.id);
      save(); closeModal();
    };
    document.querySelectorAll('[data-ladder]').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.ladder;
        skill.ladderDone = skill.ladderDone || [];
        skill.ladderEarned = skill.ladderEarned || [];
        const at = skill.ladderDone.indexOf(i);
        if (at >= 0){
          skill.ladderDone.splice(at, 1);
        } else {
          skill.ladderDone.push(i);
          if (!skill.ladderEarned.includes(i)){
            skill.ladderEarned.push(i);
            addXP(20, `${skill.name}: ${skill.ladder[i]}`);
            addSkillXP(skill, 20);
          }
        }
        save(); renderDetail();
      };
    });
  }

  renderDetail();
}

/* — PROGRESSION MODAL — */
function openProgressionModal(skill, back){
  const questions = progressionFor(skill);
  const answers = {};
  // prefill from current status if possible
  questions.forEach(q => {
    if (q.type === 'equipment' || q.onlyIf) return;
    const match = q.options.find(o => o.label === skill.status || skill.status?.startsWith(o.label));
    if (match) answers[q.id] = match.value;
  });

  function renderProg(){
    openModal(`
      <h2>${esc(skill.name)} — progression</h2>
      <p class="small dim">Answering these updates the ladder pre-ticks and adjusts your daily quests.</p>
      ${questions.map(q => {
        if (q.type === 'equipment'){
          return `
            <div class="field" style="margin-top:16px">
              <label>${esc(q.label)}</label>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
                ${EQUIPMENT_OPTIONS.map(eq => `
                  <label style="display:flex;align-items:center;gap:6px;padding:6px 0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--txt)">
                    <input type="checkbox" data-peq="${eq.id}" ${(state.equipment||[]).includes(eq.id) ? 'checked' : ''}>
                    <span>${esc(eq.label)}</span>
                  </label>
                `).join('')}
              </div>
            </div>`;
        }
        const visible = !q.onlyIf || q.onlyIf(answers);
        if (!visible) return '';
        return `
          <div class="field">
            <label>${esc(q.label)}</label>
            <select data-pq="${q.id}">
              <option value="">— Select —</option>
              ${q.options.map(o =>
                `<option value="${esc(o.value)}" ${answers[q.id]===o.value?'selected':''}>${esc(o.label)}</option>`
              ).join('')}
            </select>
          </div>`;
      }).join('')}
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="pm-cancel" style="flex:1">Cancel</button>
        <button class="primary" id="pm-save" style="flex:2">Save</button>
      </div>
    `);
    document.querySelectorAll('[data-pq]').forEach(sel => {
      sel.onchange = () => {
        answers[sel.dataset.pq] = sel.value;
        renderProg(); // re-render for conditional
      };
    });
    document.querySelectorAll('[data-peq]').forEach(el => {
      el.onchange = () => {
        state.equipment = state.equipment || [];
        const id = el.dataset.peq;
        const idx = state.equipment.indexOf(id);
        if (el.checked && idx < 0) state.equipment.push(id);
        if (!el.checked && idx >= 0) state.equipment.splice(idx, 1);
      };
    });
    document.getElementById('pm-cancel').onclick = () => { closeModal(); back && back(); };
    document.getElementById('pm-save').onclick = () => {
      applyProgression(skill, answers);
      save(); closeModal(); back && back();
    };
  }
  renderProg();
}

/* — LADDER AI — */
function openLadderAI(skill, back){
  const prompt = buildLadderAIPrompt(skill);
  const key = state.settings.apiKey;
  const base = state.settings.apiBase;
  const model = state.settings.apiModel;

  openModal(`
    <h2>Regenerate ladder</h2>
    <div class="notice"><b>Route 1 — API.</b> If you've saved a key, tap Generate.<br><br><b>Route 2 — manual.</b> Copy prompt → paste into ChatGPT → paste JSON back.</div>
    <div class="field">
      <label>Prompt</label>
      <textarea id="la-prompt" rows="6" readonly>${esc(prompt)}</textarea>
      <button class="sm" id="la-copy" style="margin-top:8px">Copy prompt</button>
    </div>
    ${key ? `<button class="primary" id="la-run" style="width:100%">Generate via API (${esc(model)})</button>
             <div id="la-status" class="small dim" style="margin-top:8px;text-align:center"></div>`
          : `<div class="small dim" style="margin-bottom:12px">No API key saved. Use manual route.</div>`}
    <div class="field" style="margin-top:16px">
      <label>Result (JSON array, or one per line)</label>
      <textarea id="la-result" rows="6" placeholder='["Milestone 1","Milestone 2",...]'></textarea>
    </div>
    <div class="row" style="gap:8px">
      <button class="ghost" id="la-cancel" style="flex:1">Cancel</button>
      <button class="primary" id="la-save" style="flex:2">Replace ladder</button>
    </div>
  `);
  document.getElementById('la-cancel').onclick = closeModal;
  document.getElementById('la-copy').onclick = () => {
    const el = document.getElementById('la-prompt');
    el.select(); document.execCommand('copy');
    const b = document.getElementById('la-copy');
    b.textContent = 'Copied ✓';
    setTimeout(() => { b.textContent = 'Copy prompt'; }, 1500);
  };
  const runBtn = document.getElementById('la-run');
  if (runBtn) runBtn.onclick = async () => {
    const status = document.getElementById('la-status');
    status.textContent = 'Generating…';
    try {
      const arr = await callAI(prompt, key, base, model);
      document.getElementById('la-result').value = JSON.stringify(arr, null, 2);
      status.textContent = `Got ${arr.length} milestones. Review, then tap Replace.`;
    } catch(e){ status.textContent = 'Failed: ' + e.message; status.style.color = 'var(--danger)'; }
  };
  document.getElementById('la-save').onclick = () => {
    const text = document.getElementById('la-result').value.trim();
    if (!text) return alert('Paste or generate milestones first.');
    let arr;
    try {
      arr = text.startsWith('[') ? JSON.parse(text)
        : text.split('\n').map(l => l.trim()).filter(Boolean);
    } catch(e){ return alert('Could not parse.'); }
    if (!Array.isArray(arr) || !arr.length) return alert('No milestones found.');
    skill.ladder = arr.map(String);
    skill.ladderDone = []; skill.ladderEarned = [];
    save(); closeModal(); back();
  };
}

          `).join('')}
        </div>
        <button class="sm" id="add-q" style="margin-top:8px">+ Add quest</button>
      </div>
      <button class="sm ghost" id="gen-ai" style="width:100%;margin-top:8px">✨ Generate quests with AI</button>
    `;

    openModal(`
      <h2>${isNew ? 'New skill' : 'Edit skill'}</h2>
      <div class="field">
        <label>Name</label>
        <input id="sk-name" value="${esc(draft.name)}" maxlength="40">
      </div>
      <div class="field">
        <label>Status</label>
        <input id="sk-status" value="${esc(draft.status || '')}" placeholder="e.g. Complete beginner, or A1">
      </div>
      <div class="field">
        <label>Type</label>
        <div class="row" style="gap:8px">
          <button class="sm ${draft.type==='standard'?'primary':'ghost'}" id="type-std" style="flex:1">Standard</button>
          <button class="sm ${draft.type==='workout'?'primary':'ghost'}" id="type-wk" style="flex:1">Workout plan</button>
        </div>
      </div>
      ${questSection}
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="cancel" style="flex:1">Cancel</button>
        <button class="primary" id="save" style="flex:2">${isNew ? 'Create' : 'Save'}</button>
      </div>
    `);

    document.getElementById('cancel').onclick = closeModal;
    document.getElementById('sk-name').oninput = e => { draft.name = e.target.value; };
    document.getElementById('sk-status').oninput = e => { draft.status = e.target.value; };
    document.getElementById('type-std').onclick = () => {
      if (draft.type === 'standard') return;
      draft.type = 'standard';
      draft.quests = defaultQuestsForSkill(draft);
      delete draft.plan; renderEditor();
    };
    document.getElementById('type-wk').onclick = () => {
      if (draft.type === 'workout') return;
      draft.type = 'workout';
      draft.plan = {
        exercises: [
          { name: 'Pushups', sets: 4, reps: 15, unit: 'reps' },
          { name: 'Squats', sets: 4, reps: 20, unit: 'reps' },
          { name: 'Chair dips', sets: 4, reps: 10, unit: 'reps' },
          { name: 'Crunches', sets: 4, reps: 20, unit: 'reps' },
          { name: 'Plank', sets: 4, reps: 45, unit: 'sec' }
        ],
        workoutDays: [1,3,5], attemptDay: 0
      };
      delete draft.quests; renderEditor();
    };
    document.getElementById('save').onclick = () => {
      if (!draft.name.trim()) return alert('Name required.');
      if (isNew){
        draft.id = newId();
        draft.level = 1; draft.xp = 0; draft.active = true;
        if (!draft.ladder) draft.ladder = defaultLadderFor(draft.subtype || 'custom');
        state.skills.push(draft);
      } else {
        const i = state.skills.findIndex(s => s.id === draft.id);
        state.skills[i] = draft;
      }
      save(); closeModal();
    };

    if (draft.type === 'standard'){
      document.getElementById('add-q').onclick = () => {
        draft.quests.push({ id: newId(), text: '', xp: 5 }); renderEditor();
      };
      document.querySelectorAll('[data-remove-q]').forEach(b => {
        b.onclick = () => { draft.quests.splice(+b.dataset.removeQ, 1); renderEditor(); };
      });
      document.querySelectorAll('[data-q]').forEach(el => {
        el.oninput = () => {
          const i = +el.dataset.q, k = el.dataset.key;
          draft.quests[i][k] = k === 'xp' ? parseInt(el.value, 10) || 1 : el.value;
        };
      });
      document.getElementById('gen-ai').onclick = () => openAIGenerator(draft, renderEditor);
    } else {
      document.getElementById('add-ex').onclick = () => {
        draft.plan.exercises.push({ name: '', sets: 3, reps: 10, unit: 'reps' }); renderEditor();
      };
      document.querySelectorAll('[data-remove-ex]').forEach(b => {
        b.onclick = () => { draft.plan.exercises.splice(+b.dataset.removeEx, 1); renderEditor(); };
      });
      document.querySelectorAll('[data-ex]').forEach(el => {
        el.oninput = () => {
          const i = +el.dataset.ex, k = el.dataset.key;
          draft.plan.exercises[i][k] = (k === 'sets' || k === 'reps') ? parseInt(el.value, 10) || 1 : el.value;
        };
      });
      document.querySelectorAll('[data-wday]').forEach(b => {
        b.onclick = () => {
          const d = +b.dataset.wday;
          const i = draft.plan.workoutDays.indexOf(d);
          if (i >= 0) draft.plan.workoutDays.splice(i, 1); else draft.plan.workoutDays.push(d);
          renderEditor();
        };
      });
      document.querySelectorAll('[data-aday]').forEach(b => {
        b.onclick = () => { draft.plan.attemptDay = +b.dataset.aday; renderEditor(); };
      });
    }
  }
}

function openAIGenerator(draft, back){
  const prompt = buildQuestAIPrompt(draft.name || 'the skill', draft.level || 1);
  const key = state.settings.apiKey;
  const base = state.settings.apiBase;
  const model = state.settings.apiModel;

  openModal(`
    <h2>Generate quests</h2>
    <div class="field">
      <label>Prompt</label>
      <textarea id="ai-prompt" rows="6" readonly>${esc(prompt)}</textarea>
      <button class="sm" id="copy-prompt" style="margin-top:8px">Copy prompt</button>
    </div>
    ${key ? `<button class="primary" id="ai-run" style="width:100%">Generate via API (${esc(model)})</button>
             <div id="ai-status" class="small dim" style="margin-top:8px;text-align:center"></div>` : ''}
    <div class="field" style="margin-top:16px">
      <label>Result</label>
      <textarea id="ai-result" rows="6" placeholder='["Quest 1","Quest 2",...]'></textarea>
    </div>
    <div class="row" style="gap:8px">
      <button class="ghost" id="ai-cancel" style="flex:1">Cancel</button>
      <button class="primary" id="ai-add" style="flex:2">Add quests</button>
    </div>
  `);
  document.getElementById('ai-cancel').onclick = closeModal;
  document.getElementById('copy-prompt').onclick = () => {
    const el = document.getElementById('ai-prompt');
    el.select(); document.execCommand('copy');
    const b = document.getElementById('copy-prompt');
    b.textContent = 'Copied ✓';
    setTimeout(() => { b.textContent = 'Copy prompt'; }, 1500);
  };
  const runBtn = document.getElementById('ai-run');
  if (runBtn) runBtn.onclick = async () => {
    const status = document.getElementById('ai-status');
    status.textContent = 'Generating…';
    try {
      const arr = await callAI(prompt, key, base, model);
      document.getElementById('ai-result').value = JSON.stringify(arr, null, 2);
      status.textContent = `Got ${arr.length} quests. Review, then tap Add.`;
    } catch(e){ status.textContent = 'Failed: ' + e.message; status.style.color = 'var(--danger)'; }
  };
  document.getElementById('ai-add').onclick = () => {
    const text = document.getElementById('ai-result').value.trim();
    if (!text) return alert('Paste or generate quests first.');
    let arr;
    try {
      arr = text.startsWith('[') ? JSON.parse(text)
        : text.split('\n').map(l => l.trim()).filter(Boolean);
    } catch(e){ return alert('Could not parse.'); }
    if (!Array.isArray(arr) || !arr.length) return alert('No quests found.');
    arr.forEach(q => draft.quests.push({ id: newId(), text: String(q), xp: 5 }));
    closeModal(); back();
  };
}

function openAttemptDay(skillId){
  const skill = state.skills.find(s => s.id === skillId);
  if (!skill || skill.type !== 'workout') return;

  openModal(`
    <h2>${esc(skill.name)} — Attempt day</h2>
    <p class="small dim">Enter your max for each exercise. Next week's working sets become ~65% of max.</p>
    ${skill.plan.exercises.map((e, i) => `
      <div class="field">
        <label>${esc(e.name)} · current ${e.sets}×${e.reps}${e.unit === 'sec' ? 's' : ''}</label>
        <input type="number" min="0" data-max="${i}" placeholder="max ${e.unit}">
      </div>
    `).join('')}
    <div class="row" style="gap:8px;margin-top:12px">
      <button class="ghost" id="at-cancel" style="flex:1">Cancel</button>
      <button class="primary" id="at-save" style="flex:2">Save & update plan</button>
    </div>
  `);
  document.getElementById('at-cancel').onclick = closeModal;
  document.getElementById('at-save').onclick = () => {
    let changed = false;
    skill.plan.exercises.forEach((e, i) => {
      const input = document.querySelector(`[data-max="${i}"]`);
      const max = parseInt(input.value, 10);
      if (!isNaN(max) && max > 0){ e.reps = Math.max(1, Math.round(max * 0.65)); changed = true; }
    });
    if (changed){
      const qid = `${skill.id}:attempt`;
      const t = today();
      state.quests[t] = state.quests[t] || {};
      if (!state.quests[t][qid]){
        state.quests[t][qid] = true;
        addXP(50, `${skill.name} attempt day`);
        addSkillXP(skill, 50);
        state.benchmarks.unshift(`${skill.name} attempt — ${t}`);
        updateStreak();
      }
      save();
    }
    closeModal();
  };
}

/* — SKILL PICKER — */
function openSkillPicker(onCreated){
  let selected = null;

  function renderPicker(){
    if (!selected){
      openModal(`
        <h2>Add a skill</h2>
        <p class="small dim">Pick a category, then a specific skill.</p>
        <div style="margin-top:12px">
          ${SKILL_SUGGESTIONS.map(sug => `
            <div class="skill-row" data-pick-cat="${sug.id}">
              <span>${esc(sug.label)}</span><span class="dim">›</span>
            </div>
          `).join('')}
          <div class="skill-row" data-pick-custom="1">
            <span>Custom skill</span><span class="dim">›</span>
          </div>
        </div>
        <div class="row" style="gap:8px;margin-top:16px">
          <button class="ghost" id="sp-cancel" style="width:100%">Cancel</button>
        </div>
      `);
      document.getElementById('sp-cancel').onclick = closeModal;
      document.querySelectorAll('[data-pick-cat]').forEach(el => {
        el.onclick = () => { selected = SKILL_SUGGESTIONS.find(s => s.id === el.dataset.pickCat); renderPicker(); };
      });
      document.querySelector('[data-pick-custom]').onclick = () => { selected = { custom: true }; renderPicker(); };
      return;
    }
    if (selected.custom){
      openModal(`
        <h2>Custom skill</h2>
        <div class="field">
          <label>Name</label>
          <input id="sp-name" placeholder="e.g., Chess, Pottery">
        </div>
        <div class="row" style="gap:8px">
          <button class="ghost" id="sp-back" style="flex:1">Back</button>
          <button class="primary" id="sp-create" style="flex:2">Add</button>
        </div>
      `);
      document.getElementById('sp-back').onclick = () => { selected = null; renderPicker(); };
      document.getElementById('sp-create').onclick = () => {
        const name = document.getElementById('sp-name').value.trim();
        if (!name) return alert('Name required.');
        const skill = makeSkillFromTemplate({ subtype: 'custom', label: name }, name);
        closeModal();
        openProgressionModal(skill, () => onCreated(skill));
      };
      return;
    }
    openModal(`
      <h2>${esc(selected.label)}</h2>
      <p class="small dim">${esc(selected.ask)}</p>
      <div style="margin-top:12px">
        ${selected.options.map(opt => `
          <div class="skill-row" data-pick-opt="${esc(opt)}">
            <span>${esc(opt)}</span><span class="dim">›</span>
          </div>
        `).join('')}
      </div>
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="sp-back" style="width:100%">Back</button>
      </div>
    `);
    document.getElementById('sp-back').onclick = () => { selected = null; renderPicker(); };
    document.querySelectorAll('[data-pick-opt]').forEach(el => {
      el.onclick = () => {
        const skill = makeSkillFromTemplate(selected, el.dataset.pickOpt);
        closeModal();
        openProgressionModal(skill, () => onCreated(skill));
      };
    });
  }
  renderPicker();
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        state = Object.assign(defaultState(), JSON.parse(reader.result));
        if (state.skills) state.skills = state.skills.map(migrateSkill);
        if (!state.equipment) state.equipment = [];
        save();
      } catch(e){ alert('Could not read that file.'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ═════ BIND ═════ */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => navTo(el.dataset.nav);
  });
  document.querySelectorAll('[data-skill-card]').forEach(el => {
    el.onclick = () => openSkillDetail(el.dataset.skillCard);
  });
  document.querySelectorAll('[data-quest]').forEach(el => {
    el.onclick = () => {
      const qid = el.dataset.quest;
      const quest = questsForToday().find(q => q.id === qid);
      if (!quest) return;
      if (quest.kind === 'attempt'){
        if (isQuestDone(qid)){
          if (confirm('Undo this attempt?')){
            const t = today();
            if (state.quests[t] && state.quests[t][qid]){ delete state.quests[t][qid]; save(); }
          }
          return;
        }
        openAttemptDay(quest.skillId);
        return;
      }
      toggleQuest(quest);
    };
  });
  document.querySelectorAll('[data-tier]').forEach(el => {
    el.onclick = () => {
      const [stat, vStr] = el.dataset.tier.split(':');
      const v = parseInt(vStr, 10);
      const cur = state.stats[stat];
      const desc = BENCHMARKS[stat].tiers.find(t => t[0] === v)?.[1] || '';
      if (v === cur){
        if (confirm(`Re-test ${stat} at ${v} today?\n\n${desc}\n\nNo XP.`)){
          state.statDates[stat] = today(); save();
        }
      } else if (v > cur){
        if (confirm(`Pass ${stat} tier ${v}?\n\n${desc}\n\n${stat}: ${cur} → ${v}. +50 XP.`)){
          state.stats[stat] = v;
          state.statDates[stat] = today();
          state.benchmarks.unshift(`${stat} ${v} — ${today()}`);
          addXP(50, `Benchmark: ${stat} ${v}`);
          save();
        }
      } else {
        if (confirm(`Demote ${stat} to tier ${v}?\n\n${desc}\n\nNo XP.`)){
          state.stats[stat] = v;
          state.statDates[stat] = today();
          save();
        }
      }
    };
  });
  document.querySelectorAll('[data-xp]').forEach(el => {
    el.onclick = () => { addXP(+el.dataset.xp, el.dataset.note); save(); };
  });
  const addSkill = document.getElementById('add-skill');
  if (addSkill) addSkill.onclick = () => {
    openSkillPicker(skill => { state.skills.push(skill); save(); });
  };
  const adjgo = document.getElementById('adjgo');
  if (adjgo) adjgo.onclick = () => {
    const xp = parseInt(document.getElementById('adj').value, 10);
    const note = document.getElementById('adjnote').value || 'Adjustment';
    if (!xp) return;
    addXP(xp, note); save();
  };
  const pSave = document.getElementById('profile-save');
  if (pSave) pSave.onclick = () => {
    state.name = document.getElementById('profile-name').value.trim(); save();
  };
  document.querySelectorAll('[data-eq]').forEach(el => {
    el.onchange = () => {
      state.equipment = state.equipment || [];
      const id = el.dataset.eq;
      const idx = state.equipment.indexOf(id);
      if (el.checked && idx < 0) state.equipment.push(id);
      if (!el.checked && idx >= 0) state.equipment.splice(idx, 1);
      save();
    };
  });
  const aiSave = document.getElementById('ai-save');
  if (aiSave) aiSave.onclick = () => {
    state.settings.apiKey = document.getElementById('ai-key').value.trim();
    state.settings.apiBase = document.getElementById('ai-base').value.trim() || 'https://api.openai.com/v1';
    state.settings.apiModel = document.getElementById('ai-model').value.trim() || 'gpt-4o-mini';
    save();
  };
  const exp = document.getElementById('export');
  if (exp) exp.onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `system-backup-${today()}.json`;
    a.click();
  };
  const imp = document.getElementById('import');
  if (imp) imp.onclick = importBackup;
  const startOver = document.getElementById('startover');
  if (startOver) startOver.onclick = () => {
    if (!confirm('Erase everything? Export first if unsure.')) return;
    if (!confirm('Really erase all progress?')) return;
    localStorage.removeItem(KEY);
    state = defaultState();
    onboardStep = 1;
    onboardDraft.name = '';
    onboardDraft.stats = { ...DEFAULT_STATS };
    onboardDraft.skills = [];
    onboardDraft.progression = {};
    save();
  };
}

document.querySelectorAll('#nav button').forEach(b => {
  b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); };
});

render();
</script>
