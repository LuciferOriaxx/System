function shareProgress(){
  const w = 800, h = 1000;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const bg = '#0a0e14', line = '#1d2836', txt = '#c8d4e4', dim = '#6b7c93', accent = '#4da6ff';
  const font = (weight, size, mono=false) => `${weight} ${size}px ${mono ? 'ui-monospace, "SF Mono", Menlo, monospace' : '-apple-system, system-ui, sans-serif'}`;
  ctx.fillStyle = bg; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = line; ctx.strokeRect(20,20,w-40,h-40);
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = accent; ctx.font = font(600,16); ctx.fillText('THE SYSTEM', 60, 60);
  ctx.fillStyle = dim; ctx.font = font(500,13,true); ctx.textAlign = 'right'; ctx.fillText(today(), w-60, 60); ctx.textAlign = 'left';
  ctx.fillStyle = txt; ctx.font = font(600,30); ctx.fillText(state.name || 'Player', 60, 90);
  ctx.fillStyle = line; ctx.fillRect(60,145,w-120,1);
  const lvl = computePlayerLevel();
  const power = computeTotalPower();
  ctx.fillStyle = dim; ctx.font = font(500,12); ctx.fillText('LEVEL', 60, 175); ctx.fillText('RANK', 280, 175); ctx.fillText('POWER', 500, 175);
  ctx.fillStyle = txt; ctx.font = font(700,64,true); ctx.fillText(String(lvl), 60, 195);
  ctx.fillStyle = accent; ctx.fillText(rankOf(lvl), 280, 195);
  ctx.fillStyle = txt; ctx.fillText(String(power), 500, 195);
  ctx.fillStyle = line; ctx.fillRect(60,300,w-120,1);
  ctx.fillStyle = dim; ctx.font = font(500,12); ctx.fillText('STATS', 60, 325);
  ['STR','AGI','VIT','INT','PER'].forEach((k,i) => {
    const y = 360 + i*45;
    ctx.fillStyle = dim; ctx.font = font(500,14); ctx.fillText(k, 60, y+2);
    ctx.fillStyle = '#0a0e14'; ctx.fillRect(140, y+5, 500, 8);
    ctx.fillStyle = accent; ctx.fillRect(140, y+5, 500*(state.stats[k]/100), 8);
    ctx.fillStyle = txt; ctx.font = font(600,18,true); ctx.textAlign = 'right'; ctx.fillText(String(state.stats[k]), w-60, y); ctx.textAlign = 'left';
  });
  ctx.fillStyle = line; ctx.fillRect(60,600,w-120,1);
  ctx.fillStyle = dim; ctx.font = font(500,12); ctx.fillText('ACTIVE SKILLS', 60, 625);
  state.skills.filter(s=>s.active).slice(0,5).forEach((s,i) => {
    const y = 660 + i*40;
    const title = titleForSkill(s);
    ctx.fillStyle = txt; ctx.font = font(500,16); ctx.fillText(s.name + (title ? ' · ' + title : ''), 60, y);
    ctx.fillStyle = dim; ctx.font = font(500,14,true); ctx.textAlign = 'right'; ctx.fillText(`${rankOf(s.level)} · Lv ${s.level}`, w-60, y); ctx.textAlign = 'left';
  });
  ctx.fillStyle = dim; ctx.font = font(500,12); ctx.fillText('Honest logging. No inflated numbers.', 60, h-60);
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    openModal(`<h2>Progress card</h2><img src="${url}" style="width:100%;border-radius:8px;border:1px solid var(--line);display:block"><p class="small dim" style="margin-top:12px">Long-press to save, or tap download.</p><a href="${url}" download="the-system-${today()}.png" style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:8px;font-weight:600;color:#06121f;background:var(--accent);margin-top:12px">Download</a><button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Close</button>`);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 'image/png');
}

function openMilestoneFriction(skill, i, then){
  openModal(`
    <h2>Mark milestone</h2>
    <p class="small dim">In one sentence, what did you actually do to earn this? Optional — you can skip.</p>
    <div class="notice" style="margin-top:12px">${esc(skill.ladder[i])}</div>
    <div class="field">
      <textarea id="mf-note" rows="2" placeholder="e.g. Registered at Companies House, opened bank, bought domain."></textarea>
    </div>
    <div class="row" style="gap:8px">
      <button class="ghost" id="mf-cancel" style="flex:1">Cancel</button>
      <button class="primary" id="mf-save" style="flex:2">Mark earned</button>
    </div>
  `);
  document.getElementById('mf-cancel').onclick = closeModal;
  document.getElementById('mf-save').onclick = () => {
    const note = document.getElementById('mf-note').value.trim();
    if (!skill.ladderNotes) skill.ladderNotes = {};
    skill.ladderNotes[i] = note;
    closeModal();
    then(note);
  };
}

function togglePark(skillId){
  const skill = state.skills.find(s => s.id === skillId);
  if (!skill) return;
  if (skill.active){
    skill.active = false;
    save();
  } else {
    if (activeSkillCount() >= MAX_ACTIVE_SKILLS){
      alert(`Already ${MAX_ACTIVE_SKILLS} active skills. Park one first.`);
      return;
    }
    skill.active = true;
    save();
  }
}

function openSkillDetail(skillId){
  const skill = state.skills.find(s => s.id === skillId);
  if (!skill) return;
  function renderDetail(){
    const locked = isLocked();
    const ladder = skill.ladder || [], done = skill.ladderDone || [];
    const nextIdx = currentMilestoneIdx(skill);
    const nextMilestone = (nextIdx >= 0) ? ladder[nextIdx] : null;
    const title = titleForSkill(skill);
    const ladderHtml = ladder.length ? ladder.map((m,i) => {
      const isDone = done.includes(i);
      const isNext = i === nextIdx;
      const isPre = (skill.ladderPreticked||[]).includes(i);
      const willGive = milestoneSkillXP(i);
      const note = skill.ladderNotes && skill.ladderNotes[`${skill.id}:m${i}`];
      return `<div class="tier-row ${isNext?'current':''} ${isDone?'below':''}" data-ladder="${i}"><div class="tier-val">${isDone?'✓':(isNext?'›':'·')}</div><div class="tier-desc">${esc(m)}${!isDone?`<div class="small dim mono">+${willGive} skill XP</div>`:''}${note?`<div class="small dim" style="font-style:italic">${esc(note)}</div>`:''}${isPre && isDone?`<div class="small dim" style="font-style:italic">calibration tick</div>`:''}</div></div>`;
    }).join('') : '<div class="dim small" style="padding:12px">No ladder set.</div>';
    const status = skill.status ? esc(skill.status) : '<span class="dim">Not set</span>';
    const isBusinessUndecided = skill.subtype === 'business' && /not decided/i.test(skill.detail || '');
    const currentQuests = (nextIdx >= 0 && skill.milestoneQuests && skill.milestoneQuests[nextIdx]) ? skill.milestoneQuests[nextIdx] : (skill.quests || []);
    const parked = !skill.active;
    openModal(`
      <div class="row between" style="margin-bottom:16px"><div><h2 style="margin:0">${esc(skill.name)}</h2>${parked?`<div class="parked-tag" style="margin-top:6px">parked</div>`:''}${title?`<div class="skill-title" style="margin-top:6px">${esc(title)}</div>`:''}</div><button class="sm ghost" id="sd-close">×</button></div>
      ${locked?`<div class="notice lock"><b>🔒 Locked.</b> Skills are locked during commitment. You can still tick milestones and use this skill — but editing, regenerating, and deleting are locked. Unlock in More.</div>`:''}
      ${skill.calibratedLevel && skill.calibratedLevel > 1 ? `<div class="notice" style="background:rgba(255,200,87,.06);border-color:rgba(255,200,87,.3);font-size:13px"><b>Calibrated start:</b> Lv ${skill.calibratedLevel}. Your progression answers said you were already past the early ladder.</div>`:''}
      ${skill.identity?`<div class="notice" style="font-style:italic">"${esc(skill.identity)}"</div>`:''}
      ${nextMilestone?`<div class="milestone-focus"><b>Current focus:</b> ${esc(nextMilestone)}</div>`:''}
      <div class="card"><div class="row between"><span class="dim small">STATUS</span>${locked?'':`<button class="sm ghost" id="sd-progress">Update</button>`}</div><div style="margin-top:6px">${status}</div></div>
      ${currentQuests.length>0?`<div class="row between" style="margin:16px 0 8px"><span class="dim small">DAILY QUESTS FOR CURRENT MILESTONE</span></div><div class="card">${currentQuests.map(q => `<div class="logrow"><span>${esc(q.text)}</span><span class="xp">+${q.xp}</span></div>`).join('')}</div>`:''}
      ${isBusinessUndecided?`<div class="notice"><b>Business not decided.</b> ${locked?'Regenerate is locked during commitment.':'Tap Regenerate to let AI suggest 3 ideas and build the ladder.'}</div>`:''}
      <div class="row between" style="margin:16px 0 8px"><span class="dim small">LADDER (${done.length}/${ladder.length})</span>${locked?'<span class="small dim">🔒 Regenerate locked</span>':`<button class="sm ghost" id="sd-regen-ai">✨ Regenerate</button>`}</div>
      <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px">${ladderHtml}</div>
      ${nextIdx>=0?`<div class="notice" style="margin-top:16px"><b>Next step:</b> ${esc(ladder[nextIdx])}</div>`:(ladder.length?`<div class="notice ok" style="margin-top:16px"><b>Ladder complete.</b></div>`:'')}
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="sd-park" style="flex:1">${skill.active?'Park':'Activate'}</button>
        ${locked?'':`<button class="ghost" id="sd-edit" style="flex:1">Edit</button><button class="ghost danger" id="sd-del" style="flex:1">Delete</button>`}
      </div>
    `);
    document.getElementById('sd-close').onclick = closeModal;
    const progBtn = document.getElementById('sd-progress');
    if (progBtn) progBtn.onclick = () => openProgressionModal(skill, renderDetail);
    const regenBtn = document.getElementById('sd-regen-ai');
    if (regenBtn) regenBtn.onclick = () => openLadderAI(skill, renderDetail);
    document.getElementById('sd-park').onclick = () => { togglePark(skill.id); closeModal(); };
    const editBtn = document.getElementById('sd-edit');
    if (editBtn) editBtn.onclick = () => { closeModal(); openSkillEditor(skill.id); };
    const delBtn = document.getElementById('sd-del');
    if (delBtn) delBtn.onclick = () => {
      if (!confirm(`Delete "${skill.name}" permanently? Its progress and milestones will be lost. If you just want a break, use Park instead.`)) return;
      state.skills = state.skills.filter(s => s.id !== skill.id);
      save(); closeModal();
    };
    document.querySelectorAll('[data-ladder]').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.ladder;
        if (skill.ladderDone && skill.ladderDone.includes(i)){
          untickMilestone(skill, i); save(); renderDetail();
        } else {
          openMilestoneFriction(skill, i, () => { tickMilestone(skill, i); save(); renderDetail(); });
        }
      };
    });
  }
  renderDetail();
}

function openProgressionModal(skill, back){
  if (isLocked()){ alert('Skills are locked during commitment. Unlock in More to change them.'); return; }
  const questions = progressionFor(skill);
  const answers = {};
  questions.forEach(q => { if (q.type==='days'||q.onlyIf) return; const m = q.options.find(o => o.label === skill.status || skill.status?.startsWith(o.label)); if (m) answers[q.id] = m.value; });
  if (skill.type === 'workout' && skill.plan){ answers.workoutDays = [...(skill.plan.workoutDays || [1,3,5])]; answers.attemptDay = skill.plan.attemptDay || 0; }
  function renderProg(){
    openModal(`<h2>${esc(skill.name)} — update</h2><p class="small dim">Answer where you're at now. This adjusts your current milestone, daily quests, and (for fitness) exercises.</p>${questions.map(q => {
      if (q.type === 'days'){ const current = answers[q.id] !== undefined ? answers[q.id] : q.default; return `<div class="field"><label>${esc(q.label)}</label><div class="day-picker">${[0,1,2,3,4,5,6].map(d => { const on = q.multi ? current.includes(d) : current === d; return `<button type="button" class="${on?'primary':'ghost'}" data-pday="${q.id}|${d}|${q.multi?'multi':'single'}">${dayShort(d)}</button>`; }).join('')}</div></div>`; }
      const visible = !q.onlyIf || q.onlyIf(answers);
      if (!visible) return '';
      return `<div class="field"><label>${esc(q.label)}</label><select data-pq="${q.id}"><option value="">— Select —</option>${q.options.map(o => `<option value="${esc(o.value)}" ${answers[q.id]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
    }).join('')}<div class="row" style="gap:8px;margin-top:16px"><button class="ghost" id="pm-cancel" style="flex:1">Cancel</button><button class="primary" id="pm-save" style="flex:2">Save</button></div>`);
    document.querySelectorAll('[data-pq]').forEach(sel => { sel.onchange = () => { answers[sel.dataset.pq] = sel.value; renderProg(); }; });
    document.querySelectorAll('[data-pday]').forEach(btn => { btn.onclick = () => { const [qid, dStr, mode] = btn.dataset.pday.split('|'); const d = parseInt(dStr, 10); const q = questions.find(x => x.id === qid); if (mode==='multi'){ const arr = Array.isArray(answers[qid]) ? [...answers[qid]] : [...(q.default||[])]; const idx = arr.indexOf(d); if (idx>=0) arr.splice(idx,1); else arr.push(d); answers[qid] = arr; } else answers[qid] = d; renderProg(); }; });
    document.getElementById('pm-cancel').onclick = () => { closeModal(); back && back(); };
    document.getElementById('pm-save').onclick = () => { applyProgression(skill, answers); save(); closeModal(); back && back(); };
  }
  renderProg();
}

function openLadderAI(skill, back){
  if (isLocked()){ alert('Skills are locked during commitment. Unlock in More to regenerate ladders.'); return; }
  const prompt = buildLadderAIPrompt(skill);
  const key = state.settings.apiKey, base = state.settings.apiBase, model = state.settings.apiModel;
  openModal(`<h2>Regenerate ladder</h2><div class="notice"><b>The AI sees your last 30 days, stats, equipment and current milestone.</b><br><br><b>Route 1 — API.</b> Save a key in More.<br><b>Route 2 — manual.</b> Copy prompt → paste into ChatGPT → paste JSON back.</div><div class="field"><label>Prompt</label><textarea id="la-prompt" rows="10" readonly>${esc(prompt)}</textarea><button class="sm" id="la-copy" style="margin-top:8px">Copy prompt</button></div>${key?`<button class="primary" id="la-run" style="width:100%">Generate via API</button><div id="la-status" class="small dim" style="margin-top:8px;text-align:center"></div>`:''}<div class="field" style="margin-top:16px"><label>Result</label><textarea id="la-result" rows="6" placeholder='["Milestone 1","Milestone 2",...]'></textarea></div><div class="row" style="gap:8px"><button class="ghost" id="la-cancel" style="flex:1">Cancel</button><button class="primary" id="la-save" style="flex:2">Replace ladder</button></div>`);
  document.getElementById('la-cancel').onclick = closeModal;
  document.getElementById('la-copy').onclick = () => { const el = document.getElementById('la-prompt'); el.select(); document.execCommand('copy'); const b = document.getElementById('la-copy'); b.textContent = 'Copied ✓'; setTimeout(() => { b.textContent = 'Copy prompt'; }, 1500); };
  const runBtn = document.getElementById('la-run');
  if (runBtn) runBtn.onclick = async () => { const status = document.getElementById('la-status'); status.textContent = 'Generating…'; try { const arr = await callAI(prompt, key, base, model); document.getElementById('la-result').value = JSON.stringify(arr, null, 2); status.textContent = `Got ${arr.length} milestones.`; } catch(e){ status.textContent = 'Failed: ' + e.message; status.style.color = 'var(--danger)'; } };
  document.getElementById('la-save').onclick = () => {
    const text = document.getElementById('la-result').value.trim(); if (!text) return alert('Paste or generate first.');
    let arr; try { arr = text.startsWith('[') ? JSON.parse(text) : text.split('\n').map(l => l.trim()).filter(Boolean); } catch(e){ return alert('Could not parse.'); }
    if (!Array.isArray(arr) || !arr.length) return alert('No milestones found.');
    skill.ladder = arr.map(String);
    skill.ladderDone = []; skill.ladderEarned = []; skill.ladderXpLogs = {}; skill.ladderPreticked = [];
    skill.milestoneQuests = {};
    ensureMilestoneQuests(skill);
    save(); closeModal(); back();
  };
}

function openSkillEditor(skillId){
  if (isLocked()){ alert('Skills are locked during commitment. Unlock in More to edit them.'); return; }
  const skill = skillId ? state.skills.find(s => s.id === skillId) : null;
  const isNew = !skill;
  const draft = skill ? JSON.parse(JSON.stringify(skill)) : makeSkillFromTemplate({ subtype: 'custom', label: 'New skill' }, 'New skill');
  draft.ladderDone = draft.ladderDone || []; draft.ladderEarned = draft.ladderEarned || [];
  draft.ladderXpLogs = draft.ladderXpLogs || {}; draft.ladderPreticked = draft.ladderPreticked || [];
  draft.milestoneQuests = draft.milestoneQuests || {}; draft.why = draft.why || ''; draft.identity = draft.identity || ''; draft.quitCriteria = draft.quitCriteria || '';
  renderEditor();
  function renderEditor(){
    const isWorkout = draft.type === 'workout';
    const showCardio = isWorkout && draft.subtype === 'fitness';
    const idx = currentMilestoneIdx(draft);
    const currentMilestone = (idx >= 0 && draft.ladder) ? draft.ladder[idx] : null;
    let questsToEdit = [];
    if (isWorkout) questsToEdit = draft.plan?.exercises || [];
    else if (idx >= 0 && draft.milestoneQuests[idx]) questsToEdit = draft.milestoneQuests[idx];
    const questSection = isWorkout ? `<div class="field"><label>Exercises</label><div id="exercises">${draft.plan.exercises.map((e,i) => `<div class="exercise-row"><input placeholder="Name" value="${esc(e.name)}" data-ex="${i}" data-key="name"><input type="number" min="1" placeholder="Sets" value="${e.sets}" data-ex="${i}" data-key="sets"><input type="number" min="1" placeholder="Reps" value="${e.reps}" data-ex="${i}" data-key="reps"><button class="sm ghost danger" data-remove-ex="${i}">×</button></div>`).join('')}</div><button class="sm" id="add-ex" style="margin-top:8px">+ Add exercise</button></div><div class="field"><label>Workout days</label><div class="day-picker">${[0,1,2,3,4,5,6].map(d => `<button type="button" class="${draft.plan.workoutDays.includes(d)?'primary':'ghost'}" data-wday="${d}">${dayShort(d)}</button>`).join('')}</div></div><div class="field"><label>Attempt day</label><div class="day-picker">${[0,1,2,3,4,5,6].map(d => `<button type="button" class="${draft.plan.attemptDay===d?'primary':'ghost'}" data-aday="${d}">${dayShort(d)}</button>`).join('')}</div></div>${showCardio?`<div class="field"><label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input type="checkbox" id="sk-cardio" ${draft.cardioEnabled!==false?'checked':''}><span style="text-transform:none;letter-spacing:0;color:var(--txt);font-size:13px">Cardio on rest days</span></label></div>`:''}` : `${currentMilestone?`<div class="milestone-focus"><b>Quests for:</b> ${esc(currentMilestone)}</div>`:''}<div class="field"><label>Daily quests</label><div id="quests">${questsToEdit.map((q,i) => `<div class="exercise-row" style="grid-template-columns:1fr 70px 30px"><input value="${esc(q.text)}" data-q="${i}" data-key="text"><input type="number" min="1" value="${q.xp}" data-q="${i}" data-key="xp"><button class="sm ghost danger" data-remove-q="${i}">×</button></div>`).join('')}</div><button class="sm" id="add-q" style="margin-top:8px">+ Add quest</button></div><button class="sm ghost" id="gen-ai" style="width:100%;margin-top:8px">✨ Generate quests with AI</button>`;
    openModal(`<h2>${isNew?'New skill':'Edit skill'}</h2><div class="field"><label>Name</label><input id="sk-name" value="${esc(draft.name)}" maxlength="40"></div><div class="field"><label>Status</label><input id="sk-status" value="${esc(draft.status||'')}" placeholder="e.g. Complete beginner"></div>${!isNew?`<div class="field"><label>Type</label><div class="row" style="gap:8px"><button class="sm ${draft.type==='standard'?'primary':'ghost'}" id="type-std" style="flex:1">Standard</button><button class="sm ${draft.type==='workout'?'primary':'ghost'}" id="type-wk" style="flex:1">Workout plan</button></div></div>`:''}${questSection}<hr><div class="small dim" style="margin-bottom:10px">Optional. Feeds the AI when it generates quests, and shows on your skill card.</div><div class="field"><label>Why this matters <span class="dim" style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="sk-why" value="${esc(draft.why)}" placeholder="One sentence."></div><div class="field"><label>Identity <span class="dim" style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="sk-identity" value="${esc(draft.identity)}" placeholder="I am someone who..."></div><div class="field"><label>Drop criteria <span class="dim" style="text-transform:none;letter-spacing:0">(optional)</span></label><input id="sk-quit" value="${esc(draft.quitCriteria)}" placeholder="e.g. not touched in 30 days"></div><div class="row" style="gap:8px;margin-top:16px"><button class="ghost" id="cancel" style="flex:1">Cancel</button><button class="primary" id="save" style="flex:2">${isNew?'Create':'Save'}</button></div>`);
    document.getElementById('cancel').onclick = closeModal;
    document.getElementById('sk-name').oninput = e => { draft.name = e.target.value; };
    document.getElementById('sk-why').oninput = e => { draft.why = e.target.value; };
    document.getElementById('sk-identity').oninput = e => { draft.identity = e.target.value; };
    document.getElementById('sk-quit').oninput = e => { draft.quitCriteria = e.target.value; };
    document.getElementById('sk-status').oninput = e => { draft.status = e.target.value; };
    const typeStd = document.getElementById('type-std'), typeWk = document.getElementById('type-wk');
    if (typeStd) typeStd.onclick = () => { if (draft.type==='standard') return; draft.type = 'standard'; draft.quests = []; delete draft.plan; renderEditor(); };
    if (typeWk) typeWk.onclick = () => { if (draft.type==='workout') return; draft.type = 'workout'; draft.plan = { exercises: deriveExercisesFromStats(), workoutDays:[1,3,5], attemptDay:0, calibratedTo:{ STR: state.stats.STR, equipment: [...(state.equipment||[])], weights: { ...(state.equipmentWeights||{}) } } }; delete draft.quests; renderEditor(); };
    document.getElementById('save').onclick = () => {
      if (!draft.name.trim()) return alert('Name required.');
      const cardioEl = document.getElementById('sk-cardio'); if (cardioEl) draft.cardioEnabled = cardioEl.checked;
      if (isNew){
        if (activeSkillCount() >= MAX_ACTIVE_SKILLS){ alert(`Max ${MAX_ACTIVE_SKILLS} active skills.`); return; }
        draft.id = newId(); draft.level = 1; draft.xp = 0; draft.active = true; if (!draft.ladder) draft.ladder = defaultLadderFor(draft.subtype || 'custom', draft.detail); if (draft.workoutsSinceAttempt === undefined) draft.workoutsSinceAttempt = 0; if (draft.cardioEnabled === undefined) draft.cardioEnabled = true; state.skills.push(draft);
      }
      else { const i = state.skills.findIndex(s => s.id === draft.id); state.skills[i] = draft; }
      ensureMilestoneQuests(draft); save(); closeModal();
    };
    if (draft.type === 'standard'){
      document.getElementById('add-q').onclick = () => { if (idx >= 0){ if (!draft.milestoneQuests[idx]) draft.milestoneQuests[idx] = []; draft.milestoneQuests[idx].push({ id: newId(), text:'', xp:5 }); } renderEditor(); };
      document.querySelectorAll('[data-remove-q]').forEach(b => { b.onclick = () => { const i = +b.dataset.removeQ; if (idx >= 0 && draft.milestoneQuests[idx]) draft.milestoneQuests[idx].splice(i,1); renderEditor(); }; });
      document.querySelectorAll('[data-q]').forEach(el => { el.oninput = () => { const i = +el.dataset.q, k = el.dataset.key; const v = k==='xp'?parseInt(el.value,10)||1:el.value; if (idx >= 0 && draft.milestoneQuests[idx]) draft.milestoneQuests[idx][i][k] = v; }; });
      document.getElementById('gen-ai').onclick = () => openAIGenerator(draft, renderEditor);
    } else {
      document.getElementById('add-ex').onclick = () => { draft.plan.exercises.push({ name:'', sets:3, reps:10, unit:'reps' }); draft.plan.userEdited = true; renderEditor(); };
      document.querySelectorAll('[data-remove-ex]').forEach(b => { b.onclick = () => { draft.plan.exercises.splice(+b.dataset.removeEx, 1); draft.plan.userEdited = true; renderEditor(); }; });
      document.querySelectorAll('[data-ex]').forEach(el => { el.oninput = () => { const i = +el.dataset.ex, k = el.dataset.key; draft.plan.exercises[i][k] = (k==='sets'||k==='reps')?parseInt(el.value,10)||1:el.value; draft.plan.userEdited = true; }; });
      document.querySelectorAll('[data-wday]').forEach(b => { b.onclick = () => { const d = +b.dataset.wday; const i = draft.plan.workoutDays.indexOf(d); if (i>=0) draft.plan.workoutDays.splice(i,1); else draft.plan.workoutDays.push(d); renderEditor(); }; });
      document.querySelectorAll('[data-aday]').forEach(b => { b.onclick = () => { draft.plan.attemptDay = +b.dataset.aday; renderEditor(); }; });
    }
  }
}

function openAIGenerator(draft, back){
  const prompt = buildQuestAIPrompt(draft);
  const key = state.settings.apiKey, base = state.settings.apiBase, model = state.settings.apiModel;
  openModal(`<h2>Generate quests</h2><div class="field"><label>Prompt</label><textarea id="ai-prompt" rows="10" readonly>${esc(prompt)}</textarea><button class="sm" id="copy-prompt" style="margin-top:8px">Copy prompt</button></div>${key?`<button class="primary" id="ai-run" style="width:100%">Generate via API</button><div id="ai-status" class="small dim" style="margin-top:8px;text-align:center"></div>`:''}<div class="field" style="margin-top:16px"><label>Result</label><textarea id="ai-result" rows="6" placeholder='["Quest 1","Quest 2",...]'></textarea></div><div class="row" style="gap:8px"><button class="ghost" id="ai-cancel" style="flex:1">Cancel</button><button class="primary" id="ai-add" style="flex:2">Add quests</button></div>`);
  document.getElementById('ai-cancel').onclick = closeModal;
  document.getElementById('copy-prompt').onclick = () => { const el = document.getElementById('ai-prompt'); el.select(); document.execCommand('copy'); const b = document.getElementById('copy-prompt'); b.textContent = 'Copied ✓'; setTimeout(() => { b.textContent = 'Copy prompt'; }, 1500); };
  const runBtn = document.getElementById('ai-run');
  if (runBtn) runBtn.onclick = async () => { const status = document.getElementById('ai-status'); status.textContent = 'Generating…'; try { const arr = await callAI(prompt, key, base, model); document.getElementById('ai-result').value = JSON.stringify(arr, null, 2); status.textContent = `Got ${arr.length} quests.`; } catch(e){ status.textContent = 'Failed: ' + e.message; status.style.color = 'var(--danger)'; } };
  document.getElementById('ai-add').onclick = () => {
    const text = document.getElementById('ai-result').value.trim(); if (!text) return alert('Paste or generate first.');
    let arr; try { arr = text.startsWith('[') ? JSON.parse(text) : text.split('\n').map(l => l.trim()).filter(Boolean); } catch(e){ return alert('Could not parse.'); }
    if (!Array.isArray(arr) || !arr.length) return alert('No quests found.');
    const idx = currentMilestoneIdx(draft);
    if (!draft.milestoneQuests) draft.milestoneQuests = {};
    if (idx >= 0) draft.milestoneQuests[idx] = arr.map(q => ({ id: newId(), text: String(q), xp: 5 }));
    closeModal(); back();
  };
}

function openAttemptDay(skillId){
  const skill = state.skills.find(s => s.id === skillId);
  if (!skill || skill.type !== 'workout') return;
  openModal(`<h2>${esc(skill.name)} — Attempt day</h2><p class="small dim">Enter your max for each exercise. Next week's working sets become ~60% of max.</p>${skill.plan.exercises.map((e,i) => `<div class="field"><label>${esc(e.name)} · current ${e.sets}×${e.reps}${e.unit==='sec'?'s':''}</label><input type="number" min="0" data-max="${i}" placeholder="max ${e.unit}"></div>`).join('')}<div class="row" style="gap:8px;margin-top:12px"><button class="ghost" id="at-cancel" style="flex:1">Cancel</button><button class="primary" id="at-save" style="flex:2">Save & update plan</button></div>`);
  document.getElementById('at-cancel').onclick = closeModal;
  document.getElementById('at-save').onclick = () => {
    let changed = false;
    skill.plan.exercises.forEach((e,i) => { const input = document.querySelector(`[data-max="${i}"]`); const max = parseInt(input.value,10); if (!isNaN(max) && max > 0){ e.reps = Math.max(2, Math.round(max*0.6)); changed = true; } });
    if (changed){
      skill.plan.userEdited = true;
      skill.workoutsSinceAttempt = 0;
      const qid = `${skill.id}:attempt`, t = today();
      state.quests[t] = state.quests[t] || {};
      if (!state.quests[t][qid]){
        const logId = addXP(50, `${skill.name} attempt day`, null, null, skill.id, { finished: true, time: currentTime() });
        const oldRank = rankOf(skill.level);
        addSkillXP(skill, 50);
        const extra = [];
        const newRank = rankOf(skill.level);
        if (newRank !== oldRank) extra.push(addXP(0, `${skill.name} — Rank ${newRank}`, null, null, skill.id, { skipStreak: true, time: currentTime() }));
        state.quests[t][qid] = { logId, extraLogIds: extra, xp: 50, skillXp: 50 };
        state.benchmarks.unshift(`${skill.name} attempt — ${t}`);
      }
      save();
    }
    closeModal();
  };
}

function openSkillPicker(onCreated){
  if (isLocked()){ alert('Skills are locked during commitment. Unlock in More to add skills.'); return; }
  let selected = null;
  function renderPicker(){
    if (!selected){
      openModal(`<h2>Add a skill</h2><div class="small dim">Active: ${activeSkillCount()}/${MAX_ACTIVE_SKILLS}</div><div style="margin-top:12px">${SKILL_SUGGESTIONS.map(sug => `<div class="skill-row" data-pick-cat="${sug.id}"><span>${esc(sug.label)}</span><span class="dim">›</span></div>`).join('')}<div class="skill-row" data-pick-custom="1"><span>Custom skill</span><span class="dim">›</span></div></div><div class="row" style="gap:8px;margin-top:16px"><button class="ghost" id="sp-cancel" style="width:100%">Cancel</button></div>`);
      document.getElementById('sp-cancel').onclick = closeModal;
      document.querySelectorAll('[data-pick-cat]').forEach(el => { el.onclick = () => { selected = SKILL_SUGGESTIONS.find(s => s.id === el.dataset.pickCat); renderPicker(); }; });
      document.querySelector('[data-pick-custom]').onclick = () => { selected = { custom: true }; renderPicker(); };
      return;
    }
    if (selected.custom){
      openModal(`<h2>Custom skill</h2><div class="field"><label>Name</label><input id="sp-name" placeholder="e.g., Chess, Pottery"></div><div class="row" style="gap:8px"><button class="ghost" id="sp-back" style="flex:1">Back</button><button class="primary" id="sp-create" style="flex:2">Add</button></div>`);
      document.getElementById('sp-back').onclick = () => { selected = null; renderPicker(); };
      document.getElementById('sp-create').onclick = () => {
        const name = document.getElementById('sp-name').value.trim(); if (!name) return alert('Name required.');
        const skill = makeSkillFromTemplate({ subtype: 'custom', label: name }, name);
        closeModal(); openProgressionModal(skill, () => onCreated(skill));
      };
      return;
    }
    openModal(`<h2>${esc(selected.label)}</h2><p class="small dim">${esc(selected.ask)}</p><div style="margin-top:12px">${selected.options.map(opt => `<div class="skill-row" data-pick-opt="${esc(opt)}"><span>${esc(opt)}</span><span class="dim">›</span></div>`).join('')}</div><div class="row" style="gap:8px;margin-top:16px"><button class="ghost" id="sp-back" style="width:100%">Back</button></div>`);
    document.getElementById('sp-back').onclick = () => { selected = null; renderPicker(); };
    document.querySelectorAll('[data-pick-opt]').forEach(el => { el.onclick = () => { const skill = makeSkillFromTemplate(selected, el.dataset.pickOpt); closeModal(); openProgressionModal(skill, () => onCreated(skill)); }; });
  }
  renderPicker();
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        state = Object.assign(defaultState(), JSON.parse(reader.result));
        if (state.skills) state.skills = state.skills.map(migrateSkill);
        if (!state.equipment) state.equipment = [];
        if (!state.equipmentWeights) state.equipmentWeights = { dumbbell: 0, barbell: 0, barbellPlates: false, kettlebell: 0 };
        if (state.equipmentConfigured === undefined) state.equipmentConfigured = false;
        if (!state.timeBudget) state.timeBudget = 30;
        if (state.deloadEnabled === undefined) state.deloadEnabled = true;
        if (!state.firsts) state.firsts = [];
        if (!state.dailyBasics) state.dailyBasics = {};
        if (!state.ladderNotes) state.ladderNotes = {};
        if (!state.startedAt) state.startedAt = today();
        if (!state.commitmentUnlockedDate) state.commitmentUnlockedDate = '';
        state.lastPlayerLevel = computePlayerLevel();
        state.lastPlayerRank = rankOf(state.lastPlayerLevel);
        save();
      } catch(e){ alert('Could not read that file.'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ═══════════════════════════════════════════
   BIND
   ═══════════════════════════════════════════ */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(el => { el.onclick = () => navTo(el.dataset.nav); });
  document.querySelectorAll('[data-skill-card]').forEach(el => { el.onclick = () => openSkillDetail(el.dataset.skillCard); });
  document.querySelectorAll('[data-park-toggle]').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); togglePark(el.dataset.parkToggle); };
  });
  document.querySelectorAll('[data-basic]').forEach(el => {
    el.onchange = () => {
      const t = today();
      state.dailyBasics[t] = state.dailyBasics[t] || {};
      state.dailyBasics[t][el.dataset.basic] = el.checked;
      save();
    };
  });
  document.querySelectorAll('[data-quest]').forEach(el => {
    el.onclick = () => {
      const qid = el.dataset.quest;
      const quest = questsForToday().find(q => q.id === qid);
      if (!quest) return;
      if (quest.kind === 'attempt'){
        const current = state.quests[today()] && state.quests[today()][qid];
        if (current){
          if (confirm('Undo this attempt?')){
            const data = (typeof current === 'object') ? current : null;
            if (data && data.logId){
              state.log = state.log.filter(e => e.id !== data.logId);
              if (data.extraLogIds && data.extraLogIds.length){ const ex = new Set(data.extraLogIds); state.log = state.log.filter(e => !ex.has(e.id)); }
              state.totalXP = Math.max(0, state.totalXP - (data.xp || 0));
              const skill = state.skills.find(s => s.id === quest.skillId);
              if (skill && data.skillXp) subtractSkillXP(skill, data.skillXp);
            }
            delete state.quests[today()][qid]; save();
          }
          return;
        }
        openAttemptDay(quest.skillId); return;
      }
      toggleQuest(quest);
    };
  });
  document.querySelectorAll('[data-nudge-attempt]').forEach(el => { el.onclick = () => openAttemptDay(el.dataset.nudgeAttempt); });
  document.querySelectorAll('[data-tier]').forEach(el => {
    el.onclick = () => {
      const [stat, vStr] = el.dataset.tier.split(':');
      const v = parseInt(vStr, 10), cur = state.stats[stat];
      const desc = BENCHMARKS[stat].tiers.find(t => t[0] === v)?.[1] || '';
      if (v === cur){ if (confirm(`Re-test ${stat} at ${v} today?\n\n${desc}\n\nNo change — the date refreshes but your stat stays.`)){ state.statDates[stat] = today(); save(); } }
      else if (v > cur){
        if (confirm(`Pass ${stat} tier ${v}?\n\n${desc}\n\n${stat}: ${cur} → ${v}. Your level will rise.`)){
          levelChangeReason = `${stat} up to ${v}`;
          state.stats[stat] = v; state.statDates[stat] = today();
          state.benchmarks.unshift(`${stat} ${v} — ${today()}`);
          save();
        }
      } else {
        if (confirm(`Demote ${stat} to tier ${v}?\n\n${desc}\n\nYour level will drop accordingly. Honest calibration.`)){
          levelChangeReason = `${stat} down to ${v}`;
          state.stats[stat] = v; state.statDates[stat] = today();
          save();
        }
      }
    };
  });

  const logSubmit = document.getElementById('log-submit');
  if (logSubmit) logSubmit.onclick = () => {
    const dateEl = document.getElementById('log-date');
    const timeEl = document.getElementById('log-time');
    const skillEl = document.getElementById('log-skill');
    const noteEl = document.getElementById('log-note');
    const minsEl = document.getElementById('log-mins');
    const date = (dateEl && dateEl.value) || today();
    const time = (timeEl && timeEl.value) || currentTime();
    const skillId = (skillEl && skillEl.value) || null;
    const noteText = (noteEl && noteEl.value || '').trim();
    const mins = parseInt(minsEl && minsEl.value, 10);
    if (!noteText) return alert('Enter what you did.');
    if (!mins || mins <= 0) return alert('Enter how many minutes it took.');
    const xp = Math.max(2, Math.round(mins / 6));
    const skill = skillId ? state.skills.find(s => s.id === skillId) : null;
    const note = `${noteText} (${mins} min)`;
    const logId = addXP(xp, note, null, date, skillId, { finished: true, time });
    if (skill) addSkillXP(skill, xp);
    save();
    showToast(`Logged: +${xp} XP${skill ? ' · ' + skill.name : ''}`, 'var(--accent)');
  };
  const logMinsInput = document.getElementById('log-mins');
  if (logMinsInput) logMinsInput.oninput = () => {
    const mins = parseInt(logMinsInput.value, 10);
    const preview = document.getElementById('log-preview');
    if (preview){
      if (!isNaN(mins) && mins > 0){
        const xp = Math.max(2, Math.round(mins / 6));
        preview.textContent = `→ +${xp} XP`;
      } else {
        preview.textContent = '';
      }
    }
  };

  const addSkill = document.getElementById('add-skill');
  if (addSkill) addSkill.onclick = () => {
    if (isLocked()){ alert('Skills are locked during commitment. Unlock in More to add skills.'); return; }
    if (activeSkillCount() >= MAX_ACTIVE_SKILLS){ alert(`Max ${MAX_ACTIVE_SKILLS} active. Park one first.`); return; }
    openSkillPicker(skill => { if (activeSkillCount() >= MAX_ACTIVE_SKILLS) { alert(`Max ${MAX_ACTIVE_SKILLS} active.`); return; } state.skills.push(skill); save(); });
  };

  document.querySelectorAll('[data-unlock-skills]').forEach(el => {
    el.onclick = () => { if (confirm('Unlock skills? You get a 24-hour grace period to make changes. Re-lock within 24h to keep your commitment running.')) doUnlock(); };
  });

  const pSave = document.getElementById('profile-save');
  if (pSave) pSave.onclick = () => {
    state.name = document.getElementById('profile-name').value.trim();
    const telosEl = document.getElementById('telos-input');
    if (telosEl) state.telos = telosEl.value.trim();
    state.timeBudget = parseInt(document.getElementById('profile-budget').value, 10) || 30;
    const d = document.getElementById('profile-deload'); if (d) state.deloadEnabled = d.checked;
    save();
  };
  const togglePause = document.getElementById('toggle-pause');
  if (togglePause) togglePause.onclick = () => {
    if (state.paused){ state.paused = false; state.pausedUntil = ''; }
    else {
      if (!confirm('Pause? Streak freezes, no penalty. Nothing else changes.')) return;
      state.paused = true; state.pausedUntil = dateOffset(14);
    }
    save();
  };
  const commitStart = document.getElementById('commit-start');
  if (commitStart) commitStart.onclick = () => {
    if (!confirm(`Commit for ${COMMIT_DAYS} days? Your skills will lock — you won't be able to add, edit, or delete them. You can still log, tick quests, and use everything else. Unlock any time (24h grace to make edits).`)) return;
    doCommit();
  };
  const commitUnlockBtn = document.getElementById('commit-unlock');
  if (commitUnlockBtn) commitUnlockBtn.onclick = () => {
    if (!confirm('Unlock skills? You get a 24-hour grace period. Re-lock within 24h to keep your commitment running; otherwise the commitment ends and the next one starts fresh.')) return;
    doUnlock();
  };
  const commitRelockBtn = document.getElementById('commit-relock');
  if (commitRelockBtn) commitRelockBtn.onclick = () => {
    doCommit();
  };
  const commitEndBtn = document.getElementById('commit-end');
  if (commitEndBtn) commitEndBtn.onclick = () => {
    if (!confirm('End this commitment? Skills will unlock and the countdown stops.')) return;
    doEndCommitment();
  };

  const addTelos = document.getElementById('add-telos'); if (addTelos) addTelos.onclick = openTelosModal;
  const openReviews = document.getElementById('open-reviews'); if (openReviews) openReviews.onclick = openWeeklyReviewList;
  document.querySelectorAll('[data-eq]').forEach(el => { el.onchange = () => { state.equipment = state.equipment || []; const id = el.dataset.eq; const idx = state.equipment.indexOf(id); if (el.checked && idx < 0) state.equipment.push(id); if (!el.checked && idx >= 0) state.equipment.splice(idx, 1); save(); }; });
  document.querySelectorAll('[data-eqw]').forEach(el => { el.onchange = () => { state.equipmentWeights = state.equipmentWeights || {}; state.equipmentWeights[el.dataset.eqw] = parseFloat(el.value) || 0; save(); }; });
  document.querySelectorAll('[data-eqx]').forEach(el => { el.onchange = () => { state.equipmentWeights = state.equipmentWeights || {}; state.equipmentWeights[el.dataset.eqx] = el.checked; save(); }; });
  const aiSave = document.getElementById('ai-save'); if (aiSave) aiSave.onclick = () => { state.settings.apiKey = document.getElementById('ai-key').value.trim(); state.settings.apiBase = document.getElementById('ai-base').value.trim() || 'https://api.openai.com/v1'; state.settings.apiModel = document.getElementById('ai-model').value.trim() || 'gpt-4o-mini'; save(); };
  const exp = document.getElementById('export'); if (exp) exp.onclick = () => { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `system-backup-${today()}.json`; a.click(); };
  const imp = document.getElementById('import'); if (imp) imp.onclick = importBackup;
  const startOver = document.getElementById('startover');
  if (startOver) startOver.onclick = () => {
    if (!confirm('Erase everything?')) return;
    if (!confirm('Really erase all progress?')) return;
    localStorage.removeItem(KEY);
    state = defaultState();
    onboardStep = 1; onboardDraft.name = ''; onboardDraft.stats = { ...DEFAULT_STATS }; onboardDraft.timeBudget = 30; onboardDraft.skills = []; onboardDraft.progression = {};
    save();
  };
  const shareBtn = document.getElementById('share-btn'); if (shareBtn) shareBtn.onclick = shareProgress;
}

document.querySelectorAll('#nav button').forEach(b => { b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }; });

render();
setTimeout(checkWelcomeBack, 500);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
