<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>The System</title>
<style>
:root{--bg:#0a0e14;--panel:#111823;--line:#1d2836;--txt:#c8d4e4;--dim:#6b7c93;
  --accent:#4da6ff;--gold:#ffc857;--danger:#ff5c5c;--ok:#3ddc97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:76px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:13px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
h2{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:24px 0 10px}
h3{font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.bar{height:6px;background:#0a0e14;border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
button{font:inherit;color:var(--txt);background:#16202e;border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;cursor:pointer;min-height:42px}
button:active{background:#1d2836}
button.primary{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.sm{padding:6px 10px;min-height:34px;font-size:13px}
input,select,textarea{font:inherit;color:var(--txt);background:#0a0e14;border:1px solid var(--line);
  border-radius:8px;padding:10px;width:100%;min-height:42px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
input[type=checkbox]{width:auto;min-height:auto}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.dim{color:var(--dim)}
.small{font-size:12px}
.tag{font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:4px;background:#1d2836;color:var(--dim)}
.tag.on{background:rgba(77,166,255,.15);color:var(--accent)}
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:none}
.chk{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;cursor:pointer}
.chk.done{background:var(--accent);border-color:var(--accent);color:#06121f}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d131c;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
nav button{flex:1;background:none;border:none;border-radius:0;padding:14px 2px;min-height:60px;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
nav button.active{color:var(--accent)}
.logrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.logrow:last-child{border-bottom:none}
.xp{color:var(--accent);font-family:ui-monospace,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.1em}
.field .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.4}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal h2{margin-top:0;margin-bottom:16px}
.skill-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.skill-row:last-child{border-bottom:none}
.exercise-row{display:grid;grid-template-columns:1fr 60px 70px 30px;gap:8px;
  align-items:center;margin-bottom:8px}
.exercise-row input{min-height:38px;padding:6px 8px;font-size:14px}
.notice{background:rgba(77,166,255,.08);border:1px solid rgba(77,166,255,.25);
  border-radius:8px;padding:12px;font-size:13px;margin-bottom:16px}
.notice.ok{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.25)}
.notice.warn{background:rgba(255,200,87,.08);border-color:rgba(255,200,87,.25)}
.hide{display:none}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin-bottom:12px;overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';color:var(--dim);font-size:18px;font-weight:400}
details[open]>summary::after{content:'−'}
details>summary:active{background:#16202e}
.tier-list{padding:0 6px 8px;border-top:1px solid var(--line)}
.tier-row{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;
  border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.tier-row:last-child{border-bottom:none}
.tier-row:active{background:#1d2836}
.tier-row.current{background:rgba(77,166,255,.08)}
.tier-row.below{opacity:.55}
.tier-val{width:26px;text-align:right;font-family:ui-monospace,monospace;
  font-weight:600;font-size:14px;color:var(--dim);flex:0 0 auto;padding-top:1px}
.tier-row.current .tier-val{color:var(--accent);font-weight:700}
.tier-desc{flex:1;font-size:13px;line-height:1.4}
.prog-section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.day-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day-picker button{min-height:38px;padding:6px 4px;font-size:13px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week-cell{text-align:center}
.week-day{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.week-box{height:36px;border-radius:6px;background:#0a0e14;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-size:13px;color:var(--dim)}
.week-box.filled{background:rgba(77,166,255,.15);border-color:rgba(77,166,255,.5);color:var(--accent);font-weight:600}
.stat-label-stale{color:var(--gold)}
.levelup-overlay{position:fixed;inset:0;background:rgba(10,14,20,.92);z-index:200;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;cursor:pointer}
.levelup-overlay.show{opacity:1}
.levelup-card{background:linear-gradient(135deg,#4da6ff 0%,#8a63f2 100%);
  border-radius:20px;padding:40px 60px;text-align:center;
  transform:scale(.85);transition:transform .4s cubic-bezier(.2,.8,.2,1.3);
  box-shadow:0 20px 80px rgba(77,166,255,.4)}
.levelup-overlay.show .levelup-card{transform:scale(1)}
.levelup-card .label{font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.85);text-transform:uppercase}
.levelup-card .big{font-size:72px;font-weight:800;color:#fff;line-height:1;margin:12px 0;font-family:ui-monospace,monospace}
.levelup-card .rank{font-size:16px;color:rgba(255,255,255,.9);font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.levelup-card.rankup-card{
  background:linear-gradient(135deg,#ffc857 0%,#ff8f3f 100%);
  padding:50px 70px;
}
.levelup-overlay.show.rankup .levelup-card{
  animation:rankGlow 2s ease-in-out infinite;
}
.levelup-card.rankup-card .label{
  color:rgba(0,0,0,.65);
  font-weight:700;
  letter-spacing:.35em;
  font-size:13px;
}
.levelup-card.rankup-card .big.rank-big{
  font-size:170px;
  color:#fff;
  line-height:.85;
  text-shadow:0 6px 30px rgba(0,0,0,.3);
  margin:20px 0;
}
.levelup-card.rankup-card .rank{
  color:rgba(0,0,0,.7);
  font-weight:700;
  font-size:15px;
  letter-spacing:.2em;
}
@keyframes rankGlow{
  0%,100%{box-shadow:0 20px 100px rgba(255,200,87,.55), 0 0 200px rgba(255,140,63,.3)}
  50%{box-shadow:0 20px 130px rgba(255,200,87,.85), 0 0 260px rgba(255,140,63,.55)}
}
.tag.on.rank-E{background:#1d2836;color:var(--dim)}
.tag.on.rank-D{background:rgba(61,220,151,.15);color:var(--ok)}
.tag.on.rank-C{background:rgba(77,166,255,.2);color:var(--accent)}
.tag.on.rank-B{background:rgba(160,110,255,.2);color:#a06eff}
.tag.on.rank-A{background:rgba(255,200,87,.2);color:var(--gold)}
.tag.on.rank-S{background:linear-gradient(135deg,rgba(255,92,92,.25),rgba(255,200,87,.25));color:#ff8f3f}
</style>
</head>
<body>

<main id="app" class="wrap"></main>
<div id="modal"></div>

<nav id="nav" class="hide">
  <button data-tab="status" class="active">Status</button>
  <button data-tab="quests">Quests</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="bench">Stats</button>
  <button data-tab="log">Log</button>
  <button data-tab="more">More</button>

<script>
/* ═════ RULES ═════ */
const xpForLevel = n => 50 * n * (n - 1);
function levelFromXP(xp){ let n = 1; while (xpForLevel(n+1) <= xp) n++; return n; }
const skillXpForLevel = L => 10 * L;
const RANK_TABLE = [[50,'S'],[40,'A'],[30,'B'],[20,'C'],[10,'D'],[1,'E']];
const rankOf = lvl => RANK_TABLE.find(([m]) => lvl >= m)[1];
function addSkillXP(skill, amount){
  skill.xp += amount;
  let leveled = 0;
  while (skill.level < 50 && skill.xp >= skillXpForLevel(skill.level)){
    skill.xp -= skillXpForLevel(skill.level); skill.level++; leveled++;
  }
  if (skill.level >= 50) skill.xp = 0;
  return leveled;
}

/* ═════ BENCHMARKS ═════ */
const BENCHMARKS = {

function strToMaxes(tier){
  const map = {
    5:   { pushups: 5,  pullups: 0, dips: 0, squats: 15, plank: 20 },
    10:  { pushups: 15, pullups: 0, dips: 5, squats: 25, plank: 45 },
    20:  { pushups: 25, pullups: 0, dips: 10, squats: 40, plank: 60 },
    30:  { pushups: 35, pullups: 0, dips: 15, squats: 50, plank: 90 },
    40:  { pushups: 45, pullups: 4, dips: 20, squats: 60, plank: 120 },
    50:  { pushups: 50, pullups: 6, dips: 25, squats: 80, plank: 180 },
    60:  { pushups: 60, pullups: 8, dips: 30, squats: 100, plank: 240 }
  };
  return map[tier] || map[5];
}

function deriveExercisesFromStats(){
  const str = state.stats.STR || 5;
  const budget = state.timeBudget || 30;
  const hasBar = (state.equipment || []).includes('pullup_bar');
  const hasDipBars = (state.equipment || []).includes('dip_bars');
  const maxes = strToMaxes(str);

  const reps = max => Math.max(2, Math.round(max * 0.6));
  let sets, maxExercises;
  if (budget <= 15){ sets = 2; maxExercises = 3; }
  else if (budget <= 30){ sets = 3; maxExercises = 4; }
  else if (budget <= 45){ sets = 3; maxExercises = 5; }
  else { sets = 4; maxExercises = 6; }

  const all = [];
  all.push({ name: 'Pushups', sets, reps: reps(maxes.pushups), unit: 'reps' });
  all.push({ name: 'Squats',  sets, reps: reps(maxes.squats),  unit: 'reps' });
  all.push({ name: 'Plank',   sets, reps: Math.round(maxes.plank * 0.7), unit: 'sec' });
  if (maxes.dips > 0)
    all.push({ name: hasDipBars ? 'Dips' : 'Chair dips', sets, reps: reps(maxes.dips), unit: 'reps' });
  if (hasBar && maxes.pullups > 0)
    all.push({ name: 'Pullups', sets, reps: Math.max(2, Math.round(maxes.pullups * 0.6)), unit: 'reps' });
  if (str >= 20)
    all.push({ name: 'Wall handstand', sets, reps: str >= 40 ? 45 : 20, unit: 'sec' });

  return all.slice(0, maxExercises);
}

/* ═════ EQUIPMENT ═════ */

/* ═════ LADDERS ═════ */
const LADDER_PRESETS = {

function defaultLadderFor(subtype){ return LADDER_PRESETS[subtype] ? [...LADDER_PRESETS[subtype]] : null; }

/* ═════ HELPERS ═════ */
const newId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const pad = n => String(n).padStart(2, '0');
function today(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function yesterday(){
  const d = new Date(); d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dateOffset(n){
  const d = new Date(); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function dayName(n){ return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][n]; }
function dayShort(n){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n]; }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function daysSinceDate(dateStr){
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / (1000*60*60*24));
}

/* ═════ STATE ═════ */
const KEY = 'the-system-v2';
const DEFAULT_STATS = { STR: 5, AGI: 5, VIT: 5, INT: 5, PER: 1 };
let logDate = today();

function defaultState(){
  return {
    v: 6, onboarded: false, name: '', totalXP: 0,
    stats: { ...DEFAULT_STATS }, statDates: {},
    skills: [], streak: 0, lastComplete: null,
    quests: {}, log: [], benchmarks: [], titles: [],
    equipment: [], timeBudget: 30,
    lastCelebratedLevel: 1,
    lastCelebratedRank: 'E',
    settings: { apiKey: '', apiBase: 'https://api.openai.com/v1', apiModel: 'gpt-4o-mini' }
  };
}

function migrateSkill(s){
  if (!s.subtype){
    const n = (s.name || '').toLowerCase();
    if (n.includes('calisthen') || n.includes('fitness') || n.includes('strength') || n.includes('weight')) s.subtype = 'fitness';
    else if (n.includes('spanish') || n.includes('french') || n.includes('german') || n.includes('langu')) s.subtype = 'language';
    else if (n.includes('code') || n.includes('cod')) s.subtype = 'coding';
    else if (n.includes('business')) s.subtype = 'business';
    else if (n.includes('read')) s.subtype = 'reading';
    else if (n.includes('writ')) s.subtype = 'writing';
    else if (n.includes('engineer')) s.subtype = 'engineering';
    else s.subtype = 'custom';
    s.detail = s.detail || s.name || '';
    s.status = s.status || '';
    s.ladder = defaultLadderFor(s.subtype);
    s.ladderDone = [];
  }
  if (!s.ladderDone) s.ladderDone = [];
  if (!s.ladderEarned) s.ladderEarned = [];
  if (!s.ladderXpLogs) s.ladderXpLogs = {};
  if (!s.ladderPreticked) s.ladderPreticked = [...s.ladderDone];
  if (s.workoutsSinceAttempt === undefined) s.workoutsSinceAttempt = 0;
  if (s.cardioEnabled === undefined) s.cardioEnabled = true;

  // Fix skills accidentally named after generic status options
  if (s.name){
    const n = s.name.trim().toLowerCase();
    const map = {
      'not decided yet': 'Business development',
      'not sure yet': 'Book writing',
      'other': s.subtype === 'business' ? 'Business development' :
               s.subtype === 'writing' ? 'Book writing' :
               s.subtype === 'language' ? 'New language' :
               s.subtype === 'engineering' ? 'Engineering' :
               s.subtype === 'instrument' ? 'Instrument' : 'Skill'
    };
    if (map[n]) s.name = map[n];
  }

  return s;
}

let state = load();
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    const parsed = Object.assign(defaultState(), JSON.parse(raw));
    if (parsed.skills) parsed.skills = parsed.skills.map(migrateSkill);
    if (!parsed.equipment) parsed.equipment = [];
    if (!parsed.timeBudget) parsed.timeBudget = 30;
    const curLvl = levelFromXP(parsed.totalXP || 0);
    if (!parsed.lastCelebratedLevel || parsed.lastCelebratedLevel < curLvl){
      parsed.lastCelebratedLevel = curLvl;
    }
    if (!parsed.lastCelebratedRank || parsed.lastCelebratedRank !== rankOf(parsed.lastCelebratedLevel)){
      parsed.lastCelebratedRank = rankOf(parsed.lastCelebratedLevel);
    }
    return parsed;
  } catch(e){ return defaultState(); }
}
function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}

function addXP(amount, note, id, date){
  const entry = { id: id || newId(), date: date || today(), xp: amount, note };
  state.totalXP += amount;
  state.log.unshift(entry);
  state.log = state.log.slice(0, 500);
  if (amount > 0){
    const lvl = levelFromXP(state.totalXP);
    if (lvl > state.lastCelebratedLevel){
      const oldRank = state.lastCelebratedRank || rankOf(state.lastCelebratedLevel);
      const newRank = rankOf(lvl);
      state.lastCelebratedLevel = lvl;
      state.lastCelebratedRank = newRank;
      setTimeout(() => {
        if (newRank !== oldRank) showRankUp(newRank, lvl);
        else showLevelUp(lvl);
      }, 120);
    }
  }
  return entry.id;
}

function showLevelUp(level){
  const el = document.createElement('div');
  el.className = 'levelup-overlay';
  el.innerHTML = `
    <div class="levelup-card">
      <div class="label">Level up</div>
      <div class="big">Lv ${level}</div>
      <div class="rank">Rank ${rankOf(level)}</div>
    </div>`;
  const dismiss = () => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 400);
  };
  el.onclick = dismiss;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
function showRankUp(rank, level){
  const el = document.createElement('div');
  el.className = 'levelup-overlay rankup';
  el.innerHTML = `
    <div class="levelup-card rankup-card">
      <div class="label">Rank Up</div>
      <div class="big rank-big">${rank}</div>
      <div class="rank">Level ${level}</div>
    </div>`;
  const dismiss = () => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 500);
  };
  el.onclick = dismiss;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(dismiss, 3500);
}

/* ═════ LADDER TICK/UNTICK ═════ */
function tickMilestone(skill, i){
  skill.ladderDone = skill.ladderDone || [];
  skill.ladderEarned = skill.ladderEarned || [];
  skill.ladderXpLogs = skill.ladderXpLogs || {};
  skill.ladderPreticked = skill.ladderPreticked || [];

  if (skill.ladderDone.includes(i)) return;
  skill.ladderDone.push(i);
  if (skill.ladderPreticked.includes(i)) return;

  const ref = skill.ladderXpLogs[i];
  if (ref){
    state.totalXP += ref.xp;
    skill.xp += ref.xp;
    state.log.unshift({ id: ref.logId, date: today(), xp: ref.xp, note: ref.note });
    const lvl = levelFromXP(state.totalXP);
    if (lvl > state.lastCelebratedLevel){
      const oldRank = state.lastCelebratedRank || rankOf(state.lastCelebratedLevel);
      const newRank = rankOf(lvl);
      state.lastCelebratedLevel = lvl;
      state.lastCelebratedRank = newRank;
      setTimeout(() => {
        if (newRank !== oldRank) showRankUp(newRank, lvl);
        else showLevelUp(lvl);
      }, 120);
    }
  } else {
    const note = `${skill.name}: ${skill.ladder[i]}`;
    const logId = addXP(20, note);
    const oldSkillRank = rankOf(skill.level);
    const skillLeveled = addSkillXP(skill, 20);
    skill.ladderEarned.push(i);
    skill.ladderXpLogs[i] = { logId, xp: 20, note };
    if (skillLeveled){
      const newSkillRank = rankOf(skill.level);
      if (newSkillRank !== oldSkillRank) addXP(0, `${skill.name} — Rank ${newSkillRank}`);
      else addXP(0, `${skill.name} reached Lv ${skill.level}`);
    }
  }
}

function untickMilestone(skill, i){
  skill.ladderDone = (skill.ladderDone || []).filter(x => x !== i);
  const ref = skill.ladderXpLogs && skill.ladderXpLogs[i];
  if (ref){
    state.totalXP -= ref.xp;
    state.log = state.log.filter(e => e.id !== ref.logId);
    skill.xp = Math.max(0, skill.xp - ref.xp);
  }
}

function applyProgression(skill, answers){
  const questions = progressionFor(skill);
  let statusParts = [];
  let preTick = null;

  questions.forEach(q => {
    if (q.type === 'equipment' || q.type === 'days') return;
    if (q.onlyIf && !q.onlyIf(answers)) return;
    const val = answers[q.id];
    if (!val) return;
    const opt = q.options.find(o => o.value === val);
    if (!opt) return;
    statusParts.push(opt.label);
    if (opt.preTick) preTick = opt.preTick;
  });

  skill.status = statusParts.join(' — ') || skill.status || '';

  if (skill.subtype === 'fitness' && skill.type === 'workout'){
    skill.plan = skill.plan || {};
    skill.plan.workoutDays = answers.workoutDays || [1,3,5];
    skill.plan.attemptDay = (typeof answers.attemptDay === 'number') ? answers.attemptDay : 0;
    skill.plan.exercises = deriveExercisesFromStats();
    skill.plan.calibratedTo = { STR: state.stats.STR, equipment: [...(state.equipment||[])] };
  }

  if (answers.type) skill.detail = answers.type;

  if (preTick){
    skill.ladderDone = [...preTick];
    skill.ladderPreticked = [...preTick];
    skill.ladderEarned = [];
    skill.ladderXpLogs = {};
  }

  if (skill.type === 'standard'){
    skill.quests = defaultQuestsForSkill(skill);
  }
}

function defaultQuestsForSkill(skill){
  const sub = skill.subtype || 'custom';
  const status = (skill.status || '').toLowerCase();
  const name = skill.name || 'practice';

  if (sub === 'language'){
    if (/a2|b1|b2|c1/i.test(status)) return [
      { id: newId(), text: `${name} — 15 min speaking practice`, xp: 4 },
      { id: newId(), text: `Read 15 min in ${name}`, xp: 3 },
      { id: newId(), text: '10 new vocabulary words', xp: 2 }
    ];
    return [
      { id: newId(), text: `${name} — 15 min vocabulary practice`, xp: 3 },
      { id: newId(), text: `5 min listening in ${name}`, xp: 2 },
      { id: newId(), text: '5 new words learned', xp: 2 }
    ];
  }
  if (sub === 'business'){
    if (/not decided|idea/i.test(status)) return [
      { id: newId(), text: '15 min market research', xp: 3 },
      { id: newId(), text: '1 business task', xp: 5 }
    ];
    return [
      { id: newId(), text: '1 customer or client conversation', xp: 5 },
      { id: newId(), text: '30 min on the live business', xp: 5 }
    ];
  }
  if (sub === 'coding'){
    if (/never|beginner|basics/i.test(status)) return [
      { id: newId(), text: '20 min coding practice', xp: 4 },
      { id: newId(), text: 'Read one tutorial or doc page', xp: 2 }
    ];
    return [
      { id: newId(), text: '30 min on your coding project', xp: 6 },
      { id: newId(), text: 'Review or refactor one thing', xp: 3 }
    ];
  }
  if (sub === 'reading'){
    return [
      { id: newId(), text: 'Read 30 min, phone away', xp: 5 },
      { id: newId(), text: '3 sentences of notes', xp: 2 }
    ];
  }
  if (sub === 'writing'){
    if (/idea|outline/i.test(status)) return [{ id: newId(), text: 'Write 200 words of premise', xp: 3 }];
    if (/first_words|first_chapter|mid_draft/i.test(status)) return [{ id: newId(), text: 'Write 500 words', xp: 5 }];
    if (/draft_done|editing|published/i.test(status)) return [{ id: newId(), text: '30 min editing or marketing', xp: 5 }];
    return [{ id: newId(), text: 'Write 300 words', xp: 5 }];
  }
  if (sub === 'engineering'){
    return [
      { id: newId(), text: '30 min technical study', xp: 5 },
      { id: newId(), text: '1 portfolio step', xp: 3 }
    ];
  }
  if (sub === 'fitness'){
    return [{ id: newId(), text: `${name} — 20 min session`, xp: 4 }];
  }
  return [{ id: newId(), text: `${name} — 20 min focused practice`, xp: 5 }];
}

/* ═════ QUESTS ═════ */
function questsForToday(){
  const day = new Date().getDay();
  const list = [];
  state.skills.filter(s => s.active).forEach(skill => {
    if (skill.type === 'workout' && skill.plan){
      const plan = skill.plan;
      if (day === plan.attemptDay){
        list.push({ id: `${skill.id}:attempt`, skillId: skill.id, kind: 'attempt',
          text: `${skill.name} — Attempt day: test your max reps`, xp: 50 });
      } else if (plan.workoutDays.includes(day)){
        const summary = plan.exercises.map(e => `${e.sets}×${e.reps} ${e.name}`).join(' · ');
        list.push({ id: `${skill.id}:workout`, skillId: skill.id, kind: 'workout',
          text: `${skill.name}: ${summary}`, xp: 15 });
      } else if (skill.subtype === 'fitness' && skill.cardioEnabled !== false){
        list.push({ id: `${skill.id}:cardio`, skillId: skill.id, kind: 'cardio',
          text: `${skill.name} cardio (VIT): 20 min brisk walk, cycle, or housework`, xp: 8 });
      }
    } else if (skill.quests){
      skill.quests.forEach(q => list.push({
        id: `${skill.id}:${q.id}`, skillId: skill.id, kind: 'standard', text: q.text, xp: q.xp
      }));
    }
  });
  return list;
}
function isQuestDone(qid){
  return !!(state.quests[today()] && state.quests[today()][qid]);
}
function toggleQuest(quest){
  const t = today();
  state.quests[t] = state.quests[t] || {};
  const skill = state.skills.find(s => s.id === quest.skillId);

  if (state.quests[t][quest.id]){
    delete state.quests[t][quest.id];
    if (quest.kind === 'workout' && skill){
      skill.workoutsSinceAttempt = Math.max(0, (skill.workoutsSinceAttempt || 0) - 1);
    }
  } else {
    state.quests[t][quest.id] = true;
    addXP(quest.xp, quest.text);
    if (skill){
      const oldSkillRank = rankOf(skill.level);
      const leveled = addSkillXP(skill, quest.xp);
      if (leveled){
        const newSkillRank = rankOf(skill.level);
        if (newSkillRank !== oldSkillRank) addXP(0, `${skill.name} — Rank ${newSkillRank}`);
        else addXP(0, `${skill.name} reached Lv ${skill.level}`);
      }
      if (quest.kind === 'workout'){
        skill.workoutsSinceAttempt = (skill.workoutsSinceAttempt || 0) + 1;
      }
    }
    updateStreak();
  }
  save();
}
function updateStreak(){
  const t = today();
  const q = state.quests[t] || {};
  if (Object.keys(q).length === 0) return;
  if (state.lastComplete === t) return;
  state.streak = (state.lastComplete === yesterday()) ? state.streak + 1 : 1;
  state.lastComplete = t;
  if (state.streak % 7 === 0) addXP(50, `7-day streak (day ${state.streak})`);
}

/* ═════ AI ═════ */
function buildQuestAIPrompt(skillName, level){
  return `Generate 6 concrete daily practice quests for someone learning "${skillName}" at level ${level}/50. Specific, 20–60 min, doable at home. Return ONLY a JSON array of 6 strings.`;
}
function buildLadderAIPrompt(skill){
  let context = '';
  if (skill.subtype === 'business' && skill.detail && /not decided/i.test(skill.detail)){
    context = `\n\nThe person hasn't chosen what business to start. First suggest 3 concrete ideas that fit 5–10 hrs/week and no capital. Then pick the most promising and produce 8–10 milestones for that business.`;
  }
  const status = skill.status ? `\nCurrent status: ${skill.status}` : '';
  return `Generate 8–10 concrete progression milestones for someone learning "${skill.name}"${skill.detail && skill.detail !== skill.name ? ` (specifically: ${skill.detail})` : ''}.${status}${context}\n\nEach specific, testable, building on the previous. Return ONLY a JSON array of strings.`;
}
async function callAI(prompt, apiKey, baseUrl, model){
  const res = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.8 })
  });
  if (!res.ok){ const b = await res.text().catch(() => ''); throw new Error(`API ${res.status}: ${b.slice(0, 120)}`); }
  const data = await res.json();
  const text = data.choices[0].message.content.trim();
  const cleaned = text.replace(/^```(?:json)?\s*/, '').replace(/\s*```$/, '');
  return JSON.parse(cleaned);
}

/* ═════ SKILL CREATION ═════ */
  function smartSkillName(sug, detail){
  if (!detail) return sug.label || 'New skill';
  const generic = ['not decided yet','not sure yet','other','new'];
  if (generic.includes(String(detail).toLowerCase().trim())){
    const map = {
      business: 'Business development',
      writing: 'Book writing',
      language: 'New language',
      engineering: 'Engineering',
      instrument: 'Instrument',
      fitness: 'Fitness',
      coding: 'Coding',
      reading: 'Reading'
    };
    return map[sug.id] || sug.label || 'Skill';
  }
  return detail;
}
function makeSkillFromTemplate(sug, detail){
   const subtype = sug.subtype || 'custom';
  const name = smartSkillName(sug, detail);
  const isWorkoutType = subtype === 'fitness' && ['Calisthenics','Weightlifting','Mixed fitness'].includes(detail);

  const skill = {
    id: newId(), name, subtype, detail: detail || '', status: '',
    active: true, level: 1, xp: 0,
    ladder: defaultLadderFor(subtype), ladderDone: [], ladderEarned: [],
    ladderXpLogs: {}, ladderPreticked: [],
    workoutsSinceAttempt: 0, cardioEnabled: true,
    type: isWorkoutType ? 'workout' : 'standard'
  };
  if (isWorkoutType){
    skill.plan = {
      exercises: deriveExercisesFromStats(),
      workoutDays: [1, 3, 5], attemptDay: 0,
      calibratedTo: { STR: state.stats.STR, equipment: [...(state.equipment||[])] }
    };
  } else {
    skill.quests = defaultQuestsForSkill(skill);
  }
  return skill;
}

/* ═════ ONBOARDING ═════ */
let tab = 'status';
let onboardStep = 1;
const onboardDraft = {
  name: '',
  stats: { ...DEFAULT_STATS },
  timeBudget: 30,
  skills: [],
  progression: {}
};

function renderOnboarding(){
  document.getElementById('nav').classList.add('hide');
  const app = document.getElementById('app');

  if (onboardStep === 1){
    app.innerHTML = `
      <h1 style="margin-top:24px">The System</h1>
      <p class="dim" style="margin-top:12px">A personal level-up tracker. Every value is yours — stored on this device only.</p>
      <div class="card" style="margin-top:24px">
        <div class="field">
          <label>What should I call you?</label>
          <input id="ob-name" placeholder="Name" value="${esc(onboardDraft.name)}" maxlength="40">
        </div>
        <button class="primary" id="ob-next" style="width:100%">Continue</button>
      </div>
      <p class="small dim">Already have a backup? <a href="#" id="ob-import" style="color:var(--accent)">Import it instead</a></p>
    `;
    document.getElementById('ob-next').onclick = () => {
      const v = document.getElementById('ob-name').value.trim();
      if (!v) return alert('Enter a name to continue.');
      onboardDraft.name = v; onboardStep = 2; render();
    };
    document.getElementById('ob-import').onclick = (e) => { e.preventDefault(); importBackup(); };
    return;
  }

  if (onboardStep === 2){
    app.innerHTML = `
      <h1 style="margin-top:24px">Starting stats</h1>
      <p class="dim" style="margin-top:12px">Pick the highest tier you can <b>pass today</b>. Between two tiers, take the lower.</p>
      <div class="card" style="margin-top:16px">
        ${['STR','AGI','VIT','INT','PER'].map(k => {
          const b = BENCHMARKS[k];
          const cur = onboardDraft.stats[k];
          const curDesc = (b.tiers.find(t => t[0] === cur) || b.tiers[0])[1];
          return `
            <div class="field">
              <label>${k} · ${b.label}</label>
              <select data-obstat="${k}">
                ${b.tiers.map(([v, desc]) =>
                  `<option value="${v}" ${v===cur?'selected':''}>${v} — ${esc(desc)}</option>`
                ).join('')}
              </select>
              <div class="hint" id="ob-hint-${k}">${esc(curDesc)}</div>
            </div>`;
        }).join('')}
      </div>
      <div class="card">
        <div class="field">
          <label>Daily time budget</label>
          <select data-obtb>
            <option value="15" ${onboardDraft.timeBudget===15?'selected':''}>15 min — quick, one focused thing</option>
            <option value="30" ${onboardDraft.timeBudget===30?'selected':''}>30 min — a solid daily practice</option>
            <option value="45" ${onboardDraft.timeBudget===45?'selected':''}>45 min — a full workout or deep session</option>
            <option value="60" ${onboardDraft.timeBudget===60?'selected':''}>60+ min — intense, multiple activities</option>
          </select>
          <div class="hint">Affects how many exercises and quests you get by default.</div>
        </div>
      </div>
      <div class="row" style="gap:8px">
        <button class="ghost" id="ob-back" style="flex:1">Back</button>
        <button class="primary" id="ob-next" style="flex:2">Continue</button>
      </div>
    `;
    document.querySelectorAll('[data-obstat]').forEach(sel => {
      sel.onchange = () => {
        const k = sel.dataset.obstat;
        onboardDraft.stats[k] = parseInt(sel.value, 10);
        const b = BENCHMARKS[k];
        const desc = (b.tiers.find(t => t[0] === onboardDraft.stats[k]) || b.tiers[0])[1];
        document.getElementById(`ob-hint-${k}`).textContent = desc;
      };
    });
    document.querySelector('[data-obtb]').onchange = e => {
      onboardDraft.timeBudget = parseInt(e.target.value, 10);
    };
    document.getElementById('ob-back').onclick = () => { onboardStep = 1; render(); };
    document.getElementById('ob-next').onclick = () => { onboardStep = 3; render(); };
    return;
  }

  if (onboardStep === 3){
    app.innerHTML = `
      <h1 style="margin-top:24px">Your skills</h1>
      <p class="dim" style="margin-top:12px">Pick what you want to level. Nothing forced.</p>
      ${onboardDraft.skills.length ? `
        <h2>Selected (${onboardDraft.skills.length})</h2>
        <div class="card">
          ${onboardDraft.skills.map((s, i) => `
            <div class="skill-row" style="cursor:default">
              <span>${esc(s.name)}</span>
              <button class="sm ghost danger" data-obrm="${i}">Remove</button>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <h2>Add a skill</h2>
      <div>
        ${SKILL_SUGGESTIONS.map(sug => `
          <details>
            <summary>${esc(sug.label)}</summary>
            ${sug.options.map(opt => `
              <div class="tier-row" data-obadd="${sug.id}|${esc(opt)}" style="cursor:pointer">
                <div class="tier-desc">${esc(opt)}</div>
              </div>
            `).join('')}
          </details>
        `).join('')}
        <details>
          <summary>Custom skill</summary>
          <div style="padding:10px">
            <input id="ob-custom" placeholder="Skill name">
            <button class="sm primary" id="ob-custom-add" style="margin-top:8px">Add</button>
          </div>
        </details>
      </div>
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="ob-back" style="flex:1">Back</button>
        <button class="primary" id="ob-next" style="flex:2">${onboardDraft.skills.length ? 'Continue' : 'Skip for now'}</button>
      </div>
    `;
    document.querySelectorAll('[data-obadd]').forEach(el => {
      el.onclick = () => {
        const [sugId, opt] = el.dataset.obadd.split('|');
        const sug = SKILL_SUGGESTIONS.find(s => s.id === sugId);
        if (!sug) return;
        if (onboardDraft.skills.some(s => s.name.toLowerCase() === opt.toLowerCase())){
          return alert('That skill is already added.');
        }
        onboardDraft.skills.push(makeSkillFromTemplate(sug, opt));
        render();
      };
    });
    document.querySelectorAll('[data-obrm]').forEach(b => {
      b.onclick = () => { onboardDraft.skills.splice(+b.dataset.obrm, 1); render(); };
    });
    document.getElementById('ob-custom-add').onclick = () => {
      const name = document.getElementById('ob-custom').value.trim();
      if (!name) return;
      if (onboardDraft.skills.some(s => s.name.toLowerCase() === name.toLowerCase())){
        return alert('That skill is already added.');
      }
      onboardDraft.skills.push(makeSkillFromTemplate({ subtype: 'custom', label: name }, name));
      document.getElementById('ob-custom').value = '';
      render();
    };
    document.getElementById('ob-back').onclick = () => { onboardStep = 2; render(); };
    document.getElementById('ob-next').onclick = () => {
      if (onboardDraft.skills.length === 0){
        state.name = onboardDraft.name;
        state.stats = { ...onboardDraft.stats };
        state.timeBudget = onboardDraft.timeBudget;
        state.skills = [];
        state.onboarded = true;
        save(); tab = 'status';
        return;
      }
      onboardStep = 4;
      render();
    };
    return;
  }

  if (onboardStep === 4) renderProgressionStep();
}

function renderProgressionStep(){
  const app = document.getElementById('app');
  const skills = onboardDraft.skills;

  const body = skills.map((skill) => {
    const questions = progressionFor(skill);
    const ans = onboardDraft.progression[skill.id] || {};

    return `
      <div class="prog-section">
        <h3 style="margin-bottom:12px">${esc(skill.name)}</h3>
        ${questions.map(q => {
          if (q.type === 'equipment'){
            return `
              <div class="field">
                <label>${esc(q.label)}</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
                  ${EQUIPMENT_OPTIONS.map(eq => `
                    <label style="display:flex;align-items:center;gap:6px;padding:6px 0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--txt)">
                      <input type="checkbox" data-obeq="${skill.id}|${eq.id}" ${((state.equipment)||[]).includes(eq.id) ? 'checked' : ''}>
                      <span>${esc(eq.label)}</span>
                    </label>
                  `).join('')}
                </div>
              </div>`;
          }
          if (q.type === 'days'){
            const current = ans[q.id] !== undefined ? ans[q.id] : q.default;
            return `
              <div class="field">
                <label>${esc(q.label)}</label>
                <div class="day-picker">
                  ${[0,1,2,3,4,5,6].map(d => {
                    const on = q.multi ? current.includes(d) : current === d;
                    return `<button type="button" class="${on?'primary':'ghost'}" data-obday="${skill.id}|${q.id}|${d}|${q.multi?'multi':'single'}">${dayShort(d)}</button>`;
                  }).join('')}
                </div>
              </div>`;
          }
          const visible = !q.onlyIf || q.onlyIf(ans);
          if (!visible) return '';
          return `
            <div class="field">
              <label>${esc(q.label)}</label>
              <select data-obq="${skill.id}|${q.id}">
                <option value="">— Select —</option>
                ${q.options.map(o =>
                  `<option value="${esc(o.value)}" ${ans[q.id]===o.value?'selected':''}>${esc(o.label)}</option>`
                ).join('')}
              </select>
            </div>`;
        }).join('')}
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <h1 style="margin-top:24px">Progression check</h1>
    <p class="dim" style="margin-top:12px">A few questions per skill. For fitness, exercises and reps are derived from your STR stat and equipment.</p>
    ${body}
    <div class="row" style="gap:8px;margin-top:16px">
      <button class="ghost" id="ob-back" style="flex:1">Back</button>
      <button class="primary" id="ob-next" style="flex:2">Start the System</button>
    </div>
  `;

  document.querySelectorAll('[data-obq]').forEach(sel => {
    sel.onchange = () => {
      const [skillId, qid] = sel.dataset.obq.split('|');
      onboardDraft.progression[skillId] = onboardDraft.progression[skillId] || {};
      onboardDraft.progression[skillId][qid] = sel.value;
      render();
    };
  });
  document.querySelectorAll('[data-obday]').forEach(btn => {
    btn.onclick = () => {
      const [skillId, qid, dStr, mode] = btn.dataset.obday.split('|');
      const d = parseInt(dStr, 10);
      onboardDraft.progression[skillId] = onboardDraft.progression[skillId] || {};
      const cur = onboardDraft.progression[skillId][qid];
      if (mode === 'multi'){
        const q = progressionFor(skills.find(s => s.id === skillId)).find(x => x.id === qid);
        const arr = Array.isArray(cur) ? [...cur] : [...(q.default || [])];
        const idx = arr.indexOf(d);
        if (idx >= 0) arr.splice(idx, 1); else arr.push(d);
        onboardDraft.progression[skillId][qid] = arr;
      } else {
        onboardDraft.progression[skillId][qid] = d;
      }
      render();
    };
  });
  document.querySelectorAll('[data-obeq]').forEach(el => {
    el.onchange = () => {
      const [skillId, eqId] = el.dataset.obeq.split('|');
      state.equipment = state.equipment || [];
      const idx = state.equipment.indexOf(eqId);
      if (el.checked && idx < 0) state.equipment.push(eqId);
      if (!el.checked && idx >= 0) state.equipment.splice(idx, 1);
    };
  });

  document.getElementById('ob-back').onclick = () => { onboardStep = 3; render(); };
  document.getElementById('ob-next').onclick = () => {
    state.name = onboardDraft.name;
    state.stats = { ...onboardDraft.stats };
    state.timeBudget = onboardDraft.timeBudget;

    onboardDraft.skills.forEach(skill => {
      const ans = onboardDraft.progression[skill.id] || {};
      if (skill.subtype === 'fitness' && skill.type === 'workout'){
        const questions = progressionFor(skill);
        questions.forEach(q => {
          if (q.type === 'days' && ans[q.id] === undefined) ans[q.id] = q.default;
        });
      }
      if (Object.keys(ans).length > 0) applyProgression(skill, ans);
    });

    // Recaclulate fitness plans with the final timeBudget
    state.skills = onboardDraft.skills;
    state.skills.forEach(s => {
      if (s.type === 'workout' && s.subtype === 'fitness' && s.plan){
        s.plan.exercises = deriveExercisesFromStats();
        s.plan.calibratedTo = { STR: state.stats.STR, equipment: [...(state.equipment||[])] };
      }
    });

    state.onboarded = true;
    state.lastCelebratedLevel = levelFromXP(state.totalXP);
    save(); tab = 'status';
  };
}

/* ═════ MAIN RENDER ═════ */
function render(){
  if (!state.onboarded){ renderOnboarding(); return; }
  document.getElementById('nav').classList.remove('hide');
  const app = document.getElementById('app');
  document.querySelectorAll('#nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));

  if (tab === 'status')  app.innerHTML = viewStatus();
  if (tab === 'quests')  app.innerHTML = viewQuests();
  if (tab === 'skills')  app.innerHTML = viewSkills();
  if (tab === 'bench')   app.innerHTML = viewBench();
  if (tab === 'log')     app.innerHTML = viewLog();
  if (tab === 'more')    app.innerHTML = viewMore();

  bind();
}
function navTo(t){ tab = t; render(); window.scrollTo(0, 0); }

function xpBar(){
  const lvl = levelFromXP(state.totalXP);
  const lo = xpForLevel(lvl);
  const hi = xpForLevel(lvl + 1);
  const pct = Math.min(100, ((state.totalXP - lo) / (hi - lo)) * 100);
  return `
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row between small dim mono" style="margin-top:6px">
      <span>${state.totalXP} / ${hi} XP</span>
      <span>${hi - state.totalXP} to next</span>
    </div>`;
}

function last7Days(){
  const arr = [];
  for (let i = 6; i >= 0; i--){
    const key = dateOffset(-i);
    const d = new Date(key + 'T00:00:00');
    const q = state.quests[key] || {};
    const logForDate = state.log.filter(e => e.date === key && e.xp > 0);
    const count = Math.max(Object.keys(q).length, logForDate.length);
    arr.push({ key, day: dayShort(d.getDay()), count, isToday: i === 0 });
  }
  return arr;
}

function viewStatus(){
  const lvl = levelFromXP(state.totalXP);
  const days = last7Days();
  const weekHtml = days.map(d => `
    <div class="week-cell">
      <div class="week-day">${d.day.slice(0,1)}</div>
      <div class="week-box ${d.count > 0 ? 'filled' : ''}">${d.count > 0 ? d.count : ''}</div>
    </div>
  `).join('');

  const stats = ['STR','AGI','VIT','INT','PER'].map(k => {
    const date = state.statDates[k];
    const days = daysSinceDate(date);
    const isStale = days === null || days > 30;
    const label = days === null ? 'untested'
      : days === 0 ? 'today'
      : `${days}d ago`;
    return `
      <div class="stat">
        <div>
          <div class="small">${k}</div>
          <div class="small mono ${isStale ? 'stat-label-stale' : 'dim'}">${label}</div>
        </div>
        <div class="mono" style="font-size:19px;font-weight:600">${state.stats[k]}</div>
      </div>`;
  }).join('');

  const active = state.skills.filter(s => s.active);
  const skillList = active.length
    ? active.map(s => `
        <div class="skill-row" style="cursor:pointer" data-skill-card="${s.id}">
          <span>${esc(s.name)}</span>
          <span class="small mono dim">${rankOf(s.level)} · Lv ${s.level}</span>
        </div>`).join('')
    : '<div class="dim small">No active skills.</div>';

  return `
    <div class="row between" style="margin-bottom:16px">
      <h1>The System</h1>
      <button class="sm ghost" id="share-btn">Share ↗</button>
    </div>
    <div class="card">
      <div class="row between">
        <div>
          <div class="dim small mono">${esc(state.name || 'PLAYER')}</div>
          <div class="big mono">Lv ${lvl}</div>
        </div>
        <div style="text-align:right">
          <div class="dim small mono">RANK</div>
          <div class="big mono" style="color:var(--accent)">${rankOf(lvl)}</div>
        </div>
      </div>
      ${xpBar()}
    </div>
    <div class="card">
      <div class="row between">
        <span class="dim small">STREAK</span>
        <span class="mono" style="font-size:20px">${state.streak} <span class="dim small">days</span></span>
      </div>
      <div class="week-strip">${weekHtml}</div>
    </div>
    <h2>Stats</h2>
    <div class="card">${stats}
      <button class="ghost sm" data-nav="bench" style="width:100%;margin-top:12px">View benchmarks & test →</button>
    </div>
    <h2>Active skills</h2>
    <div class="card">${skillList}</div>
  `;
}

function viewQuests(){
  const list = questsForToday();
  const day = new Date().getDay();
  const doneCount = list.filter(q => isQuestDone(q.id)).length;

  const nudges = state.skills.filter(s =>
    s.active && s.type === 'workout' && s.subtype === 'fitness'
    && s.plan && s.plan.attemptDay !== day
    && (s.workoutsSinceAttempt || 0) >= 4
  );
  const nudgeHtml = nudges.map(s => `
    <div class="notice warn">
      <b>${esc(s.name)}</b>: ${s.workoutsSinceAttempt} workouts since last attempt. Ready to test?
      <button class="sm primary" data-nudge-attempt="${s.id}" style="width:100%;margin-top:8px">Test my max now</button>
    </div>
  `).join('');

  const items = list.length ? list.map(q => {
    const done = isQuestDone(q.id);
    return `
      <div class="quest" data-quest="${q.id}">
        <div class="chk ${done ? 'done' : ''}">${done ? '✓' : ''}</div>
        <div style="flex:1;${done ? 'opacity:.5' : ''}">
          <div style="${done ? 'text-decoration:line-through' : ''}">${esc(q.text)}</div>
          <div class="small dim mono">+${q.xp} XP${q.kind === 'cardio' ? ' · VIT training' : ''}${q.kind === 'attempt' ? ' · test your max' : ''}</div>
        </div>
      </div>`;
  }).join('') : '<div class="dim small" style="padding:12px 0">No quests today. Add or activate a skill in Skills.</div>';

  return `
    <h2>Today · ${dayName(day)} ${today().slice(5)}</h2>
    ${nudgeHtml}
    <div class="card">${items}</div>
    <div class="card row between">
      <span class="small dim">${doneCount} / ${list.length} done</span>
      <span class="small dim mono">${state.streak} day streak</span>
    </div>
  `;
}

function viewSkills(){
  const rows = state.skills.map(s => {
    const need = skillXpForLevel(s.level);
    const pct = s.level >= 50 ? 100 : (s.xp / need) * 100;
    const detail = s.type === 'workout' && s.plan
      ? `${s.plan.exercises.length} exercises · ${s.plan.workoutDays.length} days/week`
      : (s.quests ? `${s.quests.length} quest${s.quests.length === 1 ? '' : 's'}` : '');
    const ladderInfo = s.ladder && s.ladder.length
      ? `${(s.ladderDone || []).length}/${s.ladder.length} milestones`
      : '';
    let recalibrate = '';
    if (s.type === 'workout' && s.subtype === 'fitness' && s.plan && s.plan.calibratedTo){
      if (state.stats.STR !== s.plan.calibratedTo.STR) recalibrate = ' · <span style="color:var(--gold)">recalibrate available</span>';
    }
    return `
      <div class="card" data-skill-card="${s.id}" style="cursor:pointer">
        <div class="row between">
          <div class="row" style="gap:8px;flex:1;min-width:0">
            <h3 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</h3>
            <span class="tag ${s.active ? 'on rank-'+rankOf(s.level) : ''}">${s.active ? rankOf(s.level) : 'paused'}</span>
          </div>
          <span class="mono small dim" style="white-space:nowrap">Lv ${s.level}</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="small dim" style="margin-top:8px">${esc(detail)}${ladderInfo ? ` · ${ladderInfo}` : ''}${recalibrate}</div>
        ${s.status ? `<div class="small dim" style="margin-top:4px">Status: ${esc(s.status)}</div>` : ''}
      </div>`;
  }).join('');
  return `
    <h2>Skills · ${state.skills.filter(s=>s.active).length} active / ${state.skills.length} total</h2>
    ${rows || '<div class="card dim small">No skills yet.</div>'}
    <button class="primary" id="add-skill" style="width:100%;margin-top:12px">+ Add skill</button>
  `;
}

function viewBench(){
  return `
    <h1>Benchmarks</h1>
    <div class="card" style="margin-top:16px">
      <p class="small">Each stat is scored 1–100. Every tier is a concrete test you pass or fail in a single session.</p>
      <p class="small dim" style="margin-top:8px">Tap a tier to log a test. <b style="color:var(--txt)">Higher</b> → stat rises, +50 XP. <b style="color:var(--txt)">Current</b> → refreshes date. <b style="color:var(--txt)">Lower</b> → demotes.</p>
    </div>
    ${['STR','AGI','VIT','INT','PER'].map(renderBenchCard).join('')}
  `;
}
function renderBenchCard(k){
  const b = BENCHMARKS[k];
  const cur = state.stats[k];
  const curTier = b.tiers.reduce((a, t) => t[0] <= cur && t[0] > a ? t[0] : a, 0);
  const days = daysSinceDate(state.statDates[k]);
  const date = state.statDates[k] ? (days === 0 ? 'today' : `${days}d ago`) : 'untested';
  const rows = b.tiers.map(([v, desc]) => {
    const isCur = v === curTier;
    const isBelow = v < curTier;
    return `
      <div class="tier-row ${isCur?'current':''} ${isBelow?'below':''}" data-tier="${k}:${v}">
        <div class="tier-val">${v}</div>
        <div class="tier-desc">${esc(desc)}</div>
      </div>`;
  }).join('');
  return `
    <details>
      <summary>
        <span>${k} · ${b.label}</span>
        <span class="small mono dim" style="font-weight:400;white-space:nowrap">${cur} · ${date}</span>
      </summary>
      <div class="tier-list">
        <div class="small dim" style="padding:10px 8px">${b.note}</div>
        ${rows}
      </div>
    </details>`;
}

function viewLog(){
  const rows = state.log.length
    ? state.log.map(e => `
        <div class="logrow">
          <span><span class="dim mono">${e.date.slice(5)}</span> ${esc(e.note)}</span>
          <span class="xp">${e.xp > 0 ? '+' : ''}${e.xp}</span>
        </div>`).join('')
    : '<div class="dim small">Nothing logged yet.</div>';
  return `
    <h2>Log date</h2>
    <div class="card">
      <input type="date" id="log-date" value="${logDate}" max="${today()}">
      <div class="small dim" style="margin-top:8px">Applies to quick logs and adjustments below.</div>
    </div>

/* ═════ SHARE PROGRESS ═════ */
function shareProgress(){
  const w = 800, h = 1000;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  const bg = '#0a0e14', panel = '#111823', line = '#1d2836';
  const txt = '#c8d4e4', dim = '#6b7c93', accent = '#4da6ff';
  const font = (weight, size, mono=false) =>
    `${weight} ${size}px ${mono ? 'ui-monospace, "SF Mono", Menlo, monospace' : '-apple-system, system-ui, sans-serif'}`;

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = line;
  ctx.lineWidth = 1;
  ctx.strokeRect(20, 20, w-40, h-40);
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';

  // Header
  ctx.fillStyle = accent;
  ctx.font = font(600, 16);
  ctx.fillText('THE SYSTEM', 60, 60);
  ctx.fillStyle = dim;
  ctx.font = font(500, 13, true);
  ctx.textAlign = 'right';
  ctx.fillText(today(), w - 60, 60);
  ctx.textAlign = 'left';

  // Name
  ctx.fillStyle = txt;
  ctx.font = font(600, 30);
  ctx.fillText(state.name || 'Player', 60, 90);

  // Divider
  ctx.fillStyle = line;
  ctx.fillRect(60, 145, w - 120, 1);

  // Big three
  const lvl = levelFromXP(state.totalXP);
  const rank = rankOf(lvl);

  ctx.fillStyle = dim;
  ctx.font = font(500, 12);
  ctx.fillText('LEVEL', 60, 175);
  ctx.fillText('RANK', 280, 175);
  ctx.fillText('STREAK', 500, 175);

  ctx.fillStyle = txt;
  ctx.font = font(700, 64, true);
  ctx.fillText(String(lvl), 60, 195);
  ctx.fillStyle = accent;
  ctx.fillText(rank, 280, 195);
  ctx.fillStyle = txt;
  ctx.fillText(String(state.streak), 500, 195);

  ctx.fillStyle = dim;
  ctx.font = font(500, 14);
  const streakWidth = ctx.measureText(String(state.streak)).width;
  ctx.fillText('days', 500 + ctx.measureText(String(state.streak)).width + (String(state.streak).length * 2), 245);

  // Divider
  ctx.fillStyle = line;
  ctx.fillRect(60, 300, w - 120, 1);

  // Stats
  ctx.fillStyle = dim;
  ctx.font = font(500, 12);
  ctx.fillText('STATS', 60, 325);

  ['STR','AGI','VIT','INT','PER'].forEach((k, i) => {
    const y = 360 + i * 45;
    ctx.fillStyle = dim;
    ctx.font = font(500, 14);
    ctx.fillText(k, 60, y + 2);

    const barX = 140, barW = 500, barH = 8;
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(barX, y + 5, barW, barH);
    ctx.fillStyle = accent;
    ctx.fillRect(barX, y + 5, barW * (state.stats[k] / 100), barH);

    ctx.fillStyle = txt;
    ctx.font = font(600, 18, true);
    ctx.textAlign = 'right';
    ctx.fillText(String(state.stats[k]), w - 60, y);
    ctx.textAlign = 'left';
  });

  // Divider
  ctx.fillStyle = line;
  ctx.fillRect(60, 600, w - 120, 1);

  // Skills
  ctx.fillStyle = dim;
  ctx.font = font(500, 12);
  ctx.fillText('ACTIVE SKILLS', 60, 625);

  const active = state.skills.filter(s => s.active);
  active.slice(0, 5).forEach((s, i) => {
    const y = 660 + i * 40;
    ctx.fillStyle = txt;
    ctx.font = font(500, 16);
    ctx.fillText(s.name, 60, y);
    ctx.fillStyle = dim;
    ctx.font = font(500, 14, true);
    ctx.textAlign = 'right';
    ctx.fillText(`${rankOf(s.level)} · Lv ${s.level}`, w - 60, y);
    ctx.textAlign = 'left';
  });

  // Footer
  ctx.fillStyle = dim;
  ctx.font = font(500, 12);
  ctx.fillText('Honest logging. No inflated numbers.', 60, h - 60);

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    openModal(`
      <h2>Progress card</h2>
      <img src="${url}" style="width:100%;border-radius:8px;border:1px solid var(--line);display:block">
      <p class="small dim" style="margin-top:12px">Long-press the image to save it to photos. Or tap download.</p>
      <a href="${url}" download="the-system-${today()}.png"
         style="display:block;text-align:center;text-decoration:none;padding:12px;border-radius:8px;font-weight:600;color:#06121f;background:var(--accent);margin-top:12px">
        Download
      </a>
      <button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Close</button>
    `);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }, 'image/png');
}

function openSkillDetail(skillId){
  const skill = state.skills.find(s => s.id === skillId);
  if (!skill) return;

  function renderDetail(){
    const ladder = skill.ladder || [];
    const done = skill.ladderDone || [];
    const nextIdx = ladder.findIndex((m, i) => !done.includes(i));

    const ladderHtml = ladder.length ? ladder.map((m, i) => {
      const isDone = done.includes(i);
      const isNext = i === nextIdx;
      return `
        <div class="tier-row ${isNext?'current':''} ${isDone?'below':''}" data-ladder="${i}">
          <div class="tier-val">${isDone ? '✓' : (isNext ? '›' : '·')}</div>
          <div class="tier-desc">${esc(m)}</div>
        </div>`;
    }).join('') : '<div class="dim small" style="padding:12px">No ladder set.</div>';

    const status = skill.status ? esc(skill.status) : '<span class="dim">Not set</span>';
    const isBusinessUndecided = skill.subtype === 'business' && /not decided/i.test(skill.detail || '');

    let needsRecalibrate = false;
    if (skill.type === 'workout' && skill.plan && skill.plan.calibratedTo){
      needsRecalibrate = state.stats.STR !== skill.plan.calibratedTo.STR;
    }

    openModal(`
      <div class="row between" style="margin-bottom:16px">
        <h2 style="margin:0">${esc(skill.name)}</h2>
        <button class="sm ghost" id="sd-close">×</button>
      </div>

      ${needsRecalibrate ? `
        <div class="notice warn">
          <b>Your STR has changed since this plan was built.</b>
          <button class="sm primary" id="sd-recalibrate" style="width:100%;margin-top:8px">Recalculate from stats</button>
        </div>
      ` : ''}

      <div class="card">
        <div class="row between">
          <span class="dim small">STATUS</span>
          <button class="sm ghost" id="sd-progress">Update</button>
        </div>
        <div style="margin-top:6px">${status}</div>
        ${skill.type === 'workout' && skill.subtype === 'fitness' ? `
          <div class="small dim" style="margin-top:8px">Workouts since attempt: ${skill.workoutsSinceAttempt || 0}</div>
        ` : ''}
      </div>

      ${isBusinessUndecided ? `
        <div class="notice"><b>You haven't decided on your business yet.</b> Tap <b>Regenerate</b> — the AI will suggest 3 ideas and build the ladder for the most promising one.</div>
      ` : ''}

      <div class="row between" style="margin:16px 0 8px">
        <span class="dim small">PROGRESSION LADDER</span>
        <button class="sm ghost" id="sd-regen-ai">✨ Regenerate</button>
      </div>
      <div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px">
        ${ladderHtml}
      </div>

      ${nextIdx >= 0 ? `
        <div class="notice" style="margin-top:16px"><b>Next step:</b> ${esc(ladder[nextIdx])}</div>
      ` : (ladder.length ? `
        <div class="notice ok" style="margin-top:16px"><b>Ladder complete.</b></div>
      ` : '')}

      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="sd-pause" style="flex:1">${skill.active ? 'Pause' : 'Activate'}</button>
        <button class="ghost" id="sd-edit" style="flex:1">Edit</button>
        <button class="ghost danger" id="sd-del" style="flex:1">Delete</button>
      </div>
    `);

    document.getElementById('sd-close').onclick = closeModal;
    document.getElementById('sd-progress').onclick = () => openProgressionModal(skill, renderDetail);
    document.getElementById('sd-regen-ai').onclick = () => openLadderAI(skill, renderDetail);
    document.getElementById('sd-pause').onclick = () => {
      skill.active = !skill.active; save(); renderDetail();
    };
    document.getElementById('sd-edit').onclick = () => { closeModal(); openSkillEditor(skill.id); };
    document.getElementById('sd-del').onclick = () => {
      if (!confirm(`Delete "${skill.name}"?`)) return;
      state.skills = state.skills.filter(s => s.id !== skill.id);
      save(); closeModal();
    };
    const rec = document.getElementById('sd-recalibrate');
    if (rec) rec.onclick = () => {
      skill.plan.exercises = deriveExercisesFromStats();
      skill.plan.calibratedTo = { STR: state.stats.STR, equipment: [...(state.equipment||[])] };
      delete skill.plan.userEdited;
      save(); renderDetail();
    };
    document.querySelectorAll('[data-ladder]').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.ladder;
        if (skill.ladderDone && skill.ladderDone.includes(i)) untickMilestone(skill, i);
        else tickMilestone(skill, i);
        save(); renderDetail();
      };
    });
  }

  renderDetail();
}

function openProgressionModal(skill, back){
  const questions = progressionFor(skill);
  const answers = {};
  questions.forEach(q => {
    if (q.type === 'equipment' || q.type === 'days' || q.onlyIf) return;
    const match = q.options.find(o => o.label === skill.status || skill.status?.startsWith(o.label));
    if (match) answers[q.id] = match.value;
  });
  if (skill.type === 'workout' && skill.plan){
    answers.workoutDays = [...(skill.plan.workoutDays || [1,3,5])];
    answers.attemptDay = skill.plan.attemptDay || 0;
  }

  function renderProg(){
    openModal(`
      <h2>${esc(skill.name)} — progression</h2>
      ${questions.map(q => {
        if (q.type === 'equipment'){
          return `
            <div class="field" style="margin-top:16px">
              <label>${esc(q.label)}</label>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
                ${EQUIPMENT_OPTIONS.map(eq => `
                  <label style="display:flex;align-items:center;gap:6px;padding:6px 0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--txt)">
                    <input type="checkbox" data-peq="${eq.id}" ${(state.equipment||[]).includes(eq.id) ? 'checked' : ''}>
                    <span>${esc(eq.label)}</span>
                  </label>
                `).join('')}
              </div>
            </div>`;
        }
        if (q.type === 'days'){
          const current = answers[q.id] !== undefined ? answers[q.id] : q.default;
          return `
            <div class="field">
              <label>${esc(q.label)}</label>
              <div class="day-picker">
                ${[0,1,2,3,4,5,6].map(d => {
                  const on = q.multi ? current.includes(d) : current === d;
                  return `<button type="button" class="${on?'primary':'ghost'}" data-pday="${q.id}|${d}|${q.multi?'multi':'single'}">${dayShort(d)}</button>`;
                }).join('')}
              </div>
            </div>`;
        }
        const visible = !q.onlyIf || q.onlyIf(answers);
        if (!visible) return '';
        return `
          <div class="field">
            <label>${esc(q.label)}</label>
            <select data-pq="${q.id}">
              <option value="">— Select —</option>
              ${q.options.map(o =>
                `<option value="${esc(o.value)}" ${answers[q.id]===o.value?'selected':''}>${esc(o.label)}</option>`
              ).join('')}
            </select>
          </div>`;
      }).join('')}
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="pm-cancel" style="flex:1">Cancel</button>
        <button class="primary" id="pm-save" style="flex:2">Save</button>
      </div>
    `);
    document.querySelectorAll('[data-pq]').forEach(sel => {
      sel.onchange = () => { answers[sel.dataset.pq] = sel.value; renderProg(); };
    });
    document.querySelectorAll('[data-pday]').forEach(btn => {
      btn.onclick = () => {
        const [qid, dStr, mode] = btn.dataset.pday.split('|');
        const d = parseInt(dStr, 10);
        const q = questions.find(x => x.id === qid);
        if (mode === 'multi'){
          const arr = Array.isArray(answers[qid]) ? [...answers[qid]] : [...(q.default || [])];
          const idx = arr.indexOf(d);
          if (idx >= 0) arr.splice(idx, 1); else arr.push(d);
          answers[qid] = arr;
        } else {
          answers[qid] = d;
        }
        renderProg();
      };
    });
    document.querySelectorAll('[data-peq]').forEach(el => {
      el.onchange = () => {
        state.equipment = state.equipment || [];
        const id = el.dataset.peq;
        const idx = state.equipment.indexOf(id);
        if (el.checked && idx < 0) state.equipment.push(id);
        if (!el.checked && idx >= 0) state.equipment.splice(idx, 1);
      };
    });
    document.getElementById('pm-cancel').onclick = () => { closeModal(); back && back(); };
    document.getElementById('pm-save').onclick = () => {
      applyProgression(skill, answers);
      save(); closeModal(); back && back();
    };
  }
  renderProg();
}

function openLadderAI(skill, back){
  const prompt = buildLadderAIPrompt(skill);
  const key = state.settings.apiKey;
  const base = state.settings.apiBase;
  const model = state.settings.apiModel;

  openModal(`
    <h2>Regenerate ladder</h2>
    <div class="notice"><b>Route 1 — API.</b> If you've saved a key, tap Generate.<br><br><b>Route 2 — manual.</b> Copy prompt → paste into ChatGPT → paste JSON back.</div>
    <div class="field">
      <label>Prompt</label>
      <textarea id="la-prompt" rows="6" readonly>${esc(prompt)}</textarea>
      <button class="sm" id="la-copy" style="margin-top:8px">Copy prompt</button>
    </div>
    ${key ? `<button class="primary" id="la-run" style="width:100%">Generate via API (${esc(model)})</button>
             <div id="la-status" class="small dim" style="margin-top:8px;text-align:center"></div>` : ''}
    <div class="field" style="margin-top:16px">
      <label>Result</label>
      <textarea id="la-result" rows="6" placeholder='["Milestone 1","Milestone 2",...]'></textarea>
    </div>
    <div class="row" style="gap:8px">
      <button class="ghost" id="la-cancel" style="flex:1">Cancel</button>
      <button class="primary" id="la-save" style="flex:2">Replace ladder</button>
    </div>
  `);
  document.getElementById('la-cancel').onclick = closeModal;
  document.getElementById('la-copy').onclick = () => {
    const el = document.getElementById('la-prompt');
    el.select(); document.execCommand('copy');
    const b = document.getElementById('la-copy');
    b.textContent = 'Copied ✓';
    setTimeout(() => { b.textContent = 'Copy prompt'; }, 1500);
  };
  const runBtn = document.getElementById('la-run');
  if (runBtn) runBtn.onclick = async () => {
    const status = document.getElementById('la-status');
    status.textContent = 'Generating…';
    try {
      const arr = await callAI(prompt, key, base, model);
      document.getElementById('la-result').value = JSON.stringify(arr, null, 2);
      status.textContent = `Got ${arr.length} milestones.`;
    } catch(e){ status.textContent = 'Failed: ' + e.message; status.style.color = 'var(--danger)'; }
  };
  document.getElementById('la-save').onclick = () => {
    const text = document.getElementById('la-result').value.trim();
    if (!text) return alert('Paste or generate milestones first.');
    let arr;
    try {
      arr = text.startsWith('[') ? JSON.parse(text)
        : text.split('\n').map(l => l.trim()).filter(Boolean);
    } catch(e){ return alert('Could not parse.'); }
    if (!Array.isArray(arr) || !arr.length) return alert('No milestones found.');
    skill.ladder = arr.map(String);
    skill.ladderDone = []; skill.ladderEarned = [];
    skill.ladderXpLogs = {}; skill.ladderPreticked = [];
    save(); closeModal(); back();
  };
}
