            <option value="45" ${onboardDraft.timeBudget===45?'selected':''}>45 min — a full workout or deep session</option>
            <option value="60" ${onboardDraft.timeBudget===60?'selected':''}>60+ min — intense, multiple activities</option>
          </select>
          <div class="hint">This sets how long your workout plans and daily quests are. You can change it later in More.</div>
        </div>
      </div>

      <div class="row" style="gap:8px"><button class="ghost" id="ob-back" style="flex:1">Back</button><button class="primary" id="ob-next" style="flex:2">Continue</button></div>
    `;
    document.querySelectorAll('[data-obstat]').forEach(sel => {
      sel.onchange = () => {
        onboardDraft.stats[sel.dataset.obstat] = parseInt(sel.value, 10);
        render();
      };
    });
    document.querySelector('[data-obtb]').onchange = e => { onboardDraft.timeBudget = parseInt(e.target.value, 10); };
    document.getElementById('ob-back').onclick = () => { onboardStep = 1; render(); };
    document.getElementById('ob-next').onclick = () => {
      onboardDraft.name = document.getElementById('ob-name').value.trim();
      onboardStep = 3; render();
    };
    return;
  }

  if (onboardStep === 3){
    const count = onboardDraft.skills.length;
    const atCap = count >= MAX_ACTIVE_SKILLS;
    app.innerHTML = `
      <h1 style="margin-top:24px">Your skills</h1>
      <p class="dim" style="margin-top:8px">Choose up to five skills to work on at once. Each skill gets its own progression ladder and its own daily quests. You can add, remove, or swap any skill at any time — parked skills keep all their progress.</p>
      <div class="card" style="padding:10px 14px"><div class="row between"><span class="small dim">Active skills</span><span class="slot-counter ${atCap?'full':''}">${count}/${MAX_ACTIVE_SKILLS}</span></div></div>
      ${onboardDraft.skills.length ? `<div class="card">${onboardDraft.skills.map((s, i) => `<div class="skill-row" style="cursor:default"><span>${esc(s.name)}</span><button class="sm ghost danger" data-obrm="${i}">Remove</button></div>`).join('')}</div>` : ''}
      ${atCap ? `<div class="notice" style="margin-top:12px">At the 5-skill cap. Remove one above to free a slot, or continue — you'll be able to add more later from the Skills tab.</div>` : `
        <h2>Add a skill</h2>
        <div>
          ${SKILL_SUGGESTIONS.map(sug => `<details><summary>${esc(sug.label)}</summary>${sug.options.map(opt => `<div class="tier-row" data-obadd="${sug.id}|${esc(opt)}" style="cursor:pointer"><div class="tier-desc">${esc(opt)}</div></div>`).join('')}</details>`).join('')}
          <details><summary>Custom skill</summary><div style="padding:10px"><input id="ob-custom" placeholder="Skill name"><button class="sm primary" id="ob-custom-add" style="margin-top:8px">Add</button></div></details>
        </div>
      `}
      <div class="row" style="gap:8px;margin-top:16px">
        <button class="ghost" id="ob-back" style="flex:1">Back</button>
        <button class="primary" id="ob-next" style="flex:2">${onboardDraft.skills.length ? 'Continue' : 'Skip'}</button>
      </div>
    `;
    document.querySelectorAll('[data-obadd]').forEach(el => {
      el.onclick = () => {
        if (onboardDraft.skills.length >= MAX_ACTIVE_SKILLS){ alert(`Max ${MAX_ACTIVE_SKILLS} active skills.`); return; }
        const [sugId, opt] = el.dataset.obadd.split('|');
        const sug = SKILL_SUGGESTIONS.find(s => s.id === sugId);
        if (!sug) return;
        if (onboardDraft.skills.some(s => s.name.toLowerCase() === smartSkillName(sug, opt).toLowerCase())) return alert('Already added.');
        onboardDraft.skills.push(makeSkillFromTemplate(sug, opt));
        render();
      };
    });
    document.querySelectorAll('[data-obrm]').forEach(b => { b.onclick = () => { onboardDraft.skills.splice(+b.dataset.obrm, 1); render(); }; });
    const addCustomBtn = document.getElementById('ob-custom-add');
    if (addCustomBtn) addCustomBtn.onclick = () => {
      if (onboardDraft.skills.length >= MAX_ACTIVE_SKILLS){ alert(`Max ${MAX_ACTIVE_SKILLS} active skills.`); return; }
      const name = document.getElementById('ob-custom').value.trim();
      if (!name) return;
      if (onboardDraft.skills.some(s => s.name.toLowerCase() === name.toLowerCase())) return alert('Already added.');
      onboardDraft.skills.push(makeSkillFromTemplate({ subtype: 'custom', label: name }, name));
      document.getElementById('ob-custom').value = '';
      render();
    };
    document.getElementById('ob-back').onclick = () => { onboardStep = 2; render(); };
    document.getElementById('ob-next').onclick = () => {
      if (onboardDraft.skills.length === 0){ finishOnboarding(); return; }
      onboardStep = 4; render();
    };
    return;
  }

  if (onboardStep === 4) renderProgressionStep();
}

function renderProgressionStep(){
  const app = document.getElementById('app');
  const skills = onboardDraft.skills;
  const anyFitnessNeedsEquip = skills.some(s => s.subtype === 'fitness' && s.type === 'workout' && fitnessNeedsEquipment(s.detail));
  const showEquipment = anyFitnessNeedsEquip && !state.equipmentConfigured;

  const body = skills.map((skill) => {
    const questions = progressionFor(skill);
    const ans = onboardDraft.progression[skill.id] || {};
    return `<div class="prog-section"><h3 style="margin-bottom:12px">${esc(skill.name)}</h3>
      ${questions.map(q => {
        if (q.type === 'days'){
          const current = ans[q.id] !== undefined ? ans[q.id] : q.default;
          return `<div class="field"><label>${esc(q.label)}</label><div class="day-picker">${[0,1,2,3,4,5,6].map(d => { const on = q.multi ? current.includes(d) : current === d; return `<button type="button" class="${on?'primary':'ghost'}" data-obday="${skill.id}|${q.id}|${d}|${q.multi?'multi':'single'}">${dayShort(d)}</button>`; }).join('')}</div></div>`;
        }
        const visible = !q.onlyIf || q.onlyIf(ans);
        if (!visible) return '';
        return `<div class="field"><label>${esc(q.label)}</label><select data-obq="${skill.id}|${q.id}"><option value="">— Select —</option>${q.options.map(o => `<option value="${esc(o.value)}" ${ans[q.id]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
      }).join('')}
    </div>`;
  }).join('');

  app.innerHTML = `
    <h1 style="margin-top:24px">Where you're at</h1>
    <p class="dim" style="margin-top:8px">A quick calibration for each skill. Your answers set the starting level — a business with a bank account and domain starts higher than one with just an idea. Skip anything you're unsure about and start from the beginning.</p>
    ${showEquipment ? `<div class="card">${renderEquipmentSection()}</div>` : ''}
    ${body}
    <div class="row" style="gap:8px;margin-top:16px">
      <button class="ghost" id="ob-back" style="flex:1">Back</button>
      <button class="ghost" id="ob-skip" style="flex:1">Skip</button>
      <button class="primary" id="ob-next" style="flex:2">Start</button>
    </div>
  `;

  if (showEquipment){
    document.querySelectorAll('[data-eq]').forEach(el => {
      el.onchange = () => {
        state.equipment = state.equipment || [];
        const id = el.dataset.eq;
        const idx = state.equipment.indexOf(id);
        if (el.checked && idx < 0) state.equipment.push(id);
        if (!el.checked && idx >= 0) state.equipment.splice(idx, 1);
        render();
      };
    });
    document.querySelectorAll('[data-eqw]').forEach(el => {
      el.onchange = () => { state.equipmentWeights = state.equipmentWeights || {}; state.equipmentWeights[el.dataset.eqw] = parseFloat(el.value) || 0; };
    });
    document.querySelectorAll('[data-eqx]').forEach(el => {
      el.onchange = () => { state.equipmentWeights = state.equipmentWeights || {}; state.equipmentWeights[el.dataset.eqx] = el.checked; };
    });
  }

  document.querySelectorAll('[data-obq]').forEach(sel => {
    sel.onchange = () => {
      const [skillId, qid] = sel.dataset.obq.split('|');
      onboardDraft.progression[skillId] = onboardDraft.progression[skillId] || {};
      onboardDraft.progression[skillId][qid] = sel.value;
      render();
    };
  });
  document.querySelectorAll('[data-obday]').forEach(btn => {
    btn.onclick = () => {
      const [skillId, qid, dStr, mode] = btn.dataset.obday.split('|');
      const d = parseInt(dStr, 10);
      onboardDraft.progression[skillId] = onboardDraft.progression[skillId] || {};
      const cur = onboardDraft.progression[skillId][qid];
      if (mode === 'multi'){
        const q = progressionFor(skills.find(s => s.id === skillId)).find(x => x.id === qid);
        const arr = Array.isArray(cur) ? [...cur] : [...(q.default || [])];
        const idx = arr.indexOf(d);
        if (idx >= 0) arr.splice(idx, 1); else arr.push(d);
        onboardDraft.progression[skillId][qid] = arr;
      } else onboardDraft.progression[skillId][qid] = d;
      render();
    };
  });

  document.getElementById('ob-back').onclick = () => { onboardStep = 3; render(); };
  document.getElementById('ob-skip').onclick = () => finishOnboarding();
  document.getElementById('ob-next').onclick = () => {
    if (showEquipment) state.equipmentConfigured = true;
    onboardDraft.skills.forEach(skill => {
      const ans = onboardDraft.progression[skill.id] || {};
      if (skill.subtype === 'fitness' && skill.type === 'workout'){
        const qs = progressionFor(skill);
        qs.forEach(q => { if (q.type === 'days' && ans[q.id] === undefined) ans[q.id] = q.default; });
      }
      if (Object.keys(ans).length > 0) applyProgression(skill, ans);
    });
    finishOnboarding();
  };
}

function finishOnboarding(){
  state.name = onboardDraft.name;
  state.stats = { ...onboardDraft.stats };
  state.timeBudget = onboardDraft.timeBudget;
  state.skills = onboardDraft.skills;
  state.skills.forEach(s => {
    if (s.type === 'workout' && s.subtype === 'fitness' && s.plan){
      s.plan.exercises = deriveExercisesFromStats();
      s.plan.calibratedTo = { STR: state.stats.STR, equipment: [...(state.equipment||[])], weights: { ...(state.equipmentWeights||{}) } };
    }
    ensureMilestoneQuests(s);
    applyCalibrationToSkill(s);
  });
  state.totalXP = 0;
  state.startedAt = today();
  state.lastOpenedDate = today();
  state.onboarded = true;
  state.lastPlayerLevel = computePlayerLevel();
  state.lastPlayerRank = rankOf(state.lastPlayerLevel);
  checkSkillTitles();
  checkStreakTitles();
  save(); tab = 'status';
}

/* ═══════════════════════════════════════════
   WELCOME BACK
   ═══════════════════════════════════════════ */
function checkWelcomeBack(){
  if (!state.onboarded) return;
  if (!state.lastOpenedDate) { state.lastOpenedDate = today(); return; }
  const gap = daysSinceDate(state.lastOpenedDate);
  if (gap !== null && gap >= 7 && !state.paused){
    setTimeout(() => {
      openModal(`
        <h2>Welcome back</h2>
        <p class="small dim">You've been away ${gap} days. Your progress is intact.</p>
        <p class="small dim" style="margin-top:12px">One thing today — a 5-minute version of any quest. That's the whole ask.</p>
        <div style="margin-top:16px">
          <button class="primary" style="width:100%" onclick="closeModal()">OK</button>
        </div>
      `);
    }, 300);
  }
  state.lastOpenedDate = today();
}

/* ═══════════════════════════════════════════
   MAIN RENDER
   ═══════════════════════════════════════════ */
function render(){
  if (!state.onboarded){ renderOnboarding(); return; }
  document.getElementById('nav').classList.remove('hide');
  const app = document.getElementById('app');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'status')  app.innerHTML = viewStatus();
  if (tab === 'quests')  app.innerHTML = viewQuests();
  if (tab === 'skills')  app.innerHTML = viewSkills();
  if (tab === 'bench')   app.innerHTML = viewBench();
  if (tab === 'log')     app.innerHTML = viewLog();
  if (tab === 'more')    app.innerHTML = viewMore();
  bind();
}
function navTo(t){ tab = t; render(); window.scrollTo(0, 0); }

function powerBar(){
  const power = computeTotalPower();
  const level = computePlayerLevel();
  if (level >= 100){
    return `<div class="bar"><i style="width:100%"></i></div><div class="row between small dim mono" style="margin-top:6px"><span>Power ${power}</span><span>MAX LEVEL</span></div>`;
  }
  const levelStart = powerForLevel(level);
  const levelEnd = powerForLevel(level + 1);
  const range = Math.max(1, levelEnd - levelStart);
  const pct = Math.min(100, Math.max(0, ((power - levelStart) / range) * 100));
  const toNext = Math.max(0, levelEnd - power);
  return `<div class="bar"><i style="width:${pct}%"></i></div><div class="row between small dim mono" style="margin-top:6px"><span>Power ${power} / ${levelEnd}</span><span>${toNext} to next</span></div>`;
}

function activityCountForDate(key){
  const q = state.quests[key] || {};
  const logForDate = state.log.filter(e => e.date === key && e.xp > 0);
  return Math.max(Object.keys(q).length, logForDate.length);
}
function last7Days(){
  const arr = [];
  for (let i = 6; i >= 0; i--){ const key = dateOffset(-i); const d = new Date(key + 'T00:00:00'); arr.push({ key, day: dayShort(d.getDay()), count: activityCountForDate(key) }); }
  return arr;
}
function lastYearDays(){
  const arr = [];
  for (let i = 364; i >= 0; i--){ const key = dateOffset(-i); arr.push({ key, count: activityCountForDate(key) }); }
  return arr;
}

function viewStatus(){
  const lvl = computePlayerLevel();
  const days = last7Days();
  const weekHtml = days.map(d => `<div class="week-cell"><div class="week-day">${d.day.slice(0,1)}</div><div class="week-box ${d.count>0?'filled':''}">${d.count>0?d.count:''}</div></div>`).join('');
  const yearDays = lastYearDays();
  const maxCount = Math.max(1, ...yearDays.map(d => d.count));
  const yearHtml = yearDays.map(d => { let cls = ''; if (d.count > 0){ const l = Math.min(4, Math.ceil((d.count/maxCount)*4)); cls = 'lvl-'+l; } return `<div class="heat-cell ${cls}" title="${d.key}: ${d.count}"></div>`; }).join('');

  const stats = ['STR','AGI','VIT','INT','PER'].map(k => {
    const days = daysSinceDate(state.statDates[k]);
    const isStale = days === null || days > 30;
    const label = days === null ? 'untested' : days === 0 ? 'today' : `${days}d ago`;
    return `<div class="stat"><div><div class="small">${k}</div><div class="small mono ${isStale?'stat-label-stale':'dim'}">${label}</div></div><div class="mono" style="font-size:19px;font-weight:600">${state.stats[k]}</div></div>`;
  }).join('');

  const active = activeSkills();
  const skillList = active.length ? active.map(s => {
    const idx = currentMilestoneIdx(s);
    const milestone = (idx >= 0 && s.ladder) ? s.ladder[idx] : null;
    const title = titleForSkill(s);
    return `<div class="skill-row" style="cursor:pointer" data-skill-card="${s.id}"><div style="min-width:0;flex:1"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)} ${title ? `<span class="skill-title">${esc(title)}</span>` : ''}</div>${milestone ? `<div class="small dim" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">→ ${esc(milestone)}</div>` : ''}</div><span class="small mono dim" style="white-space:nowrap;margin-left:8px">${rankOf(s.level)} · Lv ${s.level}</span></div>`;
  }).join('') : '<div class="dim small">No active skills.</div>';
  const titleLine = state.titles.length ? state.titles.map(t => `<span class="skill-title" style="margin:2px">${esc(t)}</span>`).join('') : '<span class="dim small">None yet</span>';

  const basics = state.dailyBasics[today()] || {};
  const basicsHtml = `
    <div class="basics">
      <label class="${basics.slept?'checked':''}"><input type="checkbox" data-basic="slept" ${basics.slept?'checked':''}><span>Sleep 7h</span></label>
      <label class="${basics.water?'checked':''}"><input type="checkbox" data-basic="water" ${basics.water?'checked':''}><span>2L water</span></label>
      <label class="${basics.meals?'checked':''}"><input type="checkbox" data-basic="meals" ${basics.meals?'checked':''}><span>3 meals</span></label>
    </div>`;

  const pauseBanner = state.paused ? `<div class="notice pause"><b>Paused.</b> Streak frozen — no penalty. Unpause in More when ready.</div>` : '';

  let commitTag = '';
  if (isLocked()){
    commitTag = `<div class="row" style="margin-bottom:12px;justify-content:center"><span class="commit-tag">🔒 Committed · ${commitRemainingDays()} days remaining</span></div>`;
  } else if (commitUnlockedGrace()){
    commitTag = `<div class="row" style="margin-bottom:12px;justify-content:center"><span class="commit-tag unlocked">🔓 Unlocked · re-lock within 24h to keep progress</span></div>`;
  }

  const telosHtml = state.telos
    ? `<div class="card"><div class="small dim" style="font-style:italic">"${esc(state.telos)}"</div></div>`
    : `<div class="card"><div class="row between"><div class="small dim" style="flex:1">What is this System for? One sentence.</div><button class="sm ghost" id="add-telos">Add</button></div></div>`;

  const completedWeeks = Math.floor((daysSinceDate(state.startedAt) || 0) / 7);
  const reviewCard = completedWeeks >= 1 ? `
    <div class="card row between" style="padding:12px 14px">
      <div>
        <div class="small dim">Weekly Reviews</div>
        <div class="small">${completedWeeks} week${completedWeeks === 1 ? '' : 's'} ready</div>
      </div>
      <button class="sm primary" id="open-reviews">View →</button>
    </div>
  ` : '';

  return `
    <div class="row between" style="margin-bottom:16px"><h1>The System</h1><button class="sm ghost" id="share-btn">Share ↗</button></div>
    ${pauseBanner}
    ${commitTag}
    <div class="card"><div class="row between"><div><div class="dim small mono">${esc(state.name || 'PLAYER')}</div><div class="big mono">Lv ${lvl}</div></div><div style="text-align:right"><div class="dim small mono">RANK</div><div class="big mono" style="color:var(--accent)">${rankOf(lvl)}</div></div></div>${powerBar()}</div>
    ${telosHtml}
    <div class="card"><div class="row between"><span class="dim small">STREAK</span><span class="mono" style="font-size:20px">${state.streak} <span class="dim small">days</span></span></div><div class="week-strip">${weekHtml}</div><div class="small dim" style="margin-top:14px;margin-bottom:6px">Last year</div><div class="heatmap-year">${yearHtml}</div></div>
    ${reviewCard}
    <div class="card"><div class="dim small" style="margin-bottom:2px">TODAY'S BASICS</div>${basicsHtml}</div>
    <h2>Stats</h2>
    <div class="card">${stats}<button class="ghost sm" data-nav="bench" style="width:100%;margin-top:12px">View benchmarks & test →</button></div>
    <h2>Titles</h2>
    <div class="card">${titleLine}</div>
    <h2>Active skills</h2>
    <div class="card">${skillList}</div>
  `;
}

function viewQuests(){
  const list = questsForToday();
  const day = new Date().getDay();
  const doneCount = list.filter(q => isQuestDone(q.id)).length;
  const deload = deloadWeekStatus();
  const deloadHtml = deload.isDeload ? `<div class="notice deload"><b>Deload week ${deload.weekNum}.</b> Halve your workouts. Keep the reading habit. This prevents burnout, not weakness.</div>` : '';
  const pauseHtml = state.paused ? `<div class="notice pause"><b>Paused.</b> Quests won't count toward streak until you unpause.</div>` : '';
  const nudges = state.skills.filter(s => s.active && s.type === 'workout' && s.subtype === 'fitness' && s.plan && s.plan.attemptDay !== day && (s.workoutsSinceAttempt||0) >= 4);
  const nudgeHtml = nudges.map(s => `<div class="notice warn"><b>${esc(s.name)}</b>: ${s.workoutsSinceAttempt} workouts since last attempt. Time to test your max.<button class="sm primary" data-nudge-attempt="${s.id}" style="width:100%;margin-top:8px">Test my max now</button></div>`).join('');
  const items = list.length ? list.map(q => {
    const done = isQuestDone(q.id);
    return `<div class="quest" data-quest="${q.id}"><div class="chk ${done?'done':''}">${done?'✓':''}</div><div style="flex:1;${done?'opacity:.5':''}"><div style="${done?'text-decoration:line-through':''}">${esc(q.text)}</div><div class="small dim mono">+${q.xp} XP${q.kind==='cardio'?' · trains VIT':''}${q.kind==='attempt'?' · test your max':''}</div>${q.milestone?`<div class="small dim" style="margin-top:2px">Milestone: ${esc(q.milestone)}</div>`:''}</div></div>`;
  }).join('') : '<div class="dim small" style="padding:12px 0">No quests today. Add a skill in the Skills tab.</div>';
  return `<h2>Today · ${dayName(day)} ${today().slice(5)}</h2>${pauseHtml}${deloadHtml}${nudgeHtml}<div class="card">${items}</div><div class="card row between"><span class="small dim">${doneCount} / ${list.length} done</span><span class="small dim mono">${state.streak} day streak</span></div>`;
}

function viewSkills(){
  const active = activeSkills();
  const parked = parkedSkills();
  const count = active.length;
  const atCap = count >= MAX_ACTIVE_SKILLS;
  const locked = isLocked();

  function renderCard(s, isParked){
    const need = skillXpForLevel(s.level);
    const pct = s.level >= 50 ? 100 : (s.xp / need) * 100;
    const idx = currentMilestoneIdx(s);
    const milestone = (idx >= 0 && s.ladder) ? s.ladder[idx] : null;
    const detail = s.type === 'workout' && s.plan ? `${s.plan.exercises.length} exercises · ${s.plan.workoutDays.length} days/week` : (s.milestoneQuests && idx >= 0 && s.milestoneQuests[idx]) ? `${s.milestoneQuests[idx].length} quest${s.milestoneQuests[idx].length===1?'':'s'}` : (s.quests ? `${s.quests.length} quest${s.quests.length===1?'':'s'}` : '');
    const ladderInfo = s.ladder && s.ladder.length ? `${(s.ladderDone||[]).length}/${s.ladder.length} milestones` : '';
    const title = titleForSkill(s);
    const calibrated = s.calibratedLevel && s.calibratedLevel > 1;
    const identity = s.identity ? `<div class="small dim" style="margin-top:4px;font-style:italic">"${esc(s.identity)}"</div>` : '';
    return `
      <div class="card ${isParked?'skill-card-parked':''}" data-skill-card="${s.id}" style="cursor:pointer">
        <div class="row between">
          <div class="row" style="gap:8px;flex:1;min-width:0">
            <h3 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.name)}</h3>
            ${isParked ? `<span class="parked-tag">parked</span>` : ''}
            ${title?`<span class="skill-title">${esc(title)}</span>`:''}
            <span class="tag ${s.active?'on rank-'+rankOf(s.level):''}">${rankOf(s.level)}</span>
          </div>
          <span class="mono small dim" style="white-space:nowrap">Lv ${s.level}</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="small dim" style="margin-top:8px">${esc(detail)}${ladderInfo?` · ${ladderInfo}`:''}</div>
        ${milestone?`<div class="small dim" style="margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">→ ${esc(milestone)}</div>`:''}
        ${identity}
        ${calibrated?`<div style="margin-top:6px"><span class="calibrated-tag">Calibrated Lv ${s.calibratedLevel}</span></div>`:''}
        <div class="row" style="gap:6px;margin-top:10px" onclick="event.stopPropagation()">
          <button class="sm ghost" data-park-toggle="${s.id}">${isParked?'Activate':'Park'}</button>
        </div>
      </div>`;
  }

  const activeHtml = active.length ? active.map(s => renderCard(s, false)).join('') : '<div class="card dim small">No active skills.</div>';
  const parkedHtml = parked.length ? parked.map(s => renderCard(s, true)).join('') : '';

  let addBtn = '';
  if (locked){
    addBtn = `<div class="small dim" style="text-align:center;padding:10px">🔒 Skills are locked during commitment. <button class="sm ghost" data-unlock-skills style="margin-left:6px">Unlock</button></div>`;
  } else if (atCap){
    addBtn = `<div class="small dim" style="text-align:center;padding:10px">At ${MAX_ACTIVE_SKILLS}/${MAX_ACTIVE_SKILLS} active. Park one to free a slot, or delete one.</div>`;
  } else {
    addBtn = `<button class="primary" id="add-skill" style="width:100%;margin-top:12px">+ Add skill</button>`;
  }

  const lockBanner = locked ? `<div class="lock-banner"><span style="font-size:16px">🔒</span><div style="flex:1;font-size:13px">Skills are locked during commitment. You can still log, tick quests, test stats, and park/activate skills. <button class="sm ghost" data-unlock-skills style="margin-left:6px">Unlock</button></div></div>` : '';

  return `
    ${lockBanner}
    <div class="row between" style="margin-bottom:12px">
      <h1 style="margin:0">Skills</h1>
      <span class="slot-counter ${atCap?'full':''}">${count}/${MAX_ACTIVE_SKILLS}</span>
    </div>
    <h2 style="margin-top:8px">Active</h2>
    ${activeHtml}
    ${addBtn}
    <h2 style="margin-top:24px">Parked ${parked.length ? `(${parked.length})` : ''}</h2>
    <p class="small dim" style="margin-top:-4px;margin-bottom:12px">Paused skills. All progress kept. Activate to resume daily quests — if you have a free slot.</p>
    ${parkedHtml || '<div class="small dim" style="padding:8px 0">None parked.</div>'}
  `;
}

function viewBench(){
  return `<h1>Benchmarks</h1><div class="card" style="margin-top:16px"><p class="small">Each stat is scored 1–100. To log a test, expand a stat and tap the highest tier you can honestly pass today.</p><p class="small dim" style="margin-top:8px"><b>Higher</b> than current → stat rises, level rises. <b>Same</b> → refreshes the test date, no change. <b>Lower</b> → demotes honestly, level drops. No XP for stat changes — the stat <i>is</i> the reward.</p></div>${['STR','AGI','VIT','INT','PER'].map(renderBenchCard).join('')}`;
}
function renderBenchCard(k){
  const b = BENCHMARKS[k];
  const cur = state.stats[k];
  const curTier = b.tiers.reduce((a,t) => t[0]<=cur&&t[0]>a ? t[0] : a, 0);
  const days = daysSinceDate(state.statDates[k]);
  const date = state.statDates[k] ? (days===0?'today':`${days}d ago`) : 'untested';
  const rows = b.tiers.map(([v, desc]) => {
    const isCur = v === curTier, isBelow = v < curTier;
    return `<div class="tier-row ${isCur?'current':''} ${isBelow?'below':''}" data-tier="${k}:${v}"><div class="tier-val">${v}</div><div class="tier-desc">${esc(desc)}</div></div>`;
  }).join('');
  return `<details><summary><span>${k} · ${b.label}</span><span class="small mono dim" style="font-weight:400;white-space:nowrap">${cur} · ${date}</span></summary><div class="tier-list"><div class="small dim" style="padding:10px 8px">${b.note}</div>${rows}</div></details>`;
}

function viewLog(){
  const skillOptions = state.skills.map(s => `<option value="${s.id}">${esc(s.name)}${s.active ? '' : ' (parked)'}</option>`).join('');
  const rows = state.log.length ? state.log.map(e => {
    const skill = e.skillId ? state.skills.find(s => s.id === e.skillId) : null;
    const first = e.firstTime ? `<span class="first-badge">first</span>` : '';
    const partial = e.finished === false ? `<span class="partial-badge">partial</span>` : '';
    const timeStr = e.time ? ` ${e.time}` : '';
    return `<div class="logrow"><span style="flex:1"><span class="dim mono">${e.date.slice(5)}${timeStr}</span>${skill?` <span class="dim" style="font-size:11px">${esc(skill.name)} · </span>`:''}${esc(e.note)}${first}${partial}</span><span class="xp">${e.xp>0?'+':''}${e.xp}</span></div>`;
  }).join('') : '<div class="dim small">Nothing logged yet.</div>';
  return `
    <h2>Log activity</h2>
    <div class="card">
      <p class="small dim" style="margin-bottom:14px">Log something you've done — today or earlier this week. Enter the date, time, what it was, and how long it took; the System awards XP based on time.</p>
      <div class="field"><label>Date</label><input type="date" id="log-date" value="${today()}" max="${today()}"></div>
      <div class="field"><label>Time</label><input type="time" id="log-time" value="${currentTime()}"></div>
      <div class="field"><label>Skill <span class="dim" style="text-transform:none;letter-spacing:0">(or General)</span></label>
        <select id="log-skill">
          <option value="">— General / other —</option>
          ${skillOptions}
        </select>
      </div>
      <div class="field"><label>What did you do?</label><input id="log-note" placeholder="e.g. Read a chapter of Sapiens" maxlength="120"></div>
      <div class="field"><label>Minutes</label><input type="number" id="log-mins" min="1" placeholder="e.g. 30"></div>
      <div class="small" id="log-preview" style="min-height:18px;margin-bottom:12px;color:var(--accent);font-family:ui-monospace,monospace"></div>
      <button class="primary" id="log-submit" style="width:100%">Log +XP</button>
      <div class="small dim" style="margin-top:12px;line-height:1.5">Award rule: <b>1 XP per 6 minutes, minimum 2 XP</b>. Selecting a skill also credits its XP. A date of today counts toward your streak. Past dates are logged to history but don't extend the streak.</div>
    </div>
    <h2>History <span class="dim small" style="text-transform:none;letter-spacing:0;margin-left:8px">Total earned: ${state.totalXP}</span></h2>

function viewMore(){
  const telosField = `<div class="field"><label>Telos <span class="dim" style="text-transform:none;letter-spacing:0">(optional)</span></label><textarea id="telos-input" rows="2" placeholder="What is this System for? One sentence.">${esc(state.telos)}</textarea><div class="hint">One sentence. "This System exists to get me from ___ to ___ by ___." If you can't write it, that's fine — leave it blank.</div></div>`;

    </div>`;

  let commitSection;
  if (isLocked()){
    commitSection = `<div class="card">

      <p class="small dim" style="margin-top:8px"><b>If you unlock now</b>, you get a 24-hour grace period to make changes. Re-lock within 24h to keep your progress. Don't re-lock and the commitment ends — the next commit starts fresh at 30 days.</p>
      <button class="sm primary" id="commit-unlock" style="margin-top:10px">Unlock (24h grace)</button>
    </div>`;
  } else if (commitUnlockedGrace()){
    const hoursLeft = commitGraceHoursRemaining();
    commitSection = `<div class="card">
      <div class="row between"><span class="small">30-day commitment</span><span class="tag gold">🔓 Unlocked · grace</span></div>
      <p class="small dim" style="margin-top:10px">You unlocked with <b>${hoursLeft} hour${hoursLeft === 1 ? '' : 's'}</b> left in your grace period. Skills are editable right now.</p>
      <p class="small dim" style="margin-top:8px">Re-lock before the grace period ends and the timer keeps running. Let it end and the commitment ends — the next commit starts fresh at 30 days.</p>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="sm primary" id="commit-relock" style="flex:1">Re-lock</button>
        <button class="sm ghost" id="commit-end" style="flex:1">End commitment</button>

  } else {
    commitSection = `<div class="card">
      <div class="row between"><span class="small">30-day commitment</span><span class="tag">Not set</span></div>
      <p class="small dim" style="margin-top:10px"><b>Commit for 30 days</b> to lock your skills. This is a self-imposed restriction designed to stop you from endlessly tweaking the System instead of using it.</p>
      <p class="small dim" style="margin-top:8px">While locked you can't add, edit, or delete skills. You <b>can</b> still log activities, tick quests, test stats, and park/activate skills. Unlock any time (24-hour grace to make changes before the timer resets).</p>
      <button class="sm primary" id="commit-start" style="margin-top:10px">Commit for 30 days</button>
    </div>`;
  }

  const rulesCard = `<div class="card small dim">
    <p><b>How your level is calculated.</b> Level = floor(√power × 2), where power = sum of all five stats + 3 × each skill's (level − 1). A skill at level 1 contributes nothing; a skill at level 20 contributes 57. Level 100 needs about 2,500 power.</p>
    <p><b>How skills level.</b> Each skill has its own XP counter. Ticking quests earns XP. Hitting milestones earns a lot more — the amount scales with how far up the ladder you are (milestone 1 pays 100 XP; milestone 20 pays ~1,500).</p>

  return `

    <h2>Pause</h2>${pauseField}

    <h2>Equipment</h2><div class="card">${renderEquipmentSection()}</div>
    <h2>AI settings</h2><div class="card"><div class="notice">Optional. Used only when you tap "Generate with AI". The key stays on this device.</div><div class="field"><label>API key</label><input id="ai-key" type="password" value="${esc(state.settings.apiKey)}" placeholder="sk-..."></div><div class="field"><label>Base URL</label><input id="ai-base" value="${esc(state.settings.apiBase)}"></div><div class="field"><label>Model</label><input id="ai-model" value="${esc(state.settings.apiModel)}"></div><button class="sm primary" id="ai-save">Save AI settings</button></div>

    <h2>How this all works</h2>${rulesCard}

function openWeeklyReviewList(){
  const weeks = Math.floor((daysSinceDate(state.startedAt) || 0) / 7);
  if (weeks < 1){
    openModal(`
      <h2>Weekly Reviews</h2>
      <p class="small dim">Your first review will be available after 7 full days of use. Keep logging — it'll appear automatically.</p>
      <button class="primary" style="width:100%;margin-top:16px" onclick="closeModal()">OK</button>
    `);
    return;
  }

  const rows = [];
  for (let n = weeks; n >= 1; n--){
    const dates = weekDates(n);
    const { totalXp, activities } = quickWeekStats(dates);
    rows.push(`
      <div class="logrow" data-review-week="${n}" style="cursor:pointer">
        <div style="flex:1">
          <div><b>Week ${n}</b> <span class="dim mono small">${dates.start.slice(5)} → ${dates.end.slice(5)}</span></div>
          <div class="small dim">${activities} activit${activities === 1 ? 'y' : 'ies'} · ${totalXp} XP</div>
        </div>
        <span class="dim" style="font-size:18px">›</span>
      </div>
    `);
  }

  openModal(`
    <h2>Weekly Reviews</h2>
    <p class="small dim">Every completed week, from your first day of use. Tap a week to see the full breakdown.</p>
    <div class="card" style="padding:4px 14px;margin-top:12px">
      ${rows.join('')}
    </div>
    <button class="ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Close</button>
  `);

  document.querySelectorAll('[data-review-week]').forEach(el => {
    el.onclick = () => openWeeklyReviewDetail(+el.dataset.reviewWeek);
  });
}

function openWeeklyReviewDetail(n){
  const review = computeWeekReview(n);

  const dayRows = review.days.map(d => `
    <div class="logrow">
      <span><span class="dim mono">${d.dayShort}</span> ${d.date.slice(5)}</span>
      <span class="small">${d.activityCount > 0 ? `${d.activityCount} activit${d.activityCount === 1 ? 'y' : 'ies'} · +${d.xp} XP` : '<span class="dim">no activity</span>'}</span>
    </div>
  `).join('');

  const skillRows = Object.entries(review.skillActivity).map(([id, data]) => {
    const s = state.skills.find(x => x.id === id);
    return `<div class="logrow"><span>${esc(s ? s.name : 'Unknown')}</span><span class="small dim">${data.count} session${data.count === 1 ? '' : 's'} · +${data.xp} XP</span></div>`;
  }).join('');

  const silentRow = review.silentSkills.length
    ? `<div class="small dim" style="margin-top:8px;font-style:italic">No activity this week: ${review.silentSkills.map(s => esc(s.name)).join(', ')}</div>`
    : '';

  const notableRows = review.notable.length
    ? review.notable.map(txt => `<div class="logrow"><span>${esc(txt)}</span></div>`).join('')
    : '<div class="small dim">Nothing major — a steady week.</div>';

  const suggestionsHtml = review.suggestions.map(s => `<div class="logrow"><span>${esc(s)}</span></div>`).join('');

  openModal(`
    <div class="row between" style="margin-bottom:16px">
      <div>
        <h2 style="margin:0">Week ${n}</h2>
        <div class="small dim">${review.start} → ${review.end}</div>
      </div>
      <div class="row" style="gap:6px">
        <button class="sm ghost" id="back-list">All weeks</button>
        <button class="sm ghost" onclick="closeModal()">×</button>
      </div>
    </div>

    <h2 style="margin-top:8px">At a glance</h2>
    <div class="card" style="padding:4px 14px">
      <div class="logrow"><span class="small dim">Activities</span><span class="mono">${review.activities}</span></div>
      <div class="logrow"><span class="small dim">XP earned</span><span class="mono">${review.totalXp}</span></div>
      <div class="logrow"><span class="small dim">Full quests</span><span class="mono">${review.fullQuests}</span></div>
      <div class="logrow"><span class="small dim">Partial quests</span><span class="mono">${review.partialQuests}</span></div>
      <div class="logrow"><span class="small dim">Days active</span><span class="mono">${review.activeDays} / 7</span></div>
      <div class="logrow"><span class="small dim">Streak at end of week</span><span class="mono">${review.streakAtEnd} day${review.streakAtEnd === 1 ? '' : 's'}</span></div>
    </div>

    <h2>Day by day</h2>
    <div class="card" style="padding:4px 14px">${dayRows}</div>

    ${Object.keys(review.skillActivity).length > 0 ? `
      <h2>Skill activity</h2>
      <div class="card" style="padding:4px 14px">${skillRows}${silentRow}</div>
    ` : ''}

    <h2>Notable</h2>
    <div class="card" style="padding:4px 14px">${notableRows}</div>

    <h2>Suggestions for next week</h2>
    <div class="card" style="padding:4px 14px">${suggestionsHtml}</div>

    <div class="row" style="gap:8px;margin-top:16px">
      <button class="ghost" id="back-list-2" style="flex:1">All weeks</button>
      <button class="ghost" style="flex:1" onclick="closeModal()">Close</button>

  document.getElementById('back-list').onclick = openWeeklyReviewList;

}
