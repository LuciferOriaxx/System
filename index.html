<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="System">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>The System</title>
<style>
:root{--bg:#0a0e14;--panel:#111823;--line:#1d2836;--txt:#c8d4e4;--dim:#6b7c93;
  --accent:#4da6ff;--gold:#ffc857;--danger:#ff5c5c;--ok:#3ddc97;--violet:#a06eff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:76px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:13px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
h2{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin:24px 0 10px}
h3{font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.bar{height:6px;background:#0a0e14;border-radius:3px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
button{font:inherit;color:var(--txt);background:#16202e;border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;cursor:pointer;min-height:42px}
button:active{background:#1d2836}
button.primary{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.sm{padding:6px 10px;min-height:34px;font-size:13px}
button.tiny{padding:3px 8px;min-height:26px;font-size:11px;letter-spacing:.05em}
input,select,textarea{font:inherit;color:var(--txt);background:#0a0e14;border:1px solid var(--line);
  border-radius:8px;padding:10px;width:100%;min-height:42px;font-family:inherit}
textarea{resize:vertical;min-height:60px}
input[type=checkbox]{width:auto;min-height:auto}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.dim{color:var(--dim)}
.small{font-size:12px}
p{margin:0 0 10px 0}
p:last-child{margin-bottom:0}
.tag{font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:4px;background:#1d2836;color:var(--dim)}
.tag.on{background:rgba(77,166,255,.15);color:var(--accent)}
.tag.gold{background:rgba(255,200,87,.15);color:var(--gold)}
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:none}
.chk{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;cursor:pointer}
.chk.done{background:var(--accent);border-color:var(--accent);color:#06121f}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
nav{position:fixed;bottom:0;left:0;right:0;background:#0d131c;border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
nav button{flex:1;background:none;border:none;border-radius:0;padding:14px 2px;min-height:60px;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
nav button.active{color:var(--accent)}
.logrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center;gap:8px}
.logrow:last-child{border-bottom:none}
.xp{color:var(--accent);font-family:ui-monospace,monospace;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.1em}
.field .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--panel);border-radius:16px 16px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal h2{margin-top:0;margin-bottom:16px}
.skill-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.skill-row:last-child{border-bottom:none}
.exercise-row{display:grid;grid-template-columns:1fr 60px 70px 30px;gap:8px;
  align-items:center;margin-bottom:8px}
.exercise-row input{min-height:38px;padding:6px 8px;font-size:14px}
.notice{background:rgba(77,166,255,.08);border:1px solid rgba(77,166,255,.25);
  border-radius:8px;padding:12px;font-size:13px;margin-bottom:16px}
.notice.ok{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.25)}
.notice.warn{background:rgba(255,200,87,.08);border-color:rgba(255,200,87,.25)}
.notice.gold{background:rgba(255,200,87,.08);border-color:rgba(255,200,87,.35)}
.notice.lock{background:rgba(255,200,87,.06);border-color:rgba(255,200,87,.3)}
.notice.deload{background:rgba(160,110,255,.08);border-color:rgba(160,110,255,.3)}
.notice.pause{background:rgba(255,200,87,.08);border-color:rgba(255,200,87,.3)}
.hide{display:none}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  margin-bottom:12px;overflow:hidden}
details>summary{list-style:none;cursor:pointer;padding:14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';color:var(--dim);font-size:18px;font-weight:400}
details[open]>summary::after{content:'−'}
details>summary:active{background:#16202e}
.tier-list{padding:0 6px 8px;border-top:1px solid var(--line)}
.tier-row{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;
  border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.tier-row:last-child{border-bottom:none}
.tier-row:active{background:#1d2836}
.tier-row.current{background:rgba(77,166,255,.08)}
.tier-row.below{opacity:.55}
.tier-val{width:26px;text-align:right;font-family:ui-monospace,monospace;
  font-weight:600;font-size:14px;color:var(--dim);flex:0 0 auto;padding-top:1px}
.tier-row.current .tier-val{color:var(--accent);font-weight:700}
.tier-desc{flex:1;font-size:13px;line-height:1.5}
.prog-section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.day-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day-picker button{min-height:38px;padding:6px 4px;font-size:13px}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.week-cell{text-align:center}
.week-day{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.week-box{height:36px;border-radius:6px;background:#0a0e14;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-size:13px;color:var(--dim)}
.week-box.filled{background:rgba(77,166,255,.15);border-color:rgba(77,166,255,.5);color:var(--accent);font-weight:600}
.heatmap-year{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:10px}
.heat-cell{aspect-ratio:1;border-radius:2px;background:#0a0e14;border:1px solid var(--line)}
.heat-cell.lvl-1{background:rgba(77,166,255,.2);border-color:rgba(77,166,255,.35)}
.heat-cell.lvl-2{background:rgba(77,166,255,.4);border-color:rgba(77,166,255,.55)}
.heat-cell.lvl-3{background:rgba(77,166,255,.65);border-color:rgba(77,166,255,.8)}
.heat-cell.lvl-4{background:var(--accent);border-color:var(--accent)}
.stat-label-stale{color:var(--gold)}
.milestone-focus{background:rgba(77,166,255,.06);border-left:3px solid var(--accent);
  padding:8px 12px;border-radius:4px;font-size:13px;margin:10px 0}
.skill-title{display:inline-block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(255,200,87,.1)}
.calibrated-tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:1px 5px;border-radius:3px;background:#1d2836;border:1px solid var(--line)}
.parked-tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:2px 6px;border-radius:3px;background:#0a0e14;border:1px solid var(--line)}
.first-badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);padding:1px 5px;border-radius:3px;background:rgba(255,200,87,.15);margin-left:6px}
.partial-badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);padding:1px 5px;border-radius:3px;background:#1d2836;margin-left:6px}
.skill-card-parked{opacity:.7}
.slot-counter{display:inline-block;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.1em;
  color:var(--dim);padding:2px 8px;border-radius:4px;background:#0a0e14;border:1px solid var(--line)}
.slot-counter.full{color:var(--gold);border-color:rgba(255,200,87,.4)}
.commit-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);padding:3px 9px;border-radius:4px;
  background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.3);font-weight:600}
.commit-tag.unlocked{color:var(--ok);background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.3)}
.lock-banner{background:rgba(255,200,87,.06);border:1px solid rgba(255,200,87,.3);
  border-radius:10px;padding:12px;font-size:13px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px}
.levelup-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:190;
  padding:10px 18px;border-radius:10px;background:#111823;border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:13px;animation:fadeIn .3s ease;max-width:92vw;text-align:center}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.equip-weight{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin-top:6px;padding-left:26px}
.equip-weight input{min-height:36px;padding:6px 8px;font-size:13px}
.basics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.basics label{display:flex;align-items:center;gap:6px;padding:8px;background:#0a0e14;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12px}
.basics label.checked{background:rgba(61,220,151,.08);border-color:rgba(61,220,151,.35)}
.basics input{width:auto;min-height:auto}
.levelup-overlay{position:fixed;inset:0;background:rgba(10,14,20,.92);z-index:200;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;cursor:pointer}
.levelup-overlay.show{opacity:1}
.levelup-card{background:linear-gradient(135deg,#4da6ff 0%,#8a63f2 100%);
  border-radius:20px;padding:40px 60px;text-align:center;
  transform:scale(.85);transition:transform .4s cubic-bezier(.2,.8,.2,1.3);
  box-shadow:0 20px 80px rgba(77,166,255,.4)}
.levelup-overlay.show .levelup-card{transform:scale(1)}
.levelup-card .label{font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.85);text-transform:uppercase}
.levelup-card .big{font-size:72px;font-weight:800;color:#fff;line-height:1;margin:12px 0;font-family:ui-monospace,monospace}
.levelup-card .rank{font-size:16px;color:rgba(255,255,255,.9);font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.levelup-card.rankup-card{background:linear-gradient(135deg,#ffc857 0%,#ff8f3f 100%);padding:50px 70px}
.levelup-overlay.show.rankup .levelup-card{animation:rankGlow 2s ease-in-out infinite}
.levelup-card.rankup-card .label{color:rgba(0,0,0,.65);font-weight:700;letter-spacing:.35em;font-size:13px}
.levelup-card.rankup-card .big.rank-big{font-size:170px;color:#fff;line-height:.85;text-shadow:0 6px 30px rgba(0,0,0,.3);margin:20px 0}
.levelup-card.rankup-card .rank{color:rgba(0,0,0,.7);font-weight:700;font-size:15px;letter-spacing:.2em}
@keyframes rankGlow{
  0%,100%{box-shadow:0 20px 100px rgba(255,200,87,.55), 0 0 200px rgba(255,140,63,.3)}
  50%{box-shadow:0 20px 130px rgba(255,200,87,.85), 0 0 260px rgba(255,140,63,.55)}
}
.tag.on.rank-E{background:#1d2836;color:var(--dim)}
.tag.on.rank-D{background:rgba(61,220,151,.15);color:var(--ok)}
.tag.on.rank-C{background:rgba(77,166,255,.2);color:var(--accent)}
.tag.on.rank-B{background:rgba(160,110,255,.2);color:var(--violet)}
.tag.on.rank-A{background:rgba(255,200,87,.2);color:var(--gold);font-weight:600}
.tag.on.rank-S{background:linear-gradient(135deg,rgba(255,92,92,.3),rgba(255,200,87,.3));color:#ff8f3f;
  font-weight:700;text-shadow:0 0 8px rgba(255,200,87,.5);
  box-shadow:0 0 10px rgba(255,200,87,.5);animation:sGlow 2.5s ease-in-out infinite}
@keyframes sGlow{0%,100%{box-shadow:0 0 8px rgba(255,200,87,.4)}50%{box-shadow:0 0 16px rgba(255,200,87,.8)}}
</style>
</head>
<body>

<main id="app" class="wrap"></main>
<div id="modal"></div>

<nav id="nav" class="hide">
  <button data-tab="status" class="active">Status</button>
  <button data-tab="quests">Quests</button>
  <button data-tab="skills">Skills</button>
  <button data-tab="bench">Stats</button>
  <button data-tab="log">Log</button>
  <button data-tab="more">More</button>
</nav>

<script>
/* ═══════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════ */
const MAX_ACTIVE_SKILLS = 5;
const COMMIT_DAYS = 30;
const STREAK_TITLES = [
  { days: 7,   title: 'Initiate' },
  { days: 30,  title: 'Dedicated' },
  { days: 90,  title: 'Habit Maker' },
  { days: 180, title: 'Disciplined' },
  { days: 365, title: 'Year One' }
];
const skillXpForLevel = L => 10 * L;
const RANK_TABLE = [[50,'S'],[40,'A'],[30,'B'],[20,'C'],[10,'D'],[1,'E']];
const rankOf = lvl => RANK_TABLE.find(([m]) => lvl >= m)[1];

function addSkillXP(skill, amount){
  skill.xp += amount;
  let leveled = 0;
  while (skill.level < 50 && skill.xp >= skillXpForLevel(skill.level)){
    skill.xp -= skillXpForLevel(skill.level); skill.level++; leveled++;
  }
  if (skill.level >= 50) skill.xp = 0;
  return leveled;
}
function subtractSkillXP(skill, amount){
  skill.xp -= amount;
  while (skill.xp < 0 && skill.level > 1){
    skill.level--;
    skill.xp += skillXpForLevel(skill.level);
  }
  if (skill.xp < 0) skill.xp = 0;
}
function activeSkills(){ return (state.skills || []).filter(s => s.active); }
function parkedSkills(){ return (state.skills || []).filter(s => !s.active); }
function activeSkillCount(){ return activeSkills().length; }

/* ═══════════════════════════════════════════
   PLAYER LEVEL
   ═══════════════════════════════════════════ */
function computePowerFrom(stats, skills){
  const statSum = Object.values(stats || {}).reduce((a,b) => a + (b||0), 0);
  const skillSum = (skills || []).reduce((a,s) => a + Math.max(0, (s.level||1) - 1), 0);
  return statSum + skillSum * 3;
}
function computeLevelFrom(stats, skills){
  const power = computePowerFrom(stats, skills);
  if (power <= 0) return 1;
  return Math.min(100, Math.max(1, Math.floor(Math.sqrt(power) * 2)));
}
function computeTotalPower(){ return computePowerFrom(state.stats, state.skills); }
function computePlayerLevel(){ return computeLevelFrom(state.stats, state.skills); }
function powerForLevel(n){
  if (n <= 1) return 0;
  return Math.ceil(Math.pow(n / 2, 2));
}

/* ═══════════════════════════════════════════
   CALIBRATION
   ═══════════════════════════════════════════ */
function calibrateFromPreTicks(preTickedCount, totalMilestones){
  if (totalMilestones <= 0) return 1;
  return Math.max(1, Math.min(50, Math.round((preTickedCount / totalMilestones) * 49) + 1));
}
function calibrateFromSTR(str){
  return Math.max(1, Math.min(50, Math.round((str - 5) / 2) + 1));
}
function applyCalibrationToSkill(skill){
  if (!skill) return;
  let calLevel = null;
  if (skill.ladderPreticked && skill.ladderPreticked.length > 0 && skill.ladder && skill.ladder.length > 0){
    calLevel = calibrateFromPreTicks(skill.ladderPreticked.length, skill.ladder.length);
  } else if (skill.type === 'workout' && skill.subtype === 'fitness'){
    const str = (state.stats && state.stats.STR) || 5;
    calLevel = calibrateFromSTR(str);
  }
  if (calLevel && calLevel > 1){
    skill.calibratedLevel = calLevel;
    if (calLevel > (skill.level || 1)){
      skill.level = calLevel;
      skill.xp = 0;
    }
  }
}

/* ═══════════════════════════════════════════
   SKILL TITLES
   ═══════════════════════════════════════════ */
const SKILL_TITLES = {
  language:       { D:'Tongue-Kin',         C:'Wordspeaker',      B:'Linguist',       A:'Master of Tongues', S:'Living Lexicon' },
  coding:         { D:'Tinkerer',           C:'Coder',            B:'Engineer',       A:'Architect',         S:'Systems Sage' },
  business:       { D:'Venturer',           C:'Founder',          B:'Operator',       A:'Magnate',           S:'Sovereign' },
  reading:        { D:'Bibliophile',        C:'Scholar',          B:'Sage',           A:'Loremaster',        S:'Oracle' },
  writing:        { D:'Scribe',             C:'Wordsmith',        B:'Author',         A:'Lorekeeper',        S:'Laureate' },
  engineering:    { D:'Gearhand',           C:'Tinkerer',         B:'Engineer',       A:'Master Builder',    S:'Artificer' },
  instrument:     { D:'Apprentice',         C:'Performer',        B:'Musician',       A:'Virtuoso',          S:'Maestro' },
  art:            { D:'Sketcher',           C:'Illustrator',      B:'Artist',         A:'Master Painter',    S:'Old Master' },
  mind:           { D:'Wanderer',           C:'Monk',             B:'Zen Adept',      A:'Sage',              S:'Enlightened' },
  publicspeaking: { D:'Novice Speaker',     C:'Speaker',          B:'Orator',         A:'Silver-Tongue',     S:'Golden-Tongue' },
  cooking:        { D:'Line Cook',          C:'Chef',             B:'Master Chef',    A:'Culinary Master',   S:'Legend of the Table' },
  custom:         { D:'Adept',              C:'Skilled',          B:'Proficient',     A:'Expert',            S:'Master' }
};
const FITNESS_TITLES = {
  'Running':       { D:'Jogger',            C:'Runner',           B:'Distance Runner', A:'Marathoner',       S:'Windwalker' },
  'Yoga':          { D:'Yogi Initiate',     C:'Yogi',             B:'Yoga Adept',      A:'Yoga Master',      S:'Body Sage' },
  'Pilates':       { D:'Pilates Beginner',  C:'Pilates Student',  B:'Pilates Adept',   A:'Core Master',      S:'Pilates Sage' },
  'Weightlifting': { D:'Lifter',            C:'Strongman',        B:'Powerlifter',     A:'Iron Master',      S:'Titan' },
  'Calisthenics':  { D:'Calisthene',        C:'Barathlete',       B:'Bodyweight Master', A:'Iron Body',      S:'Living Statue' },
  'Mixed fitness': { D:'Trainee',           C:'Athlete',          B:'Fighter',         A:'Champion',         S:'Legend' },
  default:         { D:'Trainee',           C:'Athlete',          B:'Fighter',         A:'Champion',         S:'Legend' }
};
function titleForSkill(skill){
  if (!skill) return null;
  const rank = rankOf(skill.level);
  if (rank === 'E') return null;
  if (skill.subtype === 'fitness'){
    const set = FITNESS_TITLES[skill.detail] || FITNESS_TITLES.default;
    return set[rank] || null;
  }
  const titles = SKILL_TITLES[skill.subtype] || SKILL_TITLES.custom;
  return titles[rank] || null;
}

/* ═══════════════════════════════════════════
   BENCHMARKS
   ═══════════════════════════════════════════ */
const BENCHMARKS = {
  STR: {
    label: 'Strength',
    note: 'Tests of raw bodyweight strength. A chair, table, wall or floor is all you need — no gym. For each test, stop when your form breaks. That number is your tier.',
    tiers: [
      [5,'5 pushups · 15 squats · 20s plank'],
      [10,'15 pushups · 25 squats · 45s plank · 5 chair dips'],

function strToMaxes(tier){
  const map = {
    5:   { pushups: 5,  pullups: 0, dips: 0, squats: 15, plank: 20 },
    10:  { pushups: 15, pullups: 0, dips: 5, squats: 25, plank: 45 },
    20:  { pushups: 25, pullups: 0, dips: 10, squats: 40, plank: 60 },
    30:  { pushups: 35, pullups: 0, dips: 15, squats: 50, plank: 90 },
    40:  { pushups: 45, pullups: 4, dips: 20, squats: 60, plank: 120 },
    50:  { pushups: 50, pullups: 6, dips: 25, squats: 80, plank: 180 },
    60:  { pushups: 60, pullups: 8, dips: 30, squats: 100, plank: 240 }
  };
  return map[tier] || map[5];
}
const EQUIPMENT_NEEDED_SUBTYPES = ['Calisthenics','Weightlifting','Mixed fitness'];
function fitnessNeedsEquipment(detail){ return EQUIPMENT_NEEDED_SUBTYPES.includes(detail); }
function getWeightedExercise(weights){
  if (!weights) return null;
  if (weights.barbell && weights.barbell >= 10){
    const reps = Math.max(4, Math.min(15, Math.round(300 / weights.barbell)));
    return { name: `Barbell RDL (${weights.barbell}kg)`, sets: 3, reps, unit: 'reps' };
  }
  if (weights.dumbbell && weights.dumbbell >= 4){
    const reps = Math.max(5, Math.min(20, Math.round(300 / weights.dumbbell)));
    return { name: `Dumbbell rows (${weights.dumbbell}kg)`, sets: 3, reps, unit: 'reps' };
  }
  if (weights.kettlebell && weights.kettlebell >= 4){
    const reps = Math.max(5, Math.min(20, Math.round(300 / weights.kettlebell)));
    return { name: `Kettlebell swings (${weights.kettlebell}kg)`, sets: 3, reps, unit: 'reps' };
  }
  return null;
}
function deriveExercisesFromStats(){
  const str = state.stats.STR || 5;
  const budget = state.timeBudget || 30;
  const hasBar = (state.equipment || []).includes('pullup_bar');
  const hasDipBars = (state.equipment || []).includes('dip_bars');
  const weights = state.equipmentWeights || {};
  const maxes = strToMaxes(str);
  const reps = max => Math.max(2, Math.round(max * 0.6));
  let sets, maxExercises;
  if (budget <= 15){ sets = 2; maxExercises = 3; }
  else if (budget <= 30){ sets = 3; maxExercises = 4; }
  else if (budget <= 45){ sets = 3; maxExercises = 5; }
  else { sets = 4; maxExercises = 6; }
  const all = [];
  all.push({ name: 'Pushups', sets, reps: reps(maxes.pushups), unit: 'reps' });
  all.push({ name: 'Squats',  sets, reps: reps(maxes.squats),  unit: 'reps' });
  all.push({ name: 'Plank',   sets, reps: Math.round(maxes.plank * 0.7), unit: 'sec' });
  if (maxes.dips > 0)
    all.push({ name: hasDipBars ? 'Dips' : 'Chair dips', sets, reps: reps(maxes.dips), unit: 'reps' });
  if (hasBar && maxes.pullups > 0)
    all.push({ name: 'Pullups', sets, reps: Math.max(2, Math.round(maxes.pullups * 0.6)), unit: 'reps' });
  if (str >= 20)
    all.push({ name: 'Wall handstand', sets, reps: str >= 40 ? 45 : 20, unit: 'sec' });
  const weighted = getWeightedExercise(weights);
  if (weighted) all.push(weighted);
  return all.slice(0, maxExercises + (weighted ? 1 : 0));
}

  if (!dateStr) return null;

  return Math.floor((Date.now() - d.getTime()) / (1000*60*60*24));
}

    return [
      { text: `${name}: 1 customer or client conversation`, xp: 5 },
      { text: `${name}: 30 min on the live business`, xp: 5 }
    ];
  }

  if (sub === 'reading'){
    return [
      { text: `${name}: Read 30 min, phone away`, xp: 5 },
      { text: `${name}: 3 sentences of notes on what you read`, xp: 2 }
    ];
  }

  if (sub === 'writing'){
    if (/premise|outline/.test(ms)){
      return [
        { text: `${name}: Write a 1-page premise`, xp: 3 },
        { text: `${name}: Sketch 3 scenes for the outline`, xp: 3 }
      ];
    }
    if (/1,000 words|first chapter/.test(ms)){
      return [{ text: `${name}: Write 500 words`, xp: 5 }];
    }
    if (/10k|15k|30k|40k|draft/.test(ms)){
      return [{ text: `${name}: Write 500–800 words on your draft`, xp: 5 }];
    }
    if (/editing|revision|beta|query|published|review|copies/.test(ms)){
      return [{ text: `${name}: 30 min editing or marketing`, xp: 5 }];
    }
    return [{ text: `${name}: Write 300 words`, xp: 5 }];
  }

  if (sub === 'engineering'){
    const original = milestoneText || '';
    if (/computing/i.test(original)){
      return [
        { text: `${name}: 30 min coding — solve a problem with code`, xp: 5 },
        { text: `${name}: Study one relevant library or function`, xp: 3 }
      ];
    }
    if (/CAD/i.test(original)){
      return [
        { text: `${name}: 30 min in CAD software`, xp: 5 },
        { text: `${name}: Model one small element or feature`, xp: 4 }
      ];
    }
    if (/portfolio|professional standard/i.test(original)){
      return [
        { text: `${name}: 30 min on your portfolio project`, xp: 5 },
        { text: `${name}: Write up one section or drawing`, xp: 4 }
      ];
    }
    if (/teach|tutor/i.test(original)){
      return [
        { text: `${name}: Explain one topic to someone (or write it out)`, xp: 4 },
        { text: `${name}: Prepare a teaching note or example`, xp: 3 }
      ];
    }
    if (/design a|design one/i.test(original)){
      return [
        { text: `${name}: 30 min on the design`, xp: 5 },
        { text: `${name}: Sketch or draw one part of it`, xp: 3 }
      ];
    }
    const topic = original.split('—')[0].split(' - ')[0].split('.')[0].trim();
    return [
      { text: `${name}: 30 min study — ${topic}`, xp: 5 },
      { text: `${name}: Solve 3 practice problems on ${topic}`, xp: 4 }
    ];
  }

  if (sub === 'art'){
    return [
      { text: `${name}: 20 min drawing or painting practice`, xp: 4 },
      { text: `${name}: Study one reference or technique`, xp: 2 }
    ];
  }

  if (sub === 'instrument'){
    if (/chord|scale|first/.test(ms)) return [{ text: `${name}: 15 min chord/scale practice`, xp: 3 }];
    if (/song|play|performance/.test(ms)) return [{ text: `${name}: 15 min practicing a song`, xp: 3 }];
    return [{ text: `${name}: 15 min practice`, xp: 3 }];
  }

  if (sub === 'mind'){
    return [{ text: `${name}: 5–10 min practice`, xp: 2 }];
  }

  if (sub === 'publicspeaking'){
    return [
      { text: `${name}: Record a 2-min speech on any topic`, xp: 3 },
      { text: `${name}: Review yesterday's recording`, xp: 2 }
    ];
  }

  if (sub === 'cooking'){
    return [
      { text: `${name}: Cook one dish from scratch`, xp: 4 },
      { text: `${name}: Practice one technique (knife skills, sauce, etc)`, xp: 3 }
    ];
  }

  return [{ text: `${name}: ${milestoneText}`, xp: 5 }];
}

function ensureMilestoneQuests(skill){
  if (skill.type !== 'standard') return;
  if (!skill.milestoneQuests) skill.milestoneQuests = {};
  const idx = currentMilestoneIdx(skill);
  if (idx < 0) return;
  if (!skill.milestoneQuests[idx]){
    const milestoneText = skill.ladder[idx];
    const generated = generateMilestoneQuests(skill, milestoneText);
    skill.milestoneQuests[idx] = generated.map(q => ({ id: newId(), text: q.text, xp: q.xp }));
  }
}

/* ═══════════════════════════════════════════
   DELOAD
   ═══════════════════════════════════════════ */
function deloadWeekStatus(){
  if (!state.deloadEnabled || !state.startedAt) return { isDeload: false, weekNum: 0 };
  const days = daysSinceDate(state.startedAt);
  if (days === null) return { isDeload: false, weekNum: 0 };
  const weekNum = Math.floor(days / 7) + 1;
  return { isDeload: weekNum > 0 && weekNum % 10 === 0, weekNum };
}

/* ═══════════════════════════════════════════
   WEEKLY REVIEW COMPUTATION
   ═══════════════════════════════════════════ */
function weekDates(n){
  const start = new Date(state.startedAt + 'T00:00:00');
  start.setDate(start.getDate() + (n-1)*7);
  const days = [];
  for (let i = 0; i < 7; i++){
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    days.push({ date, dayShort: dayShort(d.getDay()) });
  }
  return { start: days[0].date, end: days[6].date, days };
}

function computeStreakAt(date){
  let streak = 0;
  let d = date;
  while (true){
    const q = state.quests[d] || {};
    const logForDate = state.log.filter(e => e.date === d && e.xp > 0);
    if (Object.keys(q).length > 0 || logForDate.length > 0){
      streak++;
      const dt = new Date(d + 'T00:00:00');
      dt.setDate(dt.getDate() - 1);
      d = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
    } else break;
  }
  return streak;
}

function quickWeekStats(dates){
  let totalXp = 0, activities = 0;
  dates.days.forEach(d => {
    const log = state.log.filter(e => e.date === d.date && e.xp > 0);
    totalXp += log.reduce((s, e) => s + e.xp, 0);
    activities += log.length;
  });
  return { totalXp, activities };
}

function computeWeekReview(n){
  const dates = weekDates(n);
  let totalXp = 0, activities = 0, fullQuests = 0, partialQuests = 0, activeDays = 0;
  const skillActivity = {};
  const notable = [];

  dates.days.forEach(d => {
    const log = state.log.filter(e => e.date === d.date && e.xp > 0);
    d.activityCount = log.length;
    d.xp = log.reduce((s, e) => s + e.xp, 0);
    totalXp += d.xp;
    activities += log.length;
    if (log.length > 0) activeDays++;

    log.forEach(e => {
      if (e.finished === false) partialQuests++;
      else if (e.finished === true) fullQuests++;

      if (e.skillId){
        if (!skillActivity[e.skillId]) skillActivity[e.skillId] = { count: 0, xp: 0 };
        skillActivity[e.skillId].count++;
        skillActivity[e.skillId].xp += e.xp;
      }

      const isNotable = e.firstTime
        || /Rank [SABCDE]/.test(e.note || '')
        || /reached Lv/.test(e.note || '')
        || /streak \(day/.test(e.note || '')
        || /attempt day/.test(e.note || '');

      if (isNotable && e.note){
        let label = e.note;
        if (e.firstTime) label = 'First: ' + label;
        notable.push(label);
      }
    });
  });

  const silentSkills = state.skills.filter(s => s.active && !skillActivity[s.id]);
  const streakAtEnd = computeStreakAt(dates.end);
  const suggestions = generateWeekSuggestions({ skillActivity, silentSkills, partialQuests, fullQuests, dates, streakAtEnd, activeDays });

  return {
    start: dates.start,
    end: dates.end,
    days: dates.days,
    totalXp, activities, fullQuests, partialQuests, activeDays,
    skillActivity, silentSkills, streakAtEnd, notable, suggestions
  };
}

function generateWeekSuggestions({ skillActivity, silentSkills, partialQuests, fullQuests, dates, streakAtEnd, activeDays }){
  const suggestions = [];

  silentSkills.forEach(s => {
    suggestions.push(`"${s.name}" got no activity this week. Either park it — progress kept, quests stop showing — or block 15 minutes a day for it next week.`);
  });

  const totalQuests = partialQuests + fullQuests;
  if (partialQuests > 0 && totalQuests > 0 && partialQuests / totalQuests > 0.2){
    suggestions.push(`${partialQuests} of ${totalQuests} quests were logged partial. Consider lowering the difficulty in the skill editor — a quest you can't finish stops being a quest.`);
  }

  const zeroDays = 7 - activeDays;
  if (zeroDays >= 2){
    suggestions.push(`${zeroDays} days with no activity. The 2-minute floor exists for exactly this — one pushup, one sentence, one line of code keeps the streak alive.`);
  }

  if (streakAtEnd === 0 && activeDays > 0){
    suggestions.push(`Your streak broke this week. It resets — that's the only penalty. One logged action starts a new one.`);
  }

  const staleStats = ['STR','AGI','VIT','INT','PER'].filter(k => {
    const d = daysSinceDate(state.statDates[k]);
    return d === null || d > 30;
  });
  if (staleStats.length > 0){
    suggestions.push(`No recent test on ${staleStats.join(', ')}. Pick one this week — a stat with no date is a claim, not a fact.`);
  }

  state.skills.filter(s => s.active && s.type === 'workout' && s.subtype === 'fitness').forEach(s => {
    if ((s.workoutsSinceAttempt || 0) >= 6){
      suggestions.push(`${s.workoutsSinceAttempt} workouts on "${s.name}" without an attempt day. Attempt day is how the plan actually gets harder — try it this week.`);
    }
  });

  if (!state.telos){
    suggestions.push(`You haven't written the one-sentence purpose (More → Telos). Without it, the System is motion without direction.`);
  }

  if (activeDays === 7 && totalQuests >= 15){
    suggestions.push(`All 7 days active, and you cleared a lot. That's the point where you should raise the bar — more reps, a harder tier, or a new skill.`);
  }

  if (suggestions.length === 0){
    suggestions.push(`Nothing to flag. Steady week. Next week: pick one thing to push — more reps, a harder tier, or one new skill.`);
  }

  return suggestions;
}

const KEY = 'the-system-v2';
const DEFAULT_STATS = { STR: 5, AGI: 5, VIT: 5, INT: 5, PER: 1 };
let logDate = today();
let levelChangeReason = '';

function defaultState(){

    stats: { ...DEFAULT_STATS }, statDates: {},
    skills: [], streak: 0, lastComplete: null,

    committedUntil: '',

function migrateSkill(s){
  if (!s.subtype){
    const n = (s.name || '').toLowerCase();
    if (n.includes('calisthen') || n.includes('fitness') || n.includes('strength') || n.includes('weight')) s.subtype = 'fitness';
    else if (n.includes('spanish') || n.includes('french') || n.includes('german') || n.includes('langu')) s.subtype = 'language';
    else if (n.includes('code') || n.includes('cod')) s.subtype = 'coding';
    else if (n.includes('business')) s.subtype = 'business';
    else if (n.includes('read')) s.subtype = 'reading';
    else if (n.includes('writ')) s.subtype = 'writing';
    else if (n.includes('engineer')) s.subtype = 'engineering';
    else s.subtype = 'custom';
    s.detail = s.detail || s.name || '';
    s.status = s.status || '';
    s.ladder = defaultLadderFor(s.subtype, s.detail);
    s.ladderDone = [];
  }
  if (!s.ladderDone) s.ladderDone = [];
  if (!s.ladderEarned) s.ladderEarned = [];
  if (!s.ladderXpLogs) s.ladderXpLogs = {};
  if (!s.ladderPreticked) s.ladderPreticked = [...s.ladderDone];
  if (s.workoutsSinceAttempt === undefined) s.workoutsSinceAttempt = 0;
  if (s.cardioEnabled === undefined) s.cardioEnabled = true;
  if (s.why === undefined) s.why = '';
  if (s.identity === undefined) s.identity = '';
  if (s.quitCriteria === undefined) s.quitCriteria = '';
  if (s.milestoneQuests === undefined) s.milestoneQuests = {};
  if (s.name){
    const n = s.name.trim().toLowerCase();
    const map = {
      'not decided yet':'Business development', 'not sure yet':'Book writing',
      'other': s.subtype === 'business' ? 'Business development' : s.subtype === 'writing' ? 'Book writing' : s.subtype === 'language' ? 'New language' : s.subtype === 'engineering' ? 'Engineering' : s.subtype === 'instrument' ? 'Instrument' : 'Skill'
    };
    if (map[n]) s.name = map[n];
  }
  if (!s.calibratedLevel && s.ladderPreticked && s.ladderPreticked.length > 0 && s.ladder && s.ladder.length > 0){
    const calLevel = calibrateFromPreTicks(s.ladderPreticked.length, s.ladder.length);
    if (calLevel > 1){
      s.calibratedLevel = calLevel;
      if (calLevel > (s.level || 1)){ s.level = calLevel; s.xp = 0; }
    }
  }
  // Clean up old single-fallback milestone quests
  if (s.milestoneQuests && s.ladder && s.ladder.length > 0){
    const idx = (function(){
      const done = s.ladderDone || [];
      for (let i = 0; i < s.ladder.length; i++) if (!done.includes(i)) return i;
      return -1;
    })();
    if (idx >= 0 && s.milestoneQuests[idx]){
      const qs = s.milestoneQuests[idx];
      const oldText = `${s.name}: ${s.ladder[idx]}`;
      if (qs.length === 1 && qs[0].text === oldText){
        delete s.milestoneQuests[idx];
      }
    }
  }
  return s;
}

let state = load();
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    const parsed = Object.assign(defaultState(), JSON.parse(raw));
    if (parsed.skills) parsed.skills = parsed.skills.map(migrateSkill);
    if (!parsed.equipment) parsed.equipment = [];
    if (!parsed.equipmentWeights) parsed.equipmentWeights = { dumbbell: 0, barbell: 0, barbellPlates: false, kettlebell: 0 };
    if (parsed.equipmentConfigured === undefined) parsed.equipmentConfigured = false;
    if (!parsed.timeBudget) parsed.timeBudget = 30;
    if (parsed.deloadEnabled === undefined) parsed.deloadEnabled = true;
    if (parsed.paused === undefined) parsed.paused = false;
    if (!parsed.firsts) parsed.firsts = [];
    if (!parsed.dailyBasics) parsed.dailyBasics = {};
    if (!parsed.ladderNotes) parsed.ladderNotes = {};
    if (!parsed.telos) parsed.telos = '';
    if (!parsed.committedUntil) parsed.committedUntil = '';
    if (!parsed.commitmentUnlockedDate) parsed.commitmentUnlockedDate = '';

    if (!parsed.startedAt){
      if (parsed.log && parsed.log.length > 0){
        const dates = parsed.log.map(e => e.date).filter(Boolean).sort();
        parsed.startedAt = dates[0] || today();
      } else {
        parsed.startedAt = today();
      }
    }

    (parsed.skills || []).forEach(s => {
      if (s.type === 'workout' && s.subtype === 'fitness' && !s.calibratedLevel){
        const str = (parsed.stats && parsed.stats.STR) || 5;
        const calLevel = calibrateFromSTR(str);
        if (calLevel > 1){
          s.calibratedLevel = calLevel;
          if (calLevel > (s.level || 1)){ s.level = calLevel; s.xp = 0; }
        }
      }
    });

    parsed.lastPlayerLevel = computeLevelFrom(parsed.stats, parsed.skills);
    parsed.lastPlayerRank = rankOf(parsed.lastPlayerLevel);
    return parsed;
  } catch(e){ return defaultState(); }
}

function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
  checkSkillTitles();
  checkStreakTitles();
  checkLevelUp();
  render();
}

function addXP(amount, note, id, date, skillId, opts){
  opts = opts || {};
  const entry = { id: id || newId(), date: date || today(), time: opts.time || null, xp: amount, note, skillId: skillId || null, finished: opts.finished, firstTime: opts.firstTime };
  state.totalXP += amount;
  state.log.unshift(entry);
  state.log = state.log.slice(0, 500);
  if (amount > 0 && !opts.skipStreak && (date || today()) === today() && !state.paused){
    markActivity();
  }
  return entry.id;
}

function markActivity(){
  const t = today();
  if (state.lastComplete === t) return;
  if (state.paused) return;
  state.streak = (state.lastComplete === yesterday()) ? state.streak + 1 : 1;
  state.lastComplete = t;
  if (state.streak % 7 === 0){
    addXP(50, `7-day streak (day ${state.streak})`, null, null, null, { skipStreak: true });
  }
}

function checkSkillTitles(){
  (state.skills || []).forEach(skill => {
    const t = titleForSkill(skill);
    if (t && !state.titles.includes(t)) state.titles.push(t);
  });
}

function checkStreakTitles(){
  STREAK_TITLES.forEach(({ days, title }) => {
    if (state.streak >= days && !state.titles.includes(title)){
      state.titles.push(title);
      setTimeout(() => showToast(`Title earned: ${title}`, 'var(--gold)'), 400);
    }
  });
}

function checkLevelUp(){
  const current = computePlayerLevel();
  const prev = state.lastPlayerLevel || 1;
  if (current > prev){
    const oldRank = rankOf(prev);
    const newRank = rankOf(current);
    state.lastPlayerLevel = current;
    state.lastPlayerRank = newRank;
    setTimeout(() => {
      if (newRank !== oldRank) showRankUp(newRank, current);
      else showLevelUp(current);
    }, 120);
  } else if (current < prev){
    const old = prev;
    state.lastPlayerLevel = current;
    state.lastPlayerRank = rankOf(current);
    showLevelAdjust(old, current, levelChangeReason);
    levelChangeReason = '';
  }
}

function showToast(msg, color){
  document.querySelectorAll('.levelup-toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'levelup-toast';
  if (color) el.style.color = color;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function showLevelUp(level){
  const el = document.createElement('div');
  el.className = 'levelup-overlay';
  el.innerHTML = `<div class="levelup-card"><div class="label">Level up</div><div class="big">Lv ${level}</div><div class="rank">Rank ${rankOf(level)}</div></div>`;
  const dismiss = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); };
  el.onclick = dismiss;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(dismiss, 2800);
}
function showRankUp(rank, level){
  const el = document.createElement('div');
  el.className = 'levelup-overlay rankup';
  el.innerHTML = `<div class="levelup-card rankup-card"><div class="label">Rank Up</div><div class="big rank-big">${rank}</div><div class="rank">Level ${level}</div></div>`;
  const dismiss = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 500); };
  el.onclick = dismiss;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(dismiss, 3500);
}
function showLevelAdjust(oldLvl, newLvl, reason){
  document.querySelectorAll('.levelup-toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'levelup-toast';
  el.style.color = newLvl < oldLvl ? 'var(--gold)' : 'var(--accent)';
  el.textContent = `Level ${oldLvl} → ${newLvl}${reason ? ' · ' + reason : ''}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ═══════════════════════════════════════════
   COMMITMENT — locks skill edits, 24h grace on unlock
   ═══════════════════════════════════════════ */
function commitmentActive(){
  if (!state.committedUntil) return false;
  if (state.committedUntil < today()) return false;
  if (state.commitmentUnlockedDate){
    const d = daysSinceDate(state.commitmentUnlockedDate);
    if (d !== null && d >= 1) return false;
  }
  return true;
}
function isLocked(){ return commitmentActive() && !state.commitmentUnlockedDate; }
function commitUnlockedGrace(){
  if (!state.committedUntil || state.committedUntil < today()) return false;
  if (!state.commitmentUnlockedDate) return false;
  const d = daysSinceDate(state.commitmentUnlockedDate);
  return d !== null && d < 1;
}
function commitRemainingDays(){
  if (!state.committedUntil) return 0;
  const d = daysSinceDate(state.committedUntil);
  return d === null ? 0 : Math.max(0, -d);
}
function commitGraceHoursRemaining(){
  if (!state.commitmentUnlockedDate) return 0;
  // grace ends 24 hours after unlockedDate (which is a date; treat as midnight + 24h from that date)
  const d = new Date(state.commitmentUnlockedDate + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  const ms = d.getTime() - Date.now();
  return Math.max(0, Math.ceil(ms / (1000*60*60)));
}

function doCommit(){
  if (commitmentActive() && state.commitmentUnlockedDate){
    // In grace period — re-lock, keep timer
    state.commitmentUnlockedDate = '';
  } else {
    // Fresh commit
    state.committedUntil = dateOffset(COMMIT_DAYS);
    state.commitmentUnlockedDate = '';
  }
  save();
}

function doUnlock(){
  state.commitmentUnlockedDate = today();
  save();
}

function doEndCommitment(){
  state.committedUntil = '';
  state.commitmentUnlockedDate = '';
  save();
}

/* ═══════════════════════════════════════════
   LADDER TICK/UNTICK
   ═══════════════════════════════════════════ */
function milestoneLogXP(i){ return Math.round(50 + i*10); }
function milestoneSkillXP(i){ return Math.round(100 + i*i*4); }

function tickMilestone(skill, i){
  skill.ladderDone = skill.ladderDone || [];
  skill.ladderEarned = skill.ladderEarned || [];
  skill.ladderXpLogs = skill.ladderXpLogs || {};
  skill.ladderPreticked = skill.ladderPreticked || [];

  if (skill.ladderDone.includes(i)) return;
  skill.ladderDone.push(i);

  if (skill.ladderPreticked.includes(i) && !skill.ladderXpLogs[i]){
    ensureMilestoneQuests(skill);
    return;
  }

  const firstKey = `${skill.id}:m${i}`;
  const isFirst = !(state.firsts || []).includes(firstKey);
  if (isFirst) state.firsts.push(firstKey);

  const ref = skill.ladderXpLogs[i];
  if (ref){
    const logXp = ref.logXp || milestoneLogXP(i);
    const skillXp = ref.skillXp !== undefined ? ref.skillXp : milestoneSkillXP(i);
    const mainId = addXP(logXp, ref.note, null, null, skill.id, { finished: true, firstTime: false });
    const oldRank = rankOf(skill.level);
    addSkillXP(skill, skillXp);
    const extra = [];
    const newRank = rankOf(skill.level);
    if (newRank !== oldRank) extra.push(addXP(0, `${skill.name} — Rank ${newRank}`, null, null, skill.id, { skipStreak: true }));
    else if (skill.level > 1) extra.push(addXP(0, `${skill.name} reached Lv ${skill.level}`, null, null, skill.id, { skipStreak: true }));
    skill.ladderXpLogs[i] = { logId: mainId, logXp, skillXp, note: ref.note, extraLogIds: extra };
  } else {
    const note = `${skill.name}: ${skill.ladder[i]}`;
    const baseLog = milestoneLogXP(i);
    const baseSkill = milestoneSkillXP(i);
    const logXp = isFirst ? baseLog * 2 : baseLog;
    const skillXp = isFirst ? baseSkill * 2 : baseSkill;
    if (!state.ladderNotes) state.ladderNotes = {};
    state.ladderNotes[firstKey] = (skill.ladderNotes && skill.ladderNotes[i]) || '';
    const logId = addXP(logXp, note, null, null, skill.id, { finished: true, firstTime: isFirst });
    const oldRank = rankOf(skill.level);
    const leveled = addSkillXP(skill, skillXp);
    const extra = [];
    if (leveled){
      const newRank = rankOf(skill.level);
      if (newRank !== oldRank) extra.push(addXP(0, `${skill.name} — Rank ${newRank}`, null, null, skill.id, { skipStreak: true }));
      else extra.push(addXP(0, `${skill.name} reached Lv ${skill.level}`, null, null, skill.id, { skipStreak: true }));
    }
    skill.ladderEarned.push(i);
    skill.ladderXpLogs[i] = { logId, logXp, skillXp, note, extraLogIds: extra };
  }
  ensureMilestoneQuests(skill);
}

function untickMilestone(skill, i){
  skill.ladderDone = (skill.ladderDone || []).filter(x => x !== i);
  const ref = skill.ladderXpLogs && skill.ladderXpLogs[i];
  if (ref && ref.logId){
    const logXp = ref.logXp || 20;
    const skillXp = ref.skillXp !== undefined ? ref.skillXp : 20;
    state.totalXP = Math.max(0, state.totalXP - logXp);
    state.log = state.log.filter(e => e.id !== ref.logId);
    if (ref.extraLogIds && ref.extraLogIds.length){
      const ex = new Set(ref.extraLogIds);
      state.log = state.log.filter(e => !ex.has(e.id));
    }
    subtractSkillXP(skill, skillXp);
    skill.ladderXpLogs[i] = { logId: null, logXp, skillXp, note: ref.note };
  }
}

function applyProgression(skill, answers){
  const questions = progressionFor(skill);
  let statusParts = [], preTick = null;
  questions.forEach(q => {
    if (q.type === 'days') return;
    if (q.onlyIf && !q.onlyIf(answers)) return;
    const val = answers[q.id]; if (!val) return;
    const opt = q.options.find(o => o.value === val); if (!opt) return;
    statusParts.push(opt.label);
    if (opt.preTick) preTick = opt.preTick;
  });
  skill.status = statusParts.join(' — ') || skill.status || '';
  if (skill.subtype === 'fitness' && skill.type === 'workout'){
    skill.plan = skill.plan || {};
    skill.plan.workoutDays = answers.workoutDays || [1,3,5];
    skill.plan.attemptDay = (typeof answers.attemptDay === 'number') ? answers.attemptDay : 0;
    skill.plan.exercises = deriveExercisesFromStats();
    skill.plan.calibratedTo = { STR: state.stats.STR, equipment: [...(state.equipment||[])], weights: { ...(state.equipmentWeights||{}) } };
  }
  if (answers.type) skill.detail = answers.type;
  if (preTick){
    skill.ladderPreticked = [...preTick];
    const merged = new Set([...preTick, ...(skill.ladderEarned || [])]);
    skill.ladderDone = [...merged];
  }
  applyCalibrationToSkill(skill);
  ensureMilestoneQuests(skill);
}

function questsForToday(){
  const day = new Date().getDay();
  const list = [];
  state.skills.filter(s => s.active).forEach(skill => {
    if (skill.type === 'workout' && skill.plan){
      const plan = skill.plan;
      if (day === plan.attemptDay){
        list.push({ id: `${skill.id}:attempt`, skillId: skill.id, kind: 'attempt', text: `${skill.name} — Attempt day: test your max reps`, xp: 50 });
      } else if (plan.workoutDays.includes(day)){
        const summary = plan.exercises.map(e => `${e.sets}×${e.reps} ${e.name}`).join(' · ');
        list.push({ id: `${skill.id}:workout`, skillId: skill.id, kind: 'workout', text: `${skill.name}: ${summary}`, xp: 15 });
      } else if (skill.subtype === 'fitness' && skill.cardioEnabled !== false){
        list.push({ id: `${skill.id}:cardio`, skillId: skill.id, kind: 'cardio', text: `${skill.name} cardio (VIT): 20 min brisk walk, cycle, or housework`, xp: 8 });
      }
    } else {
      ensureMilestoneQuests(skill);
      const idx = currentMilestoneIdx(skill);
      let quests = null;
      if (idx >= 0 && skill.milestoneQuests && skill.milestoneQuests[idx]) quests = skill.milestoneQuests[idx];
      else if (skill.quests) quests = skill.quests;
      if (quests){
        const milestone = (idx >= 0 && skill.ladder) ? skill.ladder[idx] : null;
        quests.forEach(q => list.push({ id: `${skill.id}:${q.id}`, skillId: skill.id, kind: 'standard', text: q.text, xp: q.xp, milestone }));
      }
    }
  });
  return list;
}
function isQuestDone(qid){ return !!(state.quests[today()] && state.quests[today()][qid]); }

function toggleQuest(quest){
  const t = today();
  state.quests[t] = state.quests[t] || {};
  const skill = state.skills.find(s => s.id === quest.skillId);
  const current = state.quests[t][quest.id];

  if (current){
    const data = (typeof current === 'object' && current !== null) ? current : null;
    if (data && data.logId){
      state.log = state.log.filter(e => e.id !== data.logId);
      if (data.extraLogIds && data.extraLogIds.length){
        const ex = new Set(data.extraLogIds);
        state.log = state.log.filter(e => !ex.has(e.id));
      }
      state.totalXP = Math.max(0, state.totalXP - (data.xp || 0));
      if (skill && data.skillXp !== undefined) subtractSkillXP(skill, data.skillXp);
    }
    if (quest.kind === 'workout' && skill){
      skill.workoutsSinceAttempt = Math.max(0, (skill.workoutsSinceAttempt || 0) - 1);
    }
    delete state.quests[t][quest.id];
    save();
    return;
  }

  const isFirst = !(state.firsts || []).includes(quest.id);
  const mult = isFirst ? 2 : 1;
  const awardedXp = quest.xp * mult;

  const logId = addXP(awardedXp, quest.text, null, null, quest.skillId, { finished: true, firstTime: isFirst, time: currentTime() });
  if (isFirst) state.firsts.push(quest.id);

  const extraLogIds = [];
  let skillXp = 0;
  if (skill){
    const oldRank = rankOf(skill.level);
    const leveled = addSkillXP(skill, awardedXp);
    skillXp = awardedXp;
    if (leveled){
      const newRank = rankOf(skill.level);
      if (newRank !== oldRank) extraLogIds.push(addXP(0, `${skill.name} — Rank ${newRank}`, null, null, skill.id, { skipStreak: true, time: currentTime() }));
      else extraLogIds.push(addXP(0, `${skill.name} reached Lv ${skill.level}`, null, null, skill.id, { skipStreak: true, time: currentTime() }));
    }
    if (quest.kind === 'workout') skill.workoutsSinceAttempt = (skill.workoutsSinceAttempt || 0) + 1;
  }
  state.quests[t][quest.id] = { logId, extraLogIds, xp: awardedXp, skillXp, isFirst };
  save();
  showObjectiveModal(quest, logId, skill, skillXp, isFirst);
}

function showObjectiveModal(quest, logId, skill, skillXp, isFirst){
  const question = isFirst
    ? `<div class="notice" style="background:rgba(255,200,87,.08);border-color:rgba(255,200,87,.3)"><b>First time.</b> 2× XP awarded. This is the moment the skill begins.</div>`
    : '';
  openModal(`
    <h2>${esc(quest.text)}</h2>
    ${question}
    <p class="small dim">Did you complete the full quest, or only part of it?</p>
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="primary" id="obj-full" style="flex:1">Full</button>
      <button class="ghost" id="obj-partial" style="flex:1">Partial</button>
    </div>
    <p class="small dim" style="margin-top:14px">Tap either to close. If you tapped wrong, un-tick the quest on the Quests tab and try again.</p>
  `);

  const finishPartial = () => {
    const entry = state.log.find(e => e.id === logId);
    if (entry){
      const refund = Math.round(entry.xp / 2);
      entry.xp -= refund;
      entry.finished = false;
      state.totalXP = Math.max(0, state.totalXP - refund);
      if (skill) subtractSkillXP(skill, refund);
      const cur = state.quests[today()][quest.id];
      if (cur && typeof cur === 'object'){ cur.xp -= refund; cur.skillXp = Math.max(0, (cur.skillXp || 0) - refund); cur.partial = true; }
      save();
    }
    closeModal();
  };
  const finishFull = () => closeModal();

  document.getElementById('obj-full').onclick = finishFull;
  document.getElementById('obj-partial').onclick = finishPartial;
}

function buildAIContext(skill){
  const lines = [];
  lines.push(`Player: ${state.name || 'unnamed'}. Player level ${computePlayerLevel()}. Streak: ${state.streak} days.`);
  if (state.telos) lines.push(`Telos: ${state.telos}.`);
  lines.push(`Stats: STR ${state.stats.STR}, AGI ${state.stats.AGI}, VIT ${state.stats.VIT}, INT ${state.stats.INT}, PER ${state.stats.PER}.`);
  const cutoff = dateOffset(-30);
  const recent = state.log.filter(e => e.date >= cutoff && e.xp > 0);
  if (recent.length){
    const totalXp = recent.reduce((s, e) => s + e.xp, 0);
    lines.push(`Last 30 days: ${recent.length} activities, ${totalXp} XP.`);
  } else lines.push('Last 30 days: no activity logged.');
  if (skill){
    lines.push(`Skill: ${skill.name}. Status: ${skill.status || 'unknown'}. Type: ${skill.subtype || 'custom'}.`);
    lines.push(`Skill level ${skill.level}/50. Ladder ${(skill.ladderDone||[]).length}/${(skill.ladder||[]).length} done.`);
    const idx = currentMilestoneIdx(skill);
    if (idx >= 0 && skill.ladder) lines.push(`Current milestone: ${skill.ladder[idx]}.`);
    if (skill.why) lines.push(`Why it matters: ${skill.why}`);
    if (skill.identity) lines.push(`Identity claim: ${skill.identity}`);
  }
  return lines.join('\n');
}
function buildQuestAIPrompt(skill){
  return `You are a coach. Here is the current state:\n\n${buildAIContext(skill)}\n\nGenerate 6 concrete daily practice quests for this skill at its current level. Each quest must be specific, self-contained, 20–60 min, doable at home without a coach. Every quest text MUST start with the skill name and a clear action verb.\n\nReturn ONLY a valid JSON array of 6 strings. No markdown, no preamble.`;
}
function buildLadderAIPrompt(skill){
  let extra = '';
  if (skill.subtype === 'business' && skill.detail && /not decided/i.test(skill.detail)){
    extra = `\n\nThe person hasn't chosen what business to start. First suggest 3 concrete ideas that fit 5–10 hrs/week and no capital. Then pick the most promising and produce 12–18 milestones for that business.`;
  }
  return `You are a coach. Here is the current state:\n\n${buildAIContext(skill)}\n\nGenerate 12–18 concrete progression milestones for this skill at its current stage.${extra}\n\nEach milestone must be specific, testable, and build on the previous one. Return ONLY a JSON array of milestone strings.`;
}
async function callAI(prompt, apiKey, baseUrl, model){
  const res = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], temperature: 0.8 })
  });
  if (!res.ok){ const b = await res.text().catch(() => ''); throw new Error(`API ${res.status}: ${b.slice(0,120)}`); }
  const data = await res.json();
  const text = data.choices[0].message.content.trim();
  return JSON.parse(text.replace(/^```(?:json)?\s*/, '').replace(/\s*```$/, ''));
}

function makeSkillFromTemplate(sug, detail){
  const subtype = sug.subtype || 'custom';
  const name = smartSkillName(sug, detail);
  const isWorkoutType = subtype === 'fitness' && ['Calisthenics','Weightlifting','Mixed fitness'].includes(detail);
  const skill = {
    id: newId(), name, subtype, detail: detail || '', status: '',
    active: true, level: 1, xp: 0,
    ladder: defaultLadderFor(subtype, detail), ladderDone: [], ladderEarned: [],
    ladderXpLogs: {}, ladderPreticked: [],
    workoutsSinceAttempt: 0, cardioEnabled: true,
    why: '', identity: '', quitCriteria: '', milestoneQuests: {},
    calibratedLevel: null,
    type: isWorkoutType ? 'workout' : 'standard'
  };
  if (isWorkoutType){
    skill.plan = { exercises: deriveExercisesFromStats(), workoutDays: [1,3,5], attemptDay: 0, calibratedTo: { STR: state.stats.STR, equipment: [...(state.equipment||[])], weights: { ...(state.equipmentWeights||{}) } } };
  } else {
    ensureMilestoneQuests(skill);
  }
  return skill;
}
